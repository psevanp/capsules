<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>N20 Exprimer un quotient</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:light;
    --bleu:#1a73e8; --bleu-clair:#e8f0fe;
    --vert:#16a34a; --vert-clair:#dcfce7;
    --rouge:#dc2626; --rouge-clair:#fee2e2;
    --orange:#ea580c; --orange-clair:#ffedd5;
    --violet:#7c3aed; --violet-clair:#f5f3ff;
    --gris:#94a3b8; --bg:#f0f4ff;
    --card:#ffffff; --texte:#1e293b; --border:#e2e8f0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; color:var(--texte); }
  header { display:flex; justify-content:center; margin-bottom:22px; }
  .header-row { display:flex; align-items:center; gap:14px; max-width:680px; width:100%; }
  .badge-code { display:inline-flex; align-items:center; justify-content:center; min-width:48px; height:48px; border-radius:12px; border:2.5px solid var(--bleu); background:var(--bleu-clair); font-family:'Baloo 2',cursive; font-size:1.3rem; font-weight:800; color:var(--bleu); flex-shrink:0; }
  .tache-label { font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; color:var(--bleu); line-height:1.3; }
  .progress-bar-wrap { width:100%; max-width:680px; background:#dbeafe; border-radius:99px; height:10px; margin-bottom:18px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:99px; transition:width 0.5s ease; }
  .steps-indicator { display:flex; gap:10px; margin-bottom:20px; }
  .step-dot { width:34px; height:34px; border-radius:50%; background:#dbeafe; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:#93c5fd; transition:all 0.4s; border:2px solid transparent; }
  .step-dot.active { background:var(--bleu); color:white; border-color:var(--bleu); transform:scale(1.15); box-shadow:0 0 0 4px #bfdbfe; }
  .step-dot.done { background:var(--vert); color:white; border-color:var(--vert); }
  .card { background:var(--card); border-radius:20px; padding:26px 24px; max-width:680px; width:100%; min-height:360px; display:flex; flex-direction:column; align-items:center; gap:14px; box-shadow:0 4px 24px rgba(26,115,232,0.10); position:relative; overflow-x:auto; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:20px 20px 0 0; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.4s ease both; }
  @keyframes pop { 0%{transform:scale(0.8);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  .pop { animation:pop 0.45s ease both; }
  .step-title { font-family:'Baloo 2',cursive; font-size:1.2rem; font-weight:800; color:var(--bleu); text-align:center; line-height:1.3; }
  .step-text { font-size:0.97rem; color:var(--texte); text-align:center; line-height:1.75; font-weight:600; max-width:540px; }
  .info { border-radius:12px; padding:12px 16px; font-weight:600; max-width:580px; width:100%; line-height:1.6; font-size:0.9rem; }
  .info.bleu   { background:var(--bleu-clair);   color:var(--bleu);   border-left:4px solid var(--bleu); }
  .info.violet { background:var(--violet-clair); color:var(--violet); border-left:4px solid var(--violet); }
  .info.vert   { background:var(--vert-clair);   color:var(--vert);   border-left:4px solid var(--vert); }
  .btn-complete { font-family:'Baloo 2',cursive; font-weight:700; font-size:0.95rem; border:2px solid var(--vert); cursor:pointer; border-radius:10px; padding:10px 22px; background:var(--vert-clair); color:var(--vert); transition:all 0.2s; }
  .btn-complete:hover { background:var(--vert); color:white; }
  .result-box { font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; text-align:center; background:#f1f5f9; border-radius:14px; padding:12px 20px; color:var(--texte); border:2px solid var(--border); max-width:480px; width:100%; line-height:1.6; }
  .recap-list { display:flex; flex-direction:column; gap:9px; max-width:580px; width:100%; }
  .recap-item { display:flex; align-items:flex-start; gap:12px; background:#f8faff; border-radius:12px; padding:11px 16px; font-size:0.92rem; font-weight:600; color:var(--texte); animation:fadeIn 0.4s ease both; border-left:4px solid transparent; line-height:1.5; }
  .recap-num { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:700; flex-shrink:0; color:white; margin-top:1px; }
  .nav { display:flex; gap:14px; margin-top:10px; align-items:center; }
  button.btn-nav { font-family:'Baloo 2',cursive; font-weight:700; font-size:1rem; border:none; cursor:pointer; border-radius:12px; padding:12px 28px; transition:all 0.2s; }
  .btn-next { background:linear-gradient(135deg,var(--bleu),var(--violet)); color:white; box-shadow:0 4px 14px rgba(26,115,232,0.3); }
  .btn-next:hover { transform:translateY(-2px); }
  .btn-next:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
  .btn-prev { background:#e0e7ff; color:var(--bleu); }
  .btn-prev:hover { background:#c7d2fe; }
  .step-counter { font-size:0.85rem; color:var(--gris); font-weight:700; }
  .answer-badge { display:inline-flex; align-items:center; justify-content:center; padding:6px 28px; border-radius:14px; border:3px solid var(--violet); background:var(--violet-clair); box-shadow:0 4px 16px rgba(124,58,237,0.18); }
  .pourquoi { position:relative; background:#f0fdfa; border-left:4px solid #0d9488; border-radius:10px; padding:12px 15px; font-size:0.92rem; font-weight:600; color:#134e4a; line-height:1.6; max-width:580px; width:100%; }
  .pq-lead { font-family:'Baloo 2',cursive; font-weight:800; color:#0d9488; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="badge-code">N20</div>
    <div class="tache-label">Exprimer un quotient</div>
  </div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-nav btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-nav btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
function fracSVG(num, den, col, fsNum, fsDen){
  col=col||'var(--texte)'; fsNum=fsNum||22; fsDen=fsDen||22;
  const W=Math.max(String(num).length,String(den).length)*fsNum*0.62+8;
  const yNum=fsNum, yTrait=yNum+Math.round(fsNum*0.28);
  const yDen=yTrait+3+Math.round(fsDen*0.93), H=yDen+4;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:inline-block;vertical-align:middle;overflow:visible">
    <text x="${W/2}" y="${yNum}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fsNum}" font-weight="800" fill="${col}">${num}</text>
    <rect x="0" y="${yTrait}" width="${W}" height="3" rx="1" fill="${col}"/>
    <text x="${W/2}" y="${yDen}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fsDen}" font-weight="800" fill="${col}">${den}</text>
  </svg>`;
}
function nomFrac(num,den){
  const noms={2:'demi',3:'tiers',4:'quart',5:'cinquième',6:'sixième',8:'huitième',10:'dixième',15:'quinzième'};
  let n=noms[den]||(den+'ème'); if(num>1&&den!==3) n+='s'; if(den===3) n='tiers';
  return num+' '+n;
}
function nomDenPlur(den){
  const m={2:'demis',3:'tiers',4:'quarts',5:'cinquièmes',6:'sixièmes',8:'huitièmes'};
  return m[den]||(den+'èmes');
}

const EXOS={};

// ── Ligne numérique ──────────────────────────────────────────────────────────
function drawLine(total, den, completed){
  const PADL=24, PADR=20, avail=360;
  const UW=avail/total;
  const lineY=50;
  const lineEnd=PADL+UW*total+UW*0.12;
  const W=lineEnd+PADR, H=lineY+28;
  function tc(x,y,t,fs,col){
    return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
  }
  function fracLab(cx,y,num,den,col,fs){
    fs=fs||11; col=col||'#7c3aed';
    const fw=Math.max(String(num).length,String(den).length)*fs*0.65+6;
    const yN=fs, yT=fs+2, yD=yT+2+fs;
    return `<g transform="translate(${cx-fw/2},${y})">
      <text x="${fw/2}" y="${yN}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${num}</text>
      <rect x="1" y="${yT}" width="${fw-2}" height="2" fill="${col}"/>
      <text x="${fw/2}" y="${yD}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${den}</text>
    </g>`;
  }
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;
  // ligne
  s+=`<line x1="${PADL}" y1="${lineY}" x2="${lineEnd}" y2="${lineY}" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>`;
  // toutes les graduations aux positions fractionnaires (toujours visibles)
  for(let k=0;k<=den;k++){
    const x=PADL+(k*total/den)*UW;
    s+=`<line x1="${x}" y1="${lineY-6}" x2="${x}" y2="${lineY+6}" stroke="${k===0||k===den?'#334155':'#7c3aed'}" stroke-width="2"/>`;
  }
  // étiquettes 0 et total (toujours, en dessous)
  s+=tc(PADL,lineY+22,'0',13,'#1e293b');
  s+=tc(PADL+avail,lineY+22,total,13,'#1e293b');
  if(!completed){
    // ? au-dessus de la première graduation fractionnaire
    const x=PADL+(total/den)*UW;
    s+=tc(x,lineY-14,'?',18,'#7c3aed');
  } else {
    // étiquettes fraction à toutes les positions (y compris la dernière)
    for(let k=1;k<=den;k++){
      const x=PADL+(k*total/den)*UW;
      const num=k*total;
      if(k===1){
        // première graduation mise en valeur
        const fs=13, col='#7c3aed';
        const fw=Math.max(String(num).length,String(den).length)*fs*0.65+10;
        const labH=fs+2+2+fs+6;
        s+=`<rect x="${x-fw/2-2}" y="${lineY-labH-8}" width="${fw+4}" height="${labH+4}" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>`;
        s+=fracLab(x,lineY-labH-6,num,den,col,fs);
      } else {
        s+=fracLab(x,lineY-40,num,den,'#94a3b8',11);
      }
    }
  }
  s+=`</svg>`;
  return s;
}

// ── Schéma rectangles (style N12) ────────────────────────────────────────────
function drawRect(total, den, completed){
  const PADL=24, PADR=20, avail=360, UH=44, GAP=10;
  const pw=avail/den;
  const W=PADL+avail+PADR, H=12+UH+GAP+UH+12;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;
  // rectangle vert (quantité)
  s+=`<rect x="${PADL}" y="12" width="${avail}" height="${UH}" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>`;
  s+=`<text x="${PADL+avail/2}" y="${12+UH/2+7}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="20" font-weight="800" fill="#14532d">${total}</text>`;
  // petits rectangles
  const ly=12+UH+GAP;
  for(let i=0;i<den;i++){
    const x=PADL+i*pw;
    if(completed){
      s+=`<rect x="${x}" y="${ly}" width="${pw-3}" height="${UH}" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>`;
      const cx=x+(pw-3)/2, cy=ly+UH/2;
      const fs=15;
      const bw=Math.max(String(total).length,String(den).length)*fs*0.6+4;
      s+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="#7c3aed">${total}</text>`;
      s+=`<rect x="${cx-bw/2}" y="${cy}" width="${bw}" height="2.5" rx="1" fill="#7c3aed"/>`;
      s+=`<text x="${cx}" y="${cy+fs+2}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="#7c3aed">${den}</text>`;
    } else {
      s+=`<rect x="${x}" y="${ly}" width="${pw-3}" height="${UH}" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>`;
      const cx=x+(pw-3)/2, cy=ly+UH/2;
      s+=`<text x="${cx}" y="${cy+7}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="20" font-weight="800" fill="#dc2626">?</text>`;
    }
  }
  s+=`</svg>`;
  return s;
}

// ── Bloc exercice ────────────────────────────────────────────────────────────
function exoBlock(uid, cfg){
  EXOS[uid]=cfg;
  const line0=drawLine(cfg.total,cfg.den,false);
  const rect0=drawRect(cfg.total,cfg.den,false);
  return `
<div id="wrap-${uid}" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
  <div id="line-${uid}" class="fade-in" style="width:100%">${line0}</div>
  <div id="rect-${uid}" class="fade-in" style="width:100%">${rect0}</div>
  <div id="badge-${uid}" style="display:none;flex-direction:column;align-items:center;gap:4px">
    <span class="fade-in" style="font-family:Baloo 2,cursive;font-size:0.95rem;font-weight:700;color:var(--texte)">${cfg.total} partagé en ${cfg.den} parts égales, c'est</span>
    <div class="answer-badge pop">${fracSVG(cfg.total,cfg.den,'var(--violet)',22,22)}</div>
  </div>
  <button class="btn-complete" onclick="completer('${uid}')">✏️ Compléter</button>
  <div id="res-${uid}" style="display:none;flex-direction:column;align-items:center;gap:8px;width:100%">
    <div class="info bleu fade-in" style="font-size:0.88rem">${cfg.explication}</div>
    <div class="result-box fade-in">${cfg.resultat}</div>
  </div>
</div>`;
}

function completer(uid){
  const c=EXOS[uid];
  document.getElementById('line-'+uid).innerHTML=drawLine(c.total,c.den,true);
  document.getElementById('rect-'+uid).innerHTML=drawRect(c.total,c.den,true);
  document.getElementById('badge-'+uid).style.display='flex';
  document.getElementById('wrap-'+uid).querySelector('.btn-complete').style.display='none';
  document.getElementById('res-'+uid).style.display='flex';
}

// ─────────────────────────────────────────────────────────────────────────────
const STEPS=[

// 0 — Règle
()=>`
<div class="step-title pop">💡 Quotient, division et partage</div>
<div class="pourquoi fade-in"><span class="pq-lead">🤔 Pourquoi ?</span> Une fraction est aussi le partage d'un nombre en parts égales. Travailler sur cette vision de la fraction permet de comprendre de manière plus complète ce qu'elle est.</div>
<div class="recap-list">
  ${[
    ['var(--bleu)',  'Un <strong>quotient</strong>, c\'est le résultat d\'une <strong>division</strong>.'],
    ['var(--violet)','Quand on partage un nombre en plusieurs <strong>parts égales</strong>, la division nous donne la <strong>valeur de chaque part</strong>.'],
  ].map(([c,t],i)=>`
    <div class="recap-item fade-in" style="animation-delay:${i*0.12}s;border-left-color:${c}">
      <div class="recap-num" style="background:${c}">${i+1}</div>
      <span>${t}</span>
    </div>`).join('')}
</div>
`,

// 1 — 5 ÷ 3
()=>`
<div class="step-title pop">✏️ 5 partagé en 3</div>
${exoBlock('ex1',{total:5,den:3,
  explication:`5 n'est pas dans la table de 3, donc on le transforme en <strong>tiers</strong>.<br>
5 = ${nomFrac(15,3)}.<br>
${nomFrac(15,3)} partagés en 3 parts égales : ${nomFrac(5,3)} chacune.<br><span style="color:#94a3b8">car 15 = 3 × 5.</span>`,
  resultat:`Le tiers de 5, c'est ${nomFrac(5,3)}.<br>
<span style="font-size:0.9rem;color:var(--vert)">On vérifie : 3 × ${nomFrac(5,3)} = ${nomFrac(15,3)} = 5 ✓</span>`
})}`,

// 2 — 7 ÷ 5
()=>`
<div class="step-title pop">✏️ 7 partagé en 5</div>
${exoBlock('ex2',{total:7,den:5,
  explication:`7 n'est pas dans la table de 5, donc on le transforme en <strong>cinquièmes</strong>.<br>
7 = ${nomFrac(35,5)}.<br>
${nomFrac(35,5)} partagés en 5 parts égales : ${nomFrac(7,5)} chacune.<br><span style="color:#94a3b8">car 35 = 5 × 7.</span>`,
  resultat:`Le cinquième de 7, c'est ${nomFrac(7,5)}.<br>
<span style="font-size:0.9rem;color:var(--vert)">On vérifie : 5 × ${nomFrac(7,5)} = ${nomFrac(35,5)} = 7 ✓</span>`
})}`,

// 3 — 5 ÷ 4
()=>`
<div class="step-title pop">✏️ 5 partagé en 4</div>
${exoBlock('ex3',{total:5,den:4,
  explication:`5 n'est pas dans la table de 4, donc on le transforme en <strong>quarts</strong>.<br>
5 = ${nomFrac(20,4)}.<br>
${nomFrac(20,4)} partagés en 4 parts égales : ${nomFrac(5,4)} chacune.<br><span style="color:#94a3b8">car 20 = 4 × 5.</span>`,
  resultat:`Le quart de 5, c'est ${nomFrac(5,4)}.<br>
<span style="font-size:0.9rem;color:var(--vert)">On vérifie : 4 × ${nomFrac(5,4)} = ${nomFrac(20,4)} = 5 ✓</span>`
})}`,

// 4 — 7 ÷ 3
()=>`
<div class="step-title pop">✏️ 7 partagé en 3</div>
${exoBlock('ex4',{total:7,den:3,
  explication:`7 n'est pas dans la table de 3, donc on le transforme en <strong>tiers</strong>.<br>
7 = ${nomFrac(21,3)}.<br>
${nomFrac(21,3)} partagés en 3 parts égales : ${nomFrac(7,3)} chacune.<br><span style="color:#94a3b8">car 21 = 3 × 7.</span>`,
  resultat:`Le tiers de 7, c'est ${nomFrac(7,3)}.<br>
<span style="font-size:0.9rem;color:var(--vert)">On vérifie : 3 × ${nomFrac(7,3)} = ${nomFrac(21,3)} = 7 ✓</span>`
})}`,

// 5 — Bilan
()=>`
<div class="step-title pop">🏆 Ce qu'il faut retenir</div>
<div class="recap-list">
  ${[
    [`var(--bleu)`,  `Une fraction est le <strong>résultat d'une division</strong> : ${fracSVG(5,3,'var(--bleu)',14,14)} c'est 5 ÷ 3.`],
    [`var(--violet)`,`Si on <strong>multiplie</strong> une fraction par son dénominateur, on retrouve le <strong>numérateur</strong> : 3 × ${fracSVG(5,3,'var(--violet)',14,14)} = 5.`],
  ].map(([c,t],i)=>`
    <div class="recap-item" style="animation-delay:${i*0.09}s;border-left-color:${c}">
      <div class="recap-num" style="background:${c}">${i+1}</div>
      <span>${t}</span>
    </div>`).join('')}
</div>`,
];

let cur=0; const N=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=STEPS[cur](); card.className='card fade-in';
  document.getElementById('progressBar').style.width=(cur/(N-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator'); ind.innerHTML='';
  for(let i=0;i<N;i++){
    const d=document.createElement('div');
    d.className='step-dot'+(i===cur?' active':i<cur?' done':'');
    d.textContent=i<cur?'✓':i+1; ind.appendChild(d);
  }
  document.getElementById('counter').textContent=`Page ${cur+1} / ${N}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===N-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===N-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
</body>
</html>
