<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>N5 Comparer des nombres entiers</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:light;
    --bleu:#1a73e8; --bleu-clair:#e8f0fe;
    --orange:#ea580c; --orange-clair:#ffedd5;
    --vert:#16a34a; --vert-clair:#f0fdf4;
    --violet:#7c3aed; --violet-clair:#f5f3ff;
    --rouge:#dc2626; --rouge-clair:#fee2e2;
    --gris:#94a3b8; --bg:#f0f4ff;
    --card:#ffffff; --texte:#1e293b; --border:#e2e8f0;
    --cote:#1251a3;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; color:var(--texte); }
  header { display:flex; justify-content:center; margin-bottom:22px; }
  .header-row { display:flex; align-items:center; gap:14px; max-width:680px; width:100%; }
  .badge-code { display:inline-flex; align-items:center; justify-content:center; min-width:48px; height:48px; border-radius:12px; border:2.5px solid var(--bleu); background:var(--bleu-clair); font-family:'Baloo 2',cursive; font-size:1.3rem; font-weight:800; color:var(--bleu); flex-shrink:0; }
  .tache-label { font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; color:var(--bleu); line-height:1.3; }
  .progress-bar-wrap { width:100%; max-width:680px; background:#dbeafe; border-radius:99px; height:10px; margin-bottom:18px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:99px; transition:width 0.5s ease; }
  .steps-indicator { display:flex; gap:10px; margin-bottom:20px; }
  .step-dot { width:34px; height:34px; border-radius:50%; background:#dbeafe; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:#93c5fd; transition:all 0.4s; border:2px solid transparent; }
  .step-dot.active { background:var(--bleu); color:white; border-color:var(--bleu); transform:scale(1.15); box-shadow:0 0 0 4px #bfdbfe; }
  .step-dot.done   { background:var(--vert); color:white; border-color:var(--vert); }
  .card { background:var(--card); border-radius:20px; padding:26px 28px; max-width:680px; width:100%; min-height:360px; display:flex; flex-direction:column; align-items:center; gap:14px; box-shadow:0 4px 24px rgba(26,115,232,0.10); position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:20px 20px 0 0; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.4s ease both; }
  @keyframes pop { 0%{transform:scale(0.8);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  .pop { animation:pop 0.45s ease both; }
  .step-title { font-family:'Baloo 2',cursive; font-size:1.2rem; font-weight:800; color:var(--bleu); text-align:center; line-height:1.3; }
  .step-text  { font-size:0.97rem; color:var(--texte); text-align:center; line-height:1.75; max-width:540px; font-weight:600; }
  .info { border-radius:12px; padding:12px 18px; font-size:0.93rem; font-weight:600; max-width:580px; width:100%; line-height:1.6; }
  .info.bleu   { background:var(--bleu-clair);   color:var(--bleu);   border-left:4px solid var(--bleu); }
  .info.orange { background:var(--orange-clair); color:var(--orange); border-left:4px solid var(--orange); }
  .info.vert   { background:var(--vert-clair);   color:var(--vert);   border-left:4px solid var(--vert); }
  .info.violet { background:var(--violet-clair); color:var(--violet); border-left:4px solid var(--violet); }

  /* Résultat de comparaison */
  .resultat { display:flex; align-items:center; justify-content:center; gap:14px; font-family:'Baloo 2',cursive; font-size:1.6rem; font-weight:800; }
  .res-nb1  { color:var(--orange); }
  .res-nb2  { color:var(--bleu); }
  .res-sign { color:var(--rouge); font-size:2rem; }

  .recap-list { display:flex; flex-direction:column; gap:9px; max-width:580px; width:100%; }
  .recap-item { display:flex; align-items:flex-start; gap:12px; background:#f8faff; border-radius:12px; padding:11px 16px; font-size:0.93rem; font-weight:600; color:var(--texte); animation:fadeIn 0.4s ease both; border-left:4px solid transparent; line-height:1.5; }
  .recap-num  { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:700; flex-shrink:0; color:white; margin-top:1px; }
  .nav { display:flex; gap:14px; margin-top:10px; align-items:center; }
  button { font-family:'Baloo 2',cursive; font-weight:700; font-size:1rem; border:none; cursor:pointer; border-radius:12px; padding:12px 28px; transition:all 0.2s; }
  .btn-next { background:linear-gradient(135deg,var(--bleu),var(--violet)); color:white; box-shadow:0 4px 14px rgba(26,115,232,0.3); }
  .btn-next:hover { transform:translateY(-2px); }
  .btn-next:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
  .btn-prev { background:#e0e7ff; color:var(--bleu); }
  .btn-prev:hover { background:#c7d2fe; }
  .btn-complete { font-family:'Baloo 2',cursive; font-weight:700; font-size:0.95rem; border:2px solid var(--vert); cursor:pointer; border-radius:10px; padding:10px 22px; background:var(--vert-clair); color:var(--vert); transition:all 0.2s; }
  .btn-complete:hover { background:var(--vert); color:white; }
  .step-counter { font-size:0.85rem; color:var(--gris); font-weight:700; }
  .pourquoi { position:relative; background:#f0fdfa; border-left:4px solid #0d9488; border-radius:10px; padding:12px 15px; font-size:0.92rem; font-weight:600; color:#134e4a; line-height:1.6; max-width:580px; width:100%; }
  .pq-lead { font-family:'Baloo 2',cursive; font-weight:800; color:#0d9488; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="badge-code">N5</div>
    <div class="tache-label">Comparer des nombres entiers</div>
  </div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
// ── Cote dessin technique (pour droite numérique) ────────────────────────────
const COTE = '#1251a3';
function coteLine(x1,y1,x2,y2,label,col,t,lox,loy,anc){
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  const nx=-dy/len,ny=dx/len; t=t||5;
  const lx=(x1+x2)/2+(lox||0),ly=(y1+y2)/2+(loy||0);
  return `
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="${x1-nx*t}" y1="${y1-ny*t}" x2="${x1+nx*t}" y2="${y1+ny*t}" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="${x2-nx*t}" y1="${y2-ny*t}" x2="${x2+nx*t}" y2="${y2+ny*t}" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="${x1},${y1} ${x1+dx/len*10+nx*4},${y1+dy/len*10+ny*4} ${x1+dx/len*10-nx*4},${y1+dy/len*10-ny*4}" fill="${col}"/>
    <polygon points="${x2},${y2} ${x2-dx/len*10+nx*4},${y2-dy/len*10+ny*4} ${x2-dx/len*10-nx*4},${y2-dy/len*10-ny*4}" fill="${col}"/>
    <text x="${lx}" y="${ly}" text-anchor="${anc||'middle'}" font-family="Baloo 2,cursive" font-size="12" font-weight="800" fill="${col}">${label}</text>`;
}

// ── Tableau de numération (deux nombres) ─────────────────────────────────────
// cols     : [{label}]  — noms des rangs, du plus grand au plus petit
// row1/row2: [{val, hl}]  hl=true → mettre en évidence (premier rang différent)
// col1/col2: couleur de chaque nombre
function buildTableau2(cols, row1, row2, c1, c2, reveal) {
  const CW=62, HDR=24, ROW=52;
  const W=cols.length*CW, H=HDR+ROW*2;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="white" stroke="var(--border)" stroke-width="2"/>`;
  // header
  cols.forEach((c,i)=>{
    const x=i*CW;
    if(i>0) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--border)" stroke-width="1.5"/>`;
    s+=`<rect x="${x}" y="0" width="${CW}" height="${HDR}" fill="#f8faff"/>`;
    s+=`<text x="${x+CW/2}" y="${HDR-7}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="9" font-weight="700" fill="var(--gris)" letter-spacing="0.3">${c.label.toUpperCase()}</text>`;
  });
  s+=`<line x1="0" y1="${HDR}" x2="${W}" y2="${HDR}" stroke="var(--border)" stroke-width="1.5"/>`;
  s+=`<line x1="0" y1="${HDR+ROW}" x2="${W}" y2="${HDR+ROW}" stroke="var(--border)" stroke-width="1.5"/>`;
  // rows
  [row1, row2].forEach((row, ri)=>{
    const yBase=HDR+ri*ROW;
    const nc=ri===0?c1:c2;
    row.forEach((cell,ci)=>{
      const x=ci*CW;
      if(cell.hl && reveal) s+=`<rect x="${x+1}" y="${yBase+1}" width="${CW-2}" height="${ROW-2}" rx="4" fill="${ri===0?'var(--orange-clair)':'var(--bleu-clair)'}"/>`;
      if(cell.val!==undefined&&cell.val!=='')
        s+=`<text x="${x+CW/2}" y="${yBase+ROW/2+9}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="22" font-weight="800" fill="${cell.hl?(ri===0?'var(--orange)':'var(--bleu)'):nc}">${cell.val}</text>`;
    });
  });
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="none" stroke="var(--border)" stroke-width="2"/>`;
  s+=`</svg>`;
  return `<div class="fade-in" style="display:flex;justify-content:center;width:100%">${s}</div>`;
}

// ── Droite numérique ─────────────────────────────────────────────────────────
// borneG, borneD : bornes affichées (avec ticks et labels)
// nb1, nb2       : les deux nombres à placer
// col1/col2      : couleurs
// options.extras : [{v, label?}] graduations intermédiaires supplémentaires
// options.extL/extR : pixels de dépassement gauche/droite
function buildDroite(borneG, borneD, nb1, nb2, label1, label2, col1, col2, options, reveal) {
  options = options || {};
  const extL = options.extL || 0;
  const extR = options.extR || 0;
  const extras = options.extras || [];

  const W=500, LM=30+extL, RM=30+extR, lineW=W-LM-RM;
  const lineY=44, tickH=8, ptR=6;
  const totalH=lineY+48;

  // La plage de valeurs couvre borneG→borneD
  // Le dessin peut dépasser de extL/extR pixels
  function xOf(v){ return LM + (v-borneG)/(borneD-borneG)*lineW; }

  let s=`<svg width="${W}" height="${totalH}" viewBox="0 0 ${W} ${totalH}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;

  // ligne principale (avec dépassements)
  s+=`<line x1="${LM-extL}" y1="${lineY}" x2="${LM+lineW+extR}" y2="${lineY}" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>`;

  // bornes principales
  [borneG, borneD].forEach((v,bi)=>{
    const showLabel = !(options.bornesDLabel && options.bornesDLabel[bi]===false);
    const showTick  = !(options.bornesDTick  && options.bornesDTick[bi]===false);
    const x=xOf(v);
    if(showTick)
      s+=`<line x1="${x}" y1="${lineY-tickH}" x2="${x}" y2="${lineY+tickH}" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>`;
    if(showLabel)
      s+=`<text x="${x}" y="${lineY+tickH+14}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="11" font-weight="800" fill="#94a3b8">${v.toLocaleString('fr-FR')}</text>`;
  });

  // graduations intermédiaires (avec niveau alterné pour éviter chevauchement)
  extras.forEach((e,ei)=>{
    const x=xOf(e.v);
    const niveau = e.niveau||0; // 0=normal, 1=décalé vers le bas
    const labDY = niveau===1 ? tickH+26 : tickH+14;
    s+=`<line x1="${x}" y1="${lineY-5}" x2="${x}" y2="${lineY+5}" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>`;
    if(e.label!==false)
      s+=`<text x="${x}" y="${lineY+labDY}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="10" font-weight="700" fill="#94a3b8">${(e.label||e.v).toLocaleString('fr-FR')}</text>`;
  });

  // placer les deux nombres (au clic seulement)
  if(reveal){
  const close = Math.abs(xOf(nb1)-xOf(nb2)) < 44;
  [[nb1,col1,close?-28:-20],[nb2,col2,close?-8:-20]].forEach(([v,col,dy])=>{
    const x=xOf(v);
    s+=`<circle cx="${x}" cy="${lineY}" r="${ptR}" fill="${col}"/>`;
    s+=`<line x1="${x}" y1="${lineY-tickH}" x2="${x}" y2="${lineY+tickH}" stroke="${col}" stroke-width="2" stroke-linecap="round"/>`;
    s+=`<text x="${x}" y="${lineY+dy}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="12" font-weight="800" fill="${col}">${v.toLocaleString('fr-FR')}</text>`;
  });
  }

  s+=`</svg>`;
  return `<div class="fade-in" style="display:flex;justify-content:center;width:100%">${s}</div>`;
}

// ── Steps ────────────────────────────────────────────────────────────────────
const STEPS = [

// 0 — L'idée
() => `
<div class="step-title pop">💡 Comparer deux nombres entiers</div>
<div class="pourquoi fade-in"><span class="pq-lead">🤔 Pourquoi ?</span> Les nombres sont utilisés pour représenter des quantités, il est important de pouvoir comparer ces quantités.</div>
<p class="step-text fade-in">
  <strong style="color:var(--orange)">Règle 1</strong> — Si les deux nombres n'ont pas le même nombre de chiffres,
  le plus grand est celui qui en a le <strong>plus</strong>.<br><br>
  <strong style="color:var(--bleu)">Règle 2</strong> — S'ils ont le même nombre de chiffres,
  on compare les chiffres rang par rang, <strong>en partant du plus grand rang</strong>.<br>
  Dès qu'un chiffre est plus grand que l'autre, le nombre correspondant est le plus grand.<br>
  Si les chiffres sont identiques, on passe au rang suivant.
</p>
<div class="info bleu fade-in">
  📌 On utilise le signe <strong style="color:var(--rouge)">&lt;</strong> (plus petit que)
  ou <strong style="color:var(--rouge)">&gt;</strong> (plus grand que) pour écrire le résultat.
</div>
`,

// 1 — Nombres de chiffres différents : 847 vs 3 210
() => `
<div class="step-title pop">✏️ Exemple : 847 et 3 210</div>
${buildTableau2(
  [{label:'Milliers'},{label:'Centaines'},{label:'Dizaines'},{label:'Unités'}],
  [{val:''},{val:'8'},{val:'4'},{val:'7'}],
  [{val:'3',hl:true},{val:'2'},{val:'1'},{val:'0'}],
  'var(--orange)', 'var(--bleu)', revealed
)}
${buildDroite(0,4000, 847,3210, '847','3 210', 'var(--orange)','var(--bleu)',
  {extras:[{v:100,niveau:0},{v:1000,niveau:0},{v:2000,niveau:1},{v:3000,niveau:0}], bornesDLabel:[false,false], bornesDTick:[true,false]}, revealed
)}
<div class="resultat fade-in">
  <span class="res-nb1">847</span>
  <span class="res-sign">${revealed?'&lt;':'?'}</span>
  <span class="res-nb2">3 210</span>
</div>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="info bleu fade-in">
  <strong style="color:var(--orange)">847</strong> a <strong style="color:var(--orange)">3 chiffres</strong>,
  <strong style="color:var(--bleu)">3 210</strong> a <strong style="color:var(--bleu)">4 chiffres</strong>.<br>
  3 210 a plus de chiffres → 3 210 est plus grand.
</div>`:''}
`,

// 2 — Même nb de chiffres, premier rang différent : 4 738 vs 6 291
() => `
<div class="step-title pop">✏️ Exemple : 4 738 et 6 291</div>
${buildTableau2(
  [{label:'Milliers'},{label:'Centaines'},{label:'Dizaines'},{label:'Unités'}],
  [{val:'4',hl:true},{val:'7'},{val:'3'},{val:'8'}],
  [{val:'6',hl:true},{val:'2'},{val:'9'},{val:'1'}],
  'var(--orange)', 'var(--bleu)', revealed
)}
${buildDroite(4000,7000, 4738,6291, '4 738','6 291', 'var(--orange)','var(--bleu)',
  {extL:20, extR:20, extras:[{v:5000},{v:6000}]}, revealed
)}
<div class="resultat fade-in">
  <span class="res-nb1">4 738</span>
  <span class="res-sign">${revealed?'&lt;':'?'}</span>
  <span class="res-nb2">6 291</span>
</div>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="info bleu fade-in">
  Même nombre de chiffres : 4.<br>
  On compare rang par rang en partant de la gauche.<br>
  Milliers : <strong style="color:var(--orange)">4</strong> &lt; <strong style="color:var(--bleu)">6</strong> → 6 291 est plus grand.
</div>`:''}
`,

// 3 — Même nb de chiffres, premier rang identique : 47 382 vs 47 915
() => `
<div class="step-title pop">✏️ Exemple : 47 382 et 47 915</div>
${buildTableau2(
  [{label:'Diz. milliers'},{label:'Milliers'},{label:'Centaines'},{label:'Dizaines'},{label:'Unités'}],
  [{val:'4'},{val:'7'},{val:'3',hl:true},{val:'8'},{val:'2'}],
  [{val:'4'},{val:'7'},{val:'9',hl:true},{val:'1'},{val:'5'}],
  'var(--orange)', 'var(--bleu)', revealed
)}
${buildDroite(47300,48000, 47382,47915, '47 382','47 915', 'var(--orange)','var(--bleu)',
  {extL:20, extR:20, extras:[{v:47400},{v:47500},{v:47600},{v:47700},{v:47800},{v:47900}], bornesDLabel:[false,false], bornesDTick:[false,false]}, revealed
)}
<div class="resultat fade-in">
  <span class="res-nb1">47 382</span>
  <span class="res-sign">${revealed?'&lt;':'?'}</span>
  <span class="res-nb2">47 915</span>
</div>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="info bleu fade-in">
  Dizaines de milliers : <strong>4 = 4</strong> → identiques, on passe.<br>
  Milliers : <strong>7 = 7</strong> → identiques, on passe.<br>
  Centaines : <strong style="color:var(--orange)">3</strong> &lt; <strong style="color:var(--bleu)">9</strong> → 47 915 est plus grand.
</div>`:''}
`,

// 4 — Plusieurs rangs identiques : 304 754 vs 304 728
() => `
<div class="step-title pop">✏️ Exemple : 304 754 et 304 728</div>
${buildTableau2(
  [{label:'C. milliers'},{label:'Diz. mill.'},{label:'Milliers'},{label:'Centaines'},{label:'Dizaines'},{label:'Unités'}],
  [{val:'3'},{val:'0'},{val:'4'},{val:'7'},{val:'5',hl:true},{val:'4'}],
  [{val:'3'},{val:'0'},{val:'4'},{val:'7'},{val:'2',hl:true},{val:'8'}],
  'var(--orange)', 'var(--bleu)', revealed
)}
${buildDroite(304720,304760, 304754,304728, '304 754','304 728', 'var(--orange)','var(--bleu)',
  {extL:20, extR:20, extras:[{v:304730},{v:304740},{v:304750}], bornesDTick:[false,false], bornesDLabel:[false,false]}, revealed
)}
<div class="resultat fade-in">
  <span class="res-nb1">304 754</span>
  <span class="res-sign">${revealed?'&gt;':'?'}</span>
  <span class="res-nb2">304 728</span>
</div>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="info bleu fade-in">
  Centaines de milliers : <strong>3 = 3</strong> → on passe.<br>
  Dizaines de milliers : <strong>0 = 0</strong> → on passe.<br>
  Milliers : <strong>4 = 4</strong> → on passe.<br>
  Centaines : <strong>7 = 7</strong> → on passe.<br>
  Dizaines : <strong style="color:var(--orange)">5</strong> &gt; <strong style="color:var(--bleu)">2</strong> → 304 754 est plus grand.
</div>`:''}
`,

// 5 — Récap
() => `
<div class="step-title pop">🏆 Ce qu'il faut retenir</div>
<div class="recap-list">
  ${[
    ['var(--orange)', 'Si les deux nombres n\'ont <strong>pas le même nombre de chiffres</strong>, le plus grand est celui qui en a le plus.'],
    ['var(--bleu)',   'S\'ils ont le <strong>même nombre de chiffres</strong>, on compare rang par rang en partant de la gauche.'],
    ['var(--violet)', 'Dès qu\'un chiffre est plus grand que l\'autre, le nombre correspondant est le plus grand. Si les chiffres sont identiques, on passe au rang suivant.'],
    ['var(--rouge)',  'On écrit le résultat avec <strong>&lt;</strong> (plus petit que) ou <strong>&gt;</strong> (plus grand que).'],
  ].map(([c,t],i)=>`
    <div class="recap-item" style="animation-delay:${i*0.09}s;border-left-color:${c}">
      <div class="recap-num" style="background:${c}">${i+1}</div>
      <span>${t}</span>
    </div>`).join('')}
</div>
`,
];

let cur=0, revealed=false; const N=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=STEPS[cur](); card.className='card fade-in';
  document.getElementById('progressBar').style.width=(cur/(N-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator'); ind.innerHTML='';
  for(let i=0;i<N;i++){
    const d=document.createElement('div');
    d.className='step-dot'+(i===cur?' active':i<cur?' done':'');
    d.textContent=i<cur?'✓':i+1; ind.appendChild(d);
  }
  document.getElementById('counter').textContent=`Page ${cur+1} / ${N}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===N-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===N-1?0:cur+1;revealed=false;render();}
function prev(){if(cur>0){cur--;revealed=false;render();}}
function completer(){revealed=true;render();}
render();
</script>
</body>
</html>
