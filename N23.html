<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>N23 Transformer une fraction décimale</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bleu:#1a73e8;--bleu-clair:#e8f0fe;--vert:#16a34a;--vert-clair:#dcfce7;--orange:#ea580c;--orange-clair:#ffedd5;--violet:#7c3aed;--violet-clair:#f5f3ff;--gris:#94a3b8;--bg:#f0f4ff;--card:#fff;--texte:#1e293b;--border:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;color:var(--texte);}
  header{display:flex;justify-content:center;margin-bottom:22px;}
  .header-row{display:flex;align-items:center;gap:14px;max-width:680px;width:100%;}
  .badge-code{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;border-radius:12px;border:2.5px solid var(--bleu);background:var(--bleu-clair);font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800;color:var(--bleu);flex-shrink:0;}
  .tache-label{font-family:'Baloo 2',cursive;font-size:1.05rem;font-weight:800;color:var(--bleu);line-height:1.3;}
  .progress-bar-wrap{width:100%;max-width:680px;background:#dbeafe;border-radius:99px;height:10px;margin-bottom:18px;overflow:hidden;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--bleu),var(--violet));border-radius:99px;transition:width .5s ease;}
  .steps-indicator{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
  .step-dot{width:32px;height:32px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:#93c5fd;transition:all .4s;border:2px solid transparent;}
  .step-dot.active{background:var(--bleu);color:#fff;border-color:var(--bleu);transform:scale(1.15);box-shadow:0 0 0 4px #bfdbfe;}
  .step-dot.done{background:var(--vert);color:#fff;border-color:var(--vert);}
  .card{background:var(--card);border-radius:20px;padding:26px 24px;max-width:680px;width:100%;min-height:340px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 4px 24px rgba(26,115,232,.10);position:relative;overflow-x:auto;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--bleu),var(--violet));border-radius:20px 20px 0 0;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeIn .4s ease both;}
  @keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .45s ease both;}
  .step-title{font-family:'Baloo 2',cursive;font-size:1.12rem;font-weight:800;color:var(--bleu);text-align:center;line-height:1.3;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;}
  .info{border-radius:12px;padding:12px 16px;font-weight:600;max-width:580px;width:100%;line-height:1.6;font-size:.9rem;}
  .info.bleu{background:var(--bleu-clair);color:var(--bleu);border-left:4px solid var(--bleu);}
  .info.violet{background:var(--violet-clair);color:var(--violet);border-left:4px solid var(--violet);}
  .info.vert{background:var(--vert-clair);color:var(--vert);border-left:4px solid var(--vert);}
  .btn-complete{font-family:'Baloo 2',cursive;font-weight:700;font-size:.95rem;border:2px solid var(--vert);cursor:pointer;border-radius:10px;padding:10px 22px;background:var(--vert-clair);color:var(--vert);transition:all .2s;}
  .btn-complete:hover{background:var(--vert);color:#fff;}
  .btn-zoom{font-family:'Baloo 2',cursive;font-weight:700;font-size:.9rem;border:2px solid var(--violet);cursor:pointer;border-radius:10px;padding:8px 18px;background:var(--violet-clair);color:var(--violet);transition:all .2s;align-items:center;gap:6px;}
  .btn-zoom:hover{background:var(--violet);color:#fff;}
  .recap-list{display:flex;flex-direction:column;gap:9px;max-width:580px;width:100%;}
  .recap-item{display:flex;align-items:flex-start;gap:12px;background:#f8faff;border-radius:12px;padding:11px 16px;font-size:.92rem;font-weight:600;color:var(--texte);animation:fadeIn .4s ease both;border-left:4px solid transparent;line-height:1.5;}
  .recap-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;flex-shrink:0;color:#fff;margin-top:1px;}
  .calc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-family:'Baloo 2',cursive;font-size:1.15rem;font-weight:800;}
  .calc .op{color:var(--gris);}
  .nav{display:flex;gap:14px;margin-top:10px;align-items:center;}
  button.btn-nav{font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;border:none;cursor:pointer;border-radius:12px;padding:12px 28px;transition:all .2s;}
  .btn-next{background:linear-gradient(135deg,var(--bleu),var(--violet));color:#fff;box-shadow:0 4px 14px rgba(26,115,232,.3);}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-next:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-prev{background:#e0e7ff;color:var(--bleu);}
  .btn-prev:hover{background:#c7d2fe;}
  .step-counter{font-size:.85rem;color:var(--gris);font-weight:700;}
  .pourquoi { position:relative; background:#f0fdfa; border-left:4px solid #0d9488; border-radius:10px; padding:12px 15px; font-size:0.92rem; font-weight:600; color:#134e4a; line-height:1.6; max-width:580px; width:100%; }
  .pq-lead { font-family:'Baloo 2',cursive; font-weight:800; color:#0d9488; }
</style>
</head>
<body>
<header><div class="header-row">
  <div class="badge-code">N23</div>
  <div class="tache-label">Transformer une fraction décimale</div>
</div></header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-nav btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-nav btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
function fracSVG(n,d,col,fs1,fs2){
  col=col||'var(--texte)';fs1=fs1||22;fs2=fs2||22;
  const W=Math.max(String(n).length,String(d).length)*fs1*.62+8;
  const yN=fs1,yT=yN+Math.round(fs1*.28),yD=yT+3+Math.round(fs2*.93),H=yD+4;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:inline-block;vertical-align:middle;overflow:visible">
    <text x="${W/2}" y="${yN}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs1}" font-weight="800" fill="${col}">${n}</text>
    <rect x="0" y="${yT}" width="${W}" height="3" rx="1" fill="${col}"/>
    <text x="${W/2}" y="${yD}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs2}" font-weight="800" fill="${col}">${d}</text>
  </svg>`;
}

const EXOS={};

// ── Tableau valeurs de position ──────────────────────────────────────────────
// cols: ['DIZAINES','UNITÉS','DIXIÈMES','CENTIÈMES','MILLIÈMES']
// rows: [ {cells:[{val,col,box}], arrows:[{from,to,label}]} ]  (arrows horizontales row interne)
function tableauPosition(cols, rows){
  const N=cols.length, CW=66, HDR=22, ROW=50, TH=HDR+ROW*rows.length, W=N*CW;
  let s=`<svg width="${W}" height="${TH}" viewBox="0 0 ${W} ${TH}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;
  s+=`<rect x="0" y="0" width="${W}" height="${TH}" rx="10" fill="white" stroke="var(--border)" stroke-width="2"/>`;
  for(let i=0;i<rows.length;i++) s+=`<line x1="0" y1="${HDR+ROW*(i+1)}" x2="${W}" y2="${HDR+ROW*(i+1)}" stroke="var(--border)" stroke-width="1.2"/>`;
  for(let i=1;i<N;i++) s+=`<line x1="${i*CW}" y1="0" x2="${i*CW}" y2="${TH}" stroke="var(--border)" stroke-width="1.2"/>`;
  cols.forEach((c,i)=>{
    s+=`<rect x="${i*CW}" y="0" width="${CW}" height="${HDR}" fill="#f8faff"/>`;
    s+=`<text x="${i*CW+CW/2}" y="${HDR-6}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="8" font-weight="700" fill="var(--gris)" letter-spacing="0.2">${c}</text>`;
  });
  rows.forEach((row,ri)=>{
    const y0=HDR+ri*ROW;
    // flèches obliques internes
    (row.arrows||[]).forEach((a,ai)=>{
      const mkId=`tp${ri}a${ai}`;
      const col=a.col||'var(--orange)';
      const dir=a.to>a.from?1:-1;
      const x1=a.from*CW+CW/2+dir*16, x2=a.to*CW+CW/2-dir*16;
      const y=y0+ROW/2;
      s+=`<defs><marker id="${mkId}" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="${col}"/></marker></defs>`;
      s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${col}" stroke-width="2.2" marker-end="url(#${mkId})"/>`;
      if(a.label) s+=`<text x="${(x1+x2)/2}" y="${y-8}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="11" font-weight="800" fill="${col}">${a.label}</text>`;
    });
    row.cells.forEach((d,ci)=>{
      if(!d||d.val===undefined||d.val==='') return;
      if(d.box){
        const bw=34,bh=28,bx=ci*CW+CW/2-bw/2,by=y0+ROW/2-bh/2;
        s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="6" fill="${d.boxBg||'var(--orange-clair)'}" stroke="${d.col}" stroke-width="2"/>`;
      }
      s+=`<text x="${ci*CW+CW/2}" y="${y0+ROW/2+8}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${String(d.val).length>2?18:22}" font-weight="800" fill="${d.col}">${d.val}</text>`;
    });
  });
  s+=`<rect x="0" y="0" width="${W}" height="${TH}" rx="10" fill="none" stroke="var(--border)" stroke-width="2"/></svg>`;
  return `<div style="display:flex;justify-content:center;width:100%">${s}</div>`;
}

// ── Représentation ZOOMÉE (pour millièmes) ──────────────────────────────────
// Affiche la barre complète [0,1] en centièmes ; au clic, zoom animé vers [0, ~16 centièmes] révélant les millièmes
function drawReprZoom(num, den, baseDen, completed, markCol, bottomFrac, markNum, markDen, uid){
  // den=1000, baseDen=100 (ex: 12/100 = 120/1000)
  const value=num/den;              // 0.12
  const baseVal=num*baseDen/den;    // 12 centièmes
  const PADL=0, PADR=16, avail=384;
  const barH=20, gap2=2;
  const topBarY=34, botBarY=completed?topBarY+barH+gap2:topBarY;
  const lineY=botBarY+barH+5;
  const lineEnd=PADL+avail+8;
  const W=lineEnd+PADR, H=lineY+44;
  const cwFull=avail/100;           // largeur d'un centième en vue complète (0→1)

  function fLab(cx,y,n,d,col,fs,hl,sw){
    fs=fs||9; sw=sw||1.3;
    const fw=Math.max(String(n).length,String(d).length)*fs*.65+5;
    const yN=fs,yT=fs+2,yD=yT+2+fs,lH=yD+3;
    let r='';
    if(hl) r+=`<rect x="${cx-fw/2-3}" y="${y-1}" width="${fw+6}" height="${lH+2}" rx="4" fill="#dcfce7" stroke="${col}" stroke-width="${sw}"/>`;
    r+=`<text x="${cx}" y="${y+yN}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${n}</text>`;
    r+=`<rect x="${cx-fw/2+1}" y="${y+yT}" width="${fw-2}" height="1.6" fill="${col}"/>`;
    r+=`<text x="${cx}" y="${y+yD}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${d}</text>`;
    return r;
  }

  // fenêtre de zoom final : [0, zoomCent] centièmes — le 0 (PADL) reste à gauche
  const zoomCent=15;
  const cwFull2=avail/100;
  const zoomW=PADL + zoomCent*cwFull2 + 4; // largeur monde de la fenêtre zoomée
  const svgId='zoomsvg'+Math.floor(Math.random()*1e6);

  // hauteur d'affichage fixe ; preserveAspectRatio none => le rétrécissement de viewBox en X seul produit un zoom horizontal pur
  const dispRatio=H/W;
  let s=`<div style="overflow:hidden;width:100%;position:relative;padding-bottom:${(dispRatio*100).toFixed(2)}%"><svg id="${svgId}" data-uid="${uid||''}" data-fullw="${W}" data-zoomw="${zoomW}" data-h="${H}" data-zoom="${completed?1:0}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100%;height:100%">`;
  s+=`<g>`;

  // ── barre centièmes (violet) sur 0→1 ──
  for(let p=0;p<100;p++){
    const x=PADL+p*cwFull, dark=p%2===1;
    let fill;
    if(!completed) fill=dark?'#c4b5fd':'#ddd6fe';
    else if(p<Math.floor(baseVal)) fill=dark?'#8b6cf5':'#bcabfa';
    else fill=dark?'#e8e0ff':'#f0ecfc';
    s+=`<rect x="${x}" y="${botBarY}" width="${cwFull}" height="${barH}" fill="${fill}"/>`;
  }
  s+=`<rect x="${PADL}" y="${botBarY}" width="${avail}" height="${barH}" fill="none" stroke="#7c3aed" stroke-width="1.2" rx="1"/>`;

  // ── sur-couche millièmes (vert), visible après clic ──
  if(completed){
    const mw=cwFull/10;
    for(let p=0;p<1000;p++){
      const x=PADL+p*mw;
      const cIdx=Math.floor(p/10), cDark=cIdx%2===1, odd=p%2===1;
      let fill;
      if(p<num){ fill=cDark?(odd?'#15803d':'#22c55e'):(odd?'#22c55e':'#4ade80'); }
      else { fill=cDark?'#dcfce7':'#f0fdf4'; }
      s+=`<rect x="${x}" y="${topBarY}" width="${mw}" height="${barH}" fill="${fill}"/>`;
      // séparation millièmes (apparaît nette une fois zoomé)
      if(p%10!==0) s+=`<line x1="${x}" y1="${topBarY}" x2="${x}" y2="${topBarY+barH}" stroke="#16a34a" stroke-width="0.15" opacity="0.5"/>`;
    }
    s+=`<rect x="${PADL}" y="${topBarY}" width="${avail}" height="${barH}" fill="none" stroke="#16a34a" stroke-width="1.2" rx="1"/>`;
  }

  // ── ligne + graduations centièmes ──
  s+=`<line x1="${PADL}" y1="${lineY}" x2="${PADL+avail}" y2="${lineY}" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>`;
  for(let p=0;p<=100;p++){
    const x=PADL+p*cwFull;
    const isUnit=(p===0||p===100);
    const isDix=(p%10===0);
    const keyGrad=(p===0||p===10);
    s+=`<line x1="${x}" y1="${isDix?topBarY:lineY-3}" x2="${x}" y2="${lineY+(isDix?5:3)}" stroke="${isUnit?'#1e293b':'#7c3aed'}" stroke-width="${isUnit?1.8:isDix?1:0.4}" opacity="${isDix?1:0.55}"${keyGrad?' vector-effect="non-scaling-stroke"':''}/>`;
    if(isUnit && p===100){
      s+=`<text x="${x-2}" y="${lineY+16}" text-anchor="end" font-family="Baloo 2,cursive" font-size="9" font-weight="800" fill="#1e293b">1</text>`;
    }
  }

  if(completed){
    const px=PADL+baseVal*cwFull;
    s+=`<line x1="${px}" y1="${topBarY-2}" x2="${px}" y2="${lineY+5}" stroke="#16a34a" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`;
  }

  s+=`</g></svg>`;
  // étiquette "0" fixe au bord gauche (non déformée, ne bouge jamais)
  s+=`<div style="position:absolute;left:0;top:${(lineY+6)/H*100}%;font-family:'Baloo 2',cursive;font-weight:800;font-size:11px;color:#1e293b">0</div>`;
  // étiquette HTML non déformée (positionnée et animée par JS)
  if(completed){
    const fullW=W, zW=zoomW;
    const pxWorld=PADL+baseVal*cwFull; // position monde du marqueur (12 centièmes)
    const leftStart=(pxWorld/fullW)*100;
    const leftEnd=(pxWorld/zW)*100;
    // 120/1000 (vert) AU-DESSUS de la ligne
    s+=`<div id="lab-${uid}" data-ls="${leftStart}" data-le="${leftEnd}" style="position:absolute;left:${leftStart}%;top:8px;transform:translateX(-50%);background:#dcfce7;border:1.3px solid #16a34a;border-radius:5px;padding:1px 5px;font-family:'Baloo 2',cursive;font-weight:800;font-size:11px;color:#16a34a;line-height:1.05;text-align:center;white-space:nowrap;z-index:2">${num}<div style="border-top:1.5px solid #16a34a;margin:1px 0"></div>${den}</div>`;
    // 12/100 (violet) EN-DESSOUS de la ligne
    s+=`<div id="lab3-${uid}" data-ls="${leftStart}" data-le="${leftEnd}" style="position:absolute;left:${leftStart}%;top:${(lineY+6)/H*100}%;transform:translateX(-50%);font-family:'Baloo 2',cursive;font-weight:800;font-size:10px;color:#7c3aed;line-height:1.05;text-align:center;white-space:nowrap">${baseVal}<div style="border-top:1.5px solid #7c3aed;margin:1px 0"></div>100</div>`;
    // 10/100 (violet) sous la graduation 10/100, révélée en fin de zoom
    const px10=PADL+10*cwFull;
    const l10s=(px10/fullW)*100, l10e=(px10/zW)*100;
    s+=`<div id="lab2-${uid}" data-ls="${l10s}" data-le="${l10e}" style="position:absolute;left:${l10s}%;top:${(lineY+6)/H*100}%;transform:translateX(-50%);opacity:0;font-family:'Baloo 2',cursive;font-weight:800;font-size:10px;color:#7c3aed;line-height:1.05;text-align:center;white-space:nowrap">10<div style="border-top:1.5px solid #7c3aed;margin:1px 0"></div>100</div>`;
    // 100/1000 (vert) AU-DESSUS de la graduation 10/100, révélée en fin de zoom
    s+=`<div id="lab4-${uid}" data-ls="${l10s}" data-le="${l10e}" style="position:absolute;left:${l10s}%;top:2px;transform:translateX(-50%);opacity:0;font-family:'Baloo 2',cursive;font-weight:800;font-size:10px;color:#16a34a;line-height:1.05;text-align:center;white-space:nowrap">100<div style="border-top:1.5px solid #16a34a;margin:1px 0"></div>1000</div>`;
  }
  s+=`</div>`;
  return s;
}

// ── Représentation ligne numérique (dixièmes + centièmes/millièmes) ──────────
// cfg: {num, den, baseDen}  baseDen = découpage de base affiché (10 pour dixièmes)
// completed: affiche la sur-couche fine (den) coloriée jusqu'à num
function drawRepr(num, den, baseDen, completed, markCol, bottomFrac, markNum, markDen){
  const value=num/den;
  const totalUnits=Math.max(1, Math.ceil(value-1e-9));
  const PADL=20, PADR=16, avail=380;
  const UW=avail/totalUnits;
  const barH=18, gap2=2;
  const fine=completed && den>baseDen;
  const topBarY=8, botBarY=fine?topBarY+barH+gap2:topBarY;
  const lineY=botBarY+barH+5;
  const lineEnd=PADL+avail+UW*0.06;
  const W=lineEnd+PADR, H=lineY+44;

  function fLab(cx,y,n,d,col,fs,hl){
    fs=fs||9;
    const fw=Math.max(String(n).length,String(d).length)*fs*.65+5;
    const yN=fs,yT=fs+2,yD=yT+2+fs,lH=yD+3;
    let r='';
    if(hl) r+=`<rect x="${cx-fw/2-3}" y="${y-1}" width="${fw+6}" height="${lH+2}" rx="4" fill="${col==='#1a73e8'?'#dbeafe':col==='#16a34a'?'#dcfce7':'#ede9fe'}" stroke="${col}" stroke-width="1.3"/>`;
    r+=`<text x="${cx}" y="${y+yN}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${n}</text>`;
    r+=`<rect x="${cx-fw/2+1}" y="${y+yT}" width="${fw-2}" height="1.6" fill="${col}"/>`;
    r+=`<text x="${cx}" y="${y+yD}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${d}</text>`;
    return r;
  }

  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;

  // ── barre de base (dixièmes) ──
  const baseTotal=totalUnits*baseDen;
  const basePW=avail/baseTotal;
  const numBase=num*baseDen/den; // position de num en unités de base
  for(let p=0;p<baseTotal;p++){
    const x=PADL+p*basePW, dark=p%2===1;
    let fill;
    if(!completed) fill=dark?'#a8c8f0':'#c0d8f6';
    else if(p<Math.floor(numBase)) fill=dark?'#6a9ee8':'#a0c4f0';
    else if(p<numBase) fill=dark?'#8ab4ec':'#b0ccf4';
    else fill=dark?'#d8e8f8':'#e8f2fc';
    s+=`<rect x="${x}" y="${botBarY}" width="${basePW}" height="${barH}" fill="${fill}"/>`;
  }
  s+=`<rect x="${PADL}" y="${botBarY}" width="${avail}" height="${barH}" fill="none" stroke="#1a73e8" stroke-width="1.5" rx="1"/>`;

  // ── sur-couche fine (centièmes/millièmes) ──
  if(fine){
    const finePW=avail/(totalUnits*den);
    const fineTotal=totalUnits*den;
    const cFL='#e0d8ff',cFD='#cec2fa',cFDL='#a898e8',cFDD='#7c64d8';
    const cEL='#f0ecfc',cED='#e8e2f8',cEDL='#d8d0f0',cEDD='#c8bce8';
    const grp=den/baseDen; // combien de fines par base
    for(let p=0;p<fineTotal;p++){
      const x=PADL+p*finePW;
      const baseIdx=Math.floor(p/grp);
      const baseDark=baseIdx%2===1;
      const odd=p%2===1;
      let fill;
      if(p<num){ fill=baseDark?(odd?cFDD:cFDL):(odd?cFD:cFL); }
      else { fill=baseDark?(odd?cEDD:cEDL):(odd?cED:cEL); }
      s+=`<rect x="${x}" y="${topBarY}" width="${finePW}" height="${barH}" fill="${fill}"/>`;
    }
    s+=`<rect x="${PADL}" y="${topBarY}" width="${avail}" height="${barH}" fill="none" stroke="#7c3aed" stroke-width="1.5" rx="1"/>`;
  }

  // ── ligne numérique ──
  s+=`<line x1="${PADL}" y1="${lineY}" x2="${lineEnd}" y2="${lineY}" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>`;
  const tickTop=topBarY;
  // graduations dixièmes (étiquettes /10) — toujours
  for(let p=0;p<=baseTotal;p++){
    const x=PADL+p*basePW;
    const isUnit=p%baseDen===0;
    s+=`<line x1="${x}" y1="${isUnit?tickTop:lineY-4}" x2="${x}" y2="${lineY+ (isUnit?6:4)}" stroke="${isUnit?'#1e293b':'#94a3b8'}" stroke-width="${isUnit?2:1}"/>`;
    if(isUnit){
      s+=`<text x="${x}" y="${lineY+20}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="12" font-weight="800" fill="#1e293b" stroke="white" stroke-width="3" stroke-linejoin="round" paint-order="stroke">${p/baseDen}</text>`;
    }
  }

  if(completed){
    // étiquette de la fraction cherchée, mise en valeur
    const px=PADL+value*UW;
    const col=markCol||(den>baseDen?'#7c3aed':'#1a73e8');
    s+=`<line x1="${px}" y1="${tickTop-2}" x2="${px}" y2="${lineY+6}" stroke="${col}" stroke-width="2.5"/>`;
    s+=fLab(px, -16, markNum||num, markDen||den, col, 10, true);
    // étiquette fraction en bas (ex: 4/10 sous le point correspondant)
    if(bottomFrac){
      const bx=PADL+(bottomFrac.n/bottomFrac.d)*totalUnits/totalUnits*avail;
      const bpx=PADL+(bottomFrac.n/bottomFrac.d)*UW;
      s+=`<line x1="${bpx}" y1="${lineY-4}" x2="${bpx}" y2="${lineY+6}" stroke="#1a73e8" stroke-width="2"/>`;
      s+=fLab(bpx, lineY+10, bottomFrac.n, bottomFrac.d, '#1a73e8', 9, true);
    }
  }

  s+=`</svg>`;
  return s;
}

// ── Bloc exercice ────────────────────────────────────────────────────────────
function exoBlock(uid,cfg){
  EXOS[uid]=cfg;
  const drawFn=cfg.zoom?drawReprZoom:drawRepr;
  const vis0=drawFn(cfg.num,cfg.den,cfg.baseDen,false);
  return `
<div id="wrap-${uid}" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
  <div id="vis-${uid}" class="fade-in" style="width:100%">${vis0}</div>
  ${cfg.zoom?`<button id="zoombtn-${uid}" class="btn-zoom" style="display:none" onclick="animateZoom()">🔍 Zoom</button>`:''}
  <div id="calc-${uid}" class="calc fade-in">${cfg.calcBefore}</div>
  <div id="tab-${uid}" class="fade-in" style="width:100%">${cfg.tableBefore}</div>
  <button class="btn-complete" onclick="completer('${uid}')">✏️ Compléter</button>
  <div id="res-${uid}" style="display:none;flex-direction:column;align-items:center;gap:10px;width:100%" class="fade-in">
    <div class="info ${cfg.infoCol||'bleu'}" style="font-size:.88rem">${cfg.explication}</div>
  </div>
</div>`;
}

function animateZoom(){
  const svg=document.querySelector('svg[data-zoom="1"]');
  if(!svg) return;
  const uid=svg.dataset.uid;
  const btn=document.getElementById('zoombtn-'+uid);
  if(btn) btn.style.display='none';
  const lab=document.getElementById('lab-'+uid);
  const ls=lab?+lab.dataset.ls:0, le=lab?+lab.dataset.le:0;
  const lab3=document.getElementById('lab3-'+uid);
  const l3s=lab3?+lab3.dataset.ls:0, l3e=lab3?+lab3.dataset.le:0;
  const lab2=document.getElementById('lab2-'+uid);
  const l2s=lab2?+lab2.dataset.ls:0, l2e=lab2?+lab2.dataset.le:0;
  const lab4=document.getElementById('lab4-'+uid);
  const l4s=lab4?+lab4.dataset.ls:0, l4e=lab4?+lab4.dataset.le:0;
  const W=+svg.dataset.fullw, ZW=+svg.dataset.zoomw, H=+svg.dataset.h;
  const dur=3500, t0=performance.now();
  function step(now){
    let p=(now-t0)/dur;
    if(p<0)p=0; if(p>1)p=1; // progression linéaire = zoom régulier
    svg.setAttribute('viewBox',`0 0 ${W+(ZW-W)*p} ${H}`);
    if(lab) lab.style.left=(ls+(le-ls)*p)+'%';
    if(lab3) lab3.style.left=(l3s+(l3e-l3s)*p)+'%';
    if(lab2){ lab2.style.left=(l2s+(l2e-l2s)*p)+'%'; if(p>0.6) lab2.style.opacity=Math.min(1,(p-0.6)/0.3); }
    if(lab4){ lab4.style.left=(l4s+(l4e-l4s)*p)+'%'; if(p>0.6) lab4.style.opacity=Math.min(1,(p-0.6)/0.3); }
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function completer(uid){
  const c=EXOS[uid];
  const drawFn=c.zoom?drawReprZoom:drawRepr;
  document.getElementById('vis-'+uid).innerHTML=drawFn(c.num,c.den,c.baseDen,true,c.markCol,c.bottomFrac,c.markNum,c.markDen,uid);
  if(c.zoom){const zb=document.getElementById('zoombtn-'+uid);if(zb)zb.style.display='inline-flex';}
  document.getElementById('calc-'+uid).innerHTML=c.calcAfter;
  document.getElementById('tab-'+uid).innerHTML=c.tableAfter;
  document.getElementById('wrap-'+uid).querySelector('.btn-complete').style.display='none';
  document.getElementById('res-'+uid).style.display='flex';
}

let cur=0;const N=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=STEPS[cur]();card.className='card fade-in';
  document.getElementById('progressBar').style.width=(cur/(N-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator');ind.innerHTML='';
  for(let i=0;i<N;i++){const d=document.createElement('div');d.className='step-dot'+(i===cur?' active':i<cur?' done':'');d.textContent=i<cur?'✓':i+1;ind.appendChild(d);}
  document.getElementById('counter').textContent=`Page ${cur+1} / ${N}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===N-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===N-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
