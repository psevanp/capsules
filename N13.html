<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>N13 Placer une fraction sur la ligne numérique</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:light;
    --bleu:#1a73e8; --bleu-clair:#e8f0fe;
    --vert:#16a34a; --vert-clair:#dcfce7;
    --rouge:#dc2626; --rouge-clair:#fee2e2;
    --orange:#ea580c; --orange-clair:#ffedd5;
    --violet:#7c3aed; --violet-clair:#f5f3ff;
    --gris:#94a3b8; --bg:#f0f4ff;
    --card:#ffffff; --texte:#1e293b; --border:#e2e8f0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; color:var(--texte); }
  header { display:flex; justify-content:center; margin-bottom:22px; }
  .header-row { display:flex; align-items:center; gap:14px; max-width:680px; width:100%; }
  .badge-code { display:inline-flex; align-items:center; justify-content:center; min-width:48px; height:48px; border-radius:12px; border:2.5px solid var(--bleu); background:var(--bleu-clair); font-family:'Baloo 2',cursive; font-size:1.3rem; font-weight:800; color:var(--bleu); flex-shrink:0; }
  .tache-label { font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; color:var(--bleu); line-height:1.3; }
  .progress-bar-wrap { width:100%; max-width:680px; background:#dbeafe; border-radius:99px; height:10px; margin-bottom:18px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:99px; transition:width 0.5s ease; }
  .steps-indicator { display:flex; gap:10px; margin-bottom:20px; }
  .step-dot { width:34px; height:34px; border-radius:50%; background:#dbeafe; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:#93c5fd; transition:all 0.4s; border:2px solid transparent; }
  .step-dot.active { background:var(--bleu); color:white; border-color:var(--bleu); transform:scale(1.15); box-shadow:0 0 0 4px #bfdbfe; }
  .step-dot.done { background:var(--vert); color:white; border-color:var(--vert); }
  .card { background:var(--card); border-radius:20px; padding:26px 24px; max-width:680px; width:100%; min-height:360px; display:flex; flex-direction:column; align-items:center; gap:16px; box-shadow:0 4px 24px rgba(26,115,232,0.10); position:relative; overflow-x:auto; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:20px 20px 0 0; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.4s ease both; }
  @keyframes pop { 0%{transform:scale(0.8);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  .pop { animation:pop 0.45s ease both; }
  .step-title { font-family:'Baloo 2',cursive; font-size:1.2rem; font-weight:800; color:var(--bleu); text-align:center; line-height:1.3; }
  .step-text { font-size:0.97rem; color:var(--texte); text-align:center; line-height:1.75; font-weight:600; max-width:540px; }
  .info { border-radius:12px; padding:12px 18px; font-weight:600; max-width:580px; width:100%; line-height:1.6; font-size:0.93rem; }
  .info.bleu { background:var(--bleu-clair); color:var(--bleu); border-left:4px solid var(--bleu); }
  .btn-complete { font-family:'Baloo 2',cursive; font-weight:700; font-size:0.95rem; border:2px solid var(--vert); cursor:pointer; border-radius:10px; padding:10px 22px; background:var(--vert-clair); color:var(--vert); transition:all 0.2s; }
  .btn-complete:hover { background:var(--vert); color:white; }
  .result-box { font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; text-align:center; background:#f1f5f9; border-radius:14px; padding:12px 20px; color:var(--texte); border:2px solid var(--border); max-width:480px; width:100%; }
  .recap-list { display:flex; flex-direction:column; gap:9px; max-width:580px; width:100%; }
  .recap-item { display:flex; align-items:flex-start; gap:12px; background:#f8faff; border-radius:12px; padding:11px 16px; font-size:0.93rem; font-weight:600; color:var(--texte); animation:fadeIn 0.4s ease both; border-left:4px solid transparent; line-height:1.5; }
  .recap-num { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:700; flex-shrink:0; color:white; margin-top:1px; }
  .nav { display:flex; gap:14px; margin-top:10px; align-items:center; }
  button.btn-nav { font-family:'Baloo 2',cursive; font-weight:700; font-size:1rem; border:none; cursor:pointer; border-radius:12px; padding:12px 28px; transition:all 0.2s; }
  .btn-next { background:linear-gradient(135deg,var(--bleu),var(--violet)); color:white; box-shadow:0 4px 14px rgba(26,115,232,0.3); }
  .btn-next:hover { transform:translateY(-2px); }
  .btn-next:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
  .btn-prev { background:#e0e7ff; color:var(--bleu); }
  .btn-prev:hover { background:#c7d2fe; }
  .step-counter { font-size:0.85rem; color:var(--gris); font-weight:700; }
  .pourquoi { position:relative; background:#f0fdfa; border-left:4px solid #0d9488; border-radius:10px; padding:12px 15px; font-size:0.92rem; font-weight:600; color:#134e4a; line-height:1.6; max-width:580px; width:100%; }
  .pq-lead { font-family:'Baloo 2',cursive; font-weight:800; color:#0d9488; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="badge-code">N13</div>
    <div class="tache-label">Placer une fraction sur la ligne numérique</div>
  </div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-nav btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-nav btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
// ── fracSVG (positions calibrées) ────────────────────────────────────────────
function fracSVG(num, den, col, fsNum, fsDen){
  col = col||'var(--texte)'; fsNum=fsNum||22; fsDen=fsDen||22;
  const W = Math.max(fsNum,fsDen)*1.4+6;
  const yNum = fsNum;
  const yTrait = yNum + Math.round(fsNum*0.28);
  const yDen = yTrait + 3 + Math.round(fsDen*0.93);
  const H = yDen + 4;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:inline-block;vertical-align:middle;overflow:visible">
    <text x="${W/2}" y="${yNum}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fsNum}" font-weight="800" fill="${col}">${num}</text>
    <rect x="0" y="${yTrait}" width="${W}" height="3" rx="1" fill="${col}"/>
    <text x="${W/2}" y="${yDen}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fsDen}" font-weight="800" fill="${col}">${den}</text>
  </svg>`;
}

// fraction horizontale "a/b" compacte pour étiquette sous la ligne
function fracInline(num, den, col, fs){
  fs = fs||13; col=col||'#ea580c';
  const w = Math.max(String(num).length, String(den).length)*fs*0.65 + 4;
  const yN=fs, yT=fs+3, yD=fs+3+3+fs;
  return `<svg width="${w}" height="${yD+3}" viewBox="0 0 ${w} ${yD+3}" style="display:block;overflow:visible">
    <text x="${w/2}" y="${yN}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${num}</text>
    <rect x="1" y="${yT}" width="${w-2}" height="2" fill="${col}"/>
    <text x="${w/2}" y="${yD}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${den}</text>
  </svg>`;
}

// ── Dessin principal ──────────────────────────────────────────────────────────
// cfg = { num, den, label (fraction lettres) }
const EXOS = {};

function drawExo(cfg, completed){
  const num=cfg.num, den=cfg.den;
  const UWmax = 150;
  const unitesNeeded = Math.ceil(num/den);
  const unites = Math.max(1, unitesNeeded);
  const UW = Math.min(UWmax, 420/unites);
  const PADL=24, PADR=20, TOPU=10, UH=26, lineGap=14, partH=24, PADB=52;
  const lineY = TOPU + UH + lineGap;
  const lineEnd = PADL + UW*unites;
  const W = PADL + UW*unites + PADR;
  const H = lineY + 8 + partH + PADB;

  function xOf(val){ return PADL + (val/den)*UW; } // val = nb de parts depuis 0

  // contour de texte (entiers par-dessus les rectangles)
  function tc(x,y,t,fs,col){
    return `<text x="${x}" y="${y}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}" stroke="white" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">${t}</text>`;
  }

  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;

  // Rectangles unité (au-dessus)
  for(let u=0;u<unites;u++){
    s+=`<rect x="${PADL+u*UW}" y="${TOPU}" width="${UW}" height="${UH}" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>`;
    s+=`<text x="${PADL+u*UW+UW/2}" y="${TOPU+UH/2+5}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="11" font-weight="800" fill="#14532d">1 unité</text>`;
  }

  // ── parts en dessous (après compléter) ──
  if(completed){
    const pw = UW/den;
    const partY = lineY + 8;
    // total de parts à dessiner : au moins 1 unité complète (den), et au moins num
    const totalSlots = Math.max(den*unites, num);
    for(let p=0;p<totalSlots;p++){
      const x = PADL + p*pw;
      const filled = p < num;
      const uIndex = Math.floor(p/den); // numéro de l'unité (0,1,2,...)
      const evenUnit = uIndex % 2 === 1;  // unité paire (2e, 4e... → index 1,3...)
      let fill, stroke;
      if(!filled){
        fill='#fef2f2'; stroke='#fecaca';
      } else if(evenUnit){
        fill='#fecaca'; stroke='#dc2626';  // rouge légèrement plus foncé
      } else {
        fill='#fee2e2'; stroke='#dc2626';  // rouge normal
      }
      s+=`<rect x="${x}" y="${partY}" width="${pw-2}" height="${partH}" rx="3" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
      if(pw>=26){
        const fs=pw>44?10:pw>32?9:8;
        const yc=partY+partH/2;
        const col = !filled ? '#fca5a5' : (evenUnit ? '#991b1b' : '#991b1b');
        s+=`<text x="${x+(pw-2)/2}" y="${yc-1}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">1</text>`;
        s+=`<rect x="${x+(pw-2)/2-fs*0.5}" y="${yc+1}" width="${fs}" height="1.3" fill="${col}"/>`;
        s+=`<text x="${x+(pw-2)/2}" y="${yc+fs+1}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${den}</text>`;
      }
    }
  }

  // Ligne numérique (s'arrête à la dernière graduation, puis flèche)
  s+=`<line x1="${PADL}" y1="${lineY}" x2="${lineEnd}" y2="${lineY}" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>`;
  s+=`<line x1="${lineEnd}" y1="${lineY}" x2="${lineEnd+12}" y2="${lineY}" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>`;
  s+=`<polygon points="${lineEnd+18},${lineY} ${lineEnd+10},${lineY-4.5} ${lineEnd+10},${lineY+4.5}" fill="#64748b"/>`;

  // ── graduation du nombre à placer (trait qui descend jusqu'à l'étiquette) ──
  if(completed){
    const px = xOf(num);
    const partY = lineY + 8;
    const labelY = partY + partH + 6;
    s+=`<line x1="${px}" y1="${lineY-7}" x2="${px}" y2="${labelY}" stroke="#ea580c" stroke-width="2.5"/>`;
    // étiquette fraction sous la ligne
    const fr=fracInline(num,den,'#ea580c',13);
    const frW=Math.max(String(num).length,String(den).length)*13*0.65+4;
    s+=`<g transform="translate(${px-frW/2}, ${labelY+2})">${fr}</g>`;
  }

  // Graduations entières + labels CONTOURÉS (par-dessus tout)
  for(let u=0;u<=unites;u++){
    const x=PADL+u*UW;
    s+=`<line x1="${x}" y1="${lineY-6}" x2="${x}" y2="${lineY+6}" stroke="#334155" stroke-width="2"/>`;
    s+=tc(x, lineY+20, u, 13, '#1e293b');
  }

  s+=`</svg>`;
  return s;
}

function exoBlock(uid, cfg, phraseAvant, phraseApres){
  EXOS[uid] = {cfg, phraseApres};
  const svg0 = drawExo(cfg, false);
  return `
<div id="wrap-${uid}" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px">
  <div id="svg-${uid}" class="fade-in" style="width:100%">${svg0}</div>
  <div class="info bleu fade-in" style="font-size:0.92rem">${phraseAvant}</div>
  <button class="btn-complete" onclick="completer('${uid}')">✏️ Compléter et placer</button>
  <div id="res-${uid}" style="display:none;flex-direction:column;align-items:center;gap:8px;width:100%">
    <div class="result-box fade-in">${phraseApres}</div>
  </div>
</div>`;
}

function completer(uid){
  const {cfg}=EXOS[uid];
  document.getElementById('svg-'+uid).innerHTML = drawExo(cfg, true);
  document.getElementById('svg-'+uid).parentElement.querySelector('.btn-complete').style.display='none';
  const r=document.getElementById('res-'+uid); r.style.display='flex';
}

// ─────────────────────────────────────────────────────────────────────────────
const STEPS = [

// 0 — L'idée
()=>`
<div class="step-title pop">💡 Placer une fraction sur la ligne</div>
<div class="pourquoi fade-in"><span class="pq-lead">🤔 Pourquoi ?</span> Pour mieux comprendre ce qu'est une fraction, et mieux réussir à les relier aux nombres entiers, il est utile de savoir utiliser la représentation de la ligne numérique.</div>
<p class="step-text fade-in">
  On <strong style="color:var(--rouge)">partage l'unité en parts égales</strong>
  selon le <strong>dénominateur</strong>.<br>
  Puis on <strong style="color:var(--vert)">compte les parts depuis zéro</strong>
  selon le <strong>numérateur</strong>.
</p>
<div class="info bleu fade-in">
  Pour placer ${fracSVG(1,4,'var(--bleu)',18,18)}, on partage l'unité en <strong>4 parts égales</strong>
  et on prend <strong>1 part</strong> depuis zéro.<br>
  Pour placer ${fracSVG(3,4,'var(--bleu)',18,18)}, on prend <strong>3 parts</strong> les unes à la suite des autres depuis zéro.
</div>
`,

// 1 — 1/3
()=>`
<div class="step-title pop">✏️ Placer ${fracSVG(1,3,'var(--bleu)',26,26)} sur la ligne</div>
${exoBlock('ex1', {num:1, den:3},
  `On partage l'unité en <strong>3 parts égales</strong> et on prend <strong>1 part</strong> depuis zéro.`,
  `${fracSVG(1,3,'var(--vert)',20,20)} est entre 0 et 1.`
)}`,

// 2 — 3/4
()=>`
<div class="step-title pop">✏️ Placer ${fracSVG(3,4,'var(--bleu)',26,26)} sur la ligne</div>
${exoBlock('ex2', {num:3, den:4},
  `On partage l'unité en <strong>4 parts égales</strong> et on prend <strong>3 parts</strong> depuis zéro.`,
  `${fracSVG(3,4,'var(--vert)',20,20)} est entre 0 et 1.`
)}`,

// 3 — 5/2
()=>`
<div class="step-title pop">✏️ Placer ${fracSVG(5,2,'var(--bleu)',26,26)} sur la ligne</div>
${exoBlock('ex3', {num:5, den:2},
  `On partage chaque unité en <strong>2 parts égales</strong> et on prend <strong>5 parts</strong> depuis zéro.`,
  `${fracSVG(5,2,'var(--vert)',20,20)} est entre 2 et 3.`
)}`,

// 4 — 20/6
()=>`
<div class="step-title pop">✏️ Placer ${fracSVG(20,6,'var(--bleu)',26,26)} sur la ligne</div>
${exoBlock('ex4', {num:20, den:6},
  `On partage chaque unité en <strong>6 parts égales</strong> et on prend <strong>20 parts</strong> depuis zéro.`,
  `${fracSVG(20,6,'var(--vert)',20,20)} est entre 3 et 4.`
)}`,

// 5 — Bilan
()=>`
<div class="step-title pop">🏆 Ce qu'il faut retenir</div>
<div class="recap-list">
  ${[
    ['var(--rouge)', 'On partage chaque unité en autant de <strong>parts égales</strong> que l\'indique le dénominateur.'],
    ['var(--bleu)',  'On compte les parts <strong>depuis zéro</strong>, autant que l\'indique le numérateur.'],
    ['var(--vert)',  'Si le numérateur est plus grand que le dénominateur, la fraction se place <strong>au-delà de 1</strong>.'],
    ['var(--violet)', 'Avant de placer le point, c\'est souvent pratique de chercher <strong>combien il y a d\'unités</strong> dans la fraction demandée.'],
  ].map(([c,t],i)=>`
    <div class="recap-item" style="animation-delay:${i*0.09}s;border-left-color:${c}">
      <div class="recap-num" style="background:${c}">${i+1}</div>
      <span>${t}</span>
    </div>`).join('')}
</div>`,
];

let cur=0; const N=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=STEPS[cur](); card.className='card fade-in';
  document.getElementById('progressBar').style.width=(cur/(N-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator'); ind.innerHTML='';
  for(let i=0;i<N;i++){
    const d=document.createElement('div');
    d.className='step-dot'+(i===cur?' active':i<cur?' done':'');
    d.textContent=i<cur?'✓':i+1; ind.appendChild(d);
  }
  document.getElementById('counter').textContent=`Page ${cur+1} / ${N}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===N-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===N-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
</body>
</html>
