<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>GM18 – Construire un angle avec le rapporteur</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --primary:#e11d48; --primary2:#fb7185; --primary-clair:#ffe4e6;
  --bg:#fff1f2; --cote:#9f1239;
  --bleu:#1a73e8; --bleu-clair:#e8f0fe;
  --orange:#ea580c; --orange-clair:#ffedd5;
  --vert:#16a34a; --vert-clair:#f0fdf4;
  --violet:#7c3aed; --violet-clair:#f5f3ff;
  --teal:#0d9488; --teal-clair:#f0fdfa;
  --gris:#94a3b8;
  --card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;}
header{width:100%;max-width:680px;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;}
.badge-code{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.3rem;background:var(--primary-clair);border:2px solid var(--primary);border-radius:10px;padding:4px 14px;color:var(--primary);white-space:nowrap;}
.tache-label{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.05rem;color:var(--primary);}
.progress-bar{width:100%;max-width:680px;height:10px;background:var(--primary-clair);border-radius:99px;margin-bottom:10px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px;transition:width .4s ease;}
.steps-indicator{display:flex;gap:8px;margin-bottom:14px;}
.step-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:800;font-size:.95rem;cursor:default;transition:all .3s;background:var(--primary-clair);color:var(--primary2);}
.step-dot.active{background:var(--primary);color:#fff;transform:scale(1.15);box-shadow:0 0 0 4px var(--primary-clair);}
.step-dot.done{background:var(--vert);color:#fff;}
.card{width:100%;max-width:680px;background:var(--card);border-radius:20px;padding:26px 24px;box-shadow:0 4px 24px rgba(0,0,0,.07);min-height:350px;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px 20px 0 0;}
.step-title{font-family:'Baloo 2',cursive;font-size:1.15rem;font-weight:800;color:var(--primary);text-align:center;}
.step-title.pop{animation:pop .45s ease both;}
.pourquoi{background:var(--teal-clair);border-left:4px solid var(--teal);border-radius:10px;padding:12px 15px;font-size:.92rem;font-weight:600;color:#134e4a;line-height:1.6;max-width:620px;width:100%;}
.pq-lead{font-family:'Baloo 2',cursive;font-weight:800;color:var(--teal);}
.info{border-radius:12px;padding:12px 18px;font-weight:600;font-size:.9rem;line-height:1.6;max-width:620px;width:100%;}
.info.bleu{background:var(--bleu-clair);border-left:4px solid var(--bleu);color:#1e3a5f;}
.info.orange{background:var(--orange-clair);border-left:4px solid var(--orange);color:#7c2d12;}
.info.vert{background:var(--vert-clair);border-left:4px solid var(--vert);color:#14532d;}
.info.primary{background:var(--primary-clair);border-left:4px solid var(--primary);color:#9f1239;}
.info.violet{background:var(--violet-clair);border-left:4px solid var(--violet);color:#4c1d95;}
.bloc{border-radius:12px;padding:13px 16px;font-size:.92rem;font-weight:600;line-height:1.6;max-width:620px;width:100%;}
.bloc.def{background:#f5f3ff;border-left:4px solid #7c3aed;color:#3b0764;}
.bloc-label{font-family:'Baloo 2',cursive;font-weight:800;font-size:1rem;}
.recap-list{display:flex;flex-direction:column;gap:10px;max-width:620px;width:100%;}
.recap-item{display:flex;gap:12px;background:#f8faff;border-radius:12px;padding:11px 16px;border-left:4px solid var(--primary);align-items:flex-start;}
.recap-num{min-width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:800;font-size:.9rem;}
.btn-complete{border:2px solid var(--vert);background:var(--vert-clair);color:var(--vert);font-family:'Baloo 2',cursive;font-weight:700;border-radius:10px;padding:10px 22px;font-size:1rem;cursor:pointer;transition:all .2s;}
.btn-complete:hover{background:var(--vert);color:#fff;}
nav{width:100%;max-width:680px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
.btn-prev{background:var(--primary-clair);color:var(--primary);border:none;border-radius:10px;padding:10px 20px;font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s;}
.btn-prev:hover{background:var(--primary);color:#fff;}
.btn-next{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:none;border-radius:10px;padding:10px 24px;font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(225,29,72,.3);}
.btn-next:hover{opacity:.9;}
.page-info{font-family:'Baloo 2',cursive;font-weight:600;color:var(--gris);font-size:.95rem;}
.fade-in{animation:fadeIn .4s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
svg{display:block;}
.btn-mesurer{
  font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;
  background:linear-gradient(135deg,var(--bleu),#4f9cf8);
  color:#fff;border:none;border-radius:10px;
  padding:9px 22px;cursor:pointer;
  box-shadow:0 2px 8px rgba(26,115,232,.3);
  transition:all .2s;
}
.btn-mesurer:hover{opacity:.9;}
.btn-mesurer:disabled{opacity:.5;cursor:default;}
.result-label{
  font-family:'Baloo 2',cursive;font-weight:800;font-size:1.05rem;
  color:#b34700;
  background:#fffbe8;border:2px solid #b34700;border-radius:10px;
  padding:7px 18px;
  opacity:0;transition:opacity .4s;
}
.result-label.visible{opacity:1;}
.hatw{position:relative;display:inline-block;padding-top:3px;}
.hatw svg{position:absolute;top:-3px;left:0;width:100%;height:7px;overflow:visible;}
.consigne{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.15rem;color:#9f1239;background:var(--primary-clair);border-radius:10px;padding:6px 16px;}
</style>
</head>
<body>
<header>
  <div class="badge-code">GM18</div>
  <div class="tache-label">Construire un angle avec le rapporteur</div>
</header>
<div class="progress-bar"><div class="progress-fill" id="pbar"></div></div>
<div class="steps-indicator" id="steps"></div>
<div class="card" id="card"></div>
<nav>
  <button class="btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="page-info" id="pageInfo"></span>
  <button class="btn-next" id="btnNext" onclick="next()">Suivant →</button>
</nav>

<script>
let cur = 0, animating = false, animGen = 0;
const N = 4;

const R = 175;                         // rayon du rapporteur
const ROUGE = '#d23333';               // côtés / tracés au crayon
const FONT = "'Nunito',sans-serif";

// Convention : angles trigo (0° = droite, 90° = haut) ; en SVG (Y↓) : cos(-r), sin(-r)
function pt(deg, len, c) {
  const r = deg * Math.PI / 180;
  return { x: c.x + Math.cos(-r) * len, y: c.y + Math.sin(-r) * len };
}
function arc(deg1, deg2, radius, c) {
  const a = pt(deg1, radius, c), b = pt(deg2, radius, c);
  const diff = deg2 - deg1;
  const sweep = diff < 0 ? 1 : 0, large = Math.abs(diff) > 180 ? 1 : 0;
  return `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} A ${radius} ${radius} 0 ${large} ${sweep} ${b.x.toFixed(2)} ${b.y.toFixed(2)}`;
}
const O = { x: 0, y: 0 };
const f = v => v.toFixed(1);
function croix(id, p, col, s = 6) {
  return `<path id="${id}" d="M ${f(p.x - s)} ${f(p.y - s)} L ${f(p.x + s)} ${f(p.y + s)} M ${f(p.x - s)} ${f(p.y + s)} L ${f(p.x + s)} ${f(p.y - s)}" stroke="${col}" stroke-width="2.4" stroke-linecap="round" fill="none"/>`;
}
function hat(txt, col = 'currentColor') {
  return `<span class="hatw">${txt}<svg viewBox="0 0 100 10" preserveAspectRatio="none"><polyline points="6,9 50,1 94,9" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg></span>`;
}

// Graduations du rapporteur (repère local, centre en 0,0) : 1°, 5°, 10°
function ticksLocal() {
  let d1 = '', d5 = '', d10 = '';
  for (let deg = 0; deg <= 180; deg++) {
    const inner = deg % 10 === 0 ? R - 22 : deg % 5 === 0 ? R - 14 : R - 8;
    const a = pt(deg, inner, O), b = pt(deg, R, O);
    const s = `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} L ${b.x.toFixed(2)} ${b.y.toFixed(2)} `;
    if (deg % 10 === 0) d10 += s; else if (deg % 5 === 0) d5 += s; else d1 += s;
  }
  return { d1, d5, d10 };
}
function arcColor(from, to) {
  return (to - from <= 2) ? '#1f7a8c' : (Math.floor(from / 10) % 2 === 0 ? '#d4620c' : '#f7a83a');
}

// ═══════════════════════════════════════════════════════════════
// CONSTRUCTION ANIMÉE (générique)
//   S    : sommet (repère absolu)
//   rot  : direction du côté déjà tracé (= graduation 0 du rapporteur)
//   ang  : mesure à construire
//   steps: graduations successives du comptage
//   n    : noms [point du 1er côté, sommet, point du 2e côté]
// ═══════════════════════════════════════════════════════════════
const EX = {
  e1: { S: { x: 205, y: 300 }, rot: 0,  g0: 0,  ang: 50,  len1: 285, steps: [0, 10, 20, 30, 40, 50], n: ['A', 'B', 'C'], vb: '0 80 590 255' },
  e2: { S: { x: 262, y: 250 }, rot: 25, g0: 20, ang: 125, len1: 285, steps: [20, 30, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 141, 142, 143, 144, 145], n: ['E', 'F', 'G'], vb: '0 70 590 290' },
};

function buildConstr(k) {
  const e = EX[k], S = e.S;
  const d2 = e.rot + e.ang;
  const P1 = pt(e.rot, 245, S), E1 = pt(e.rot, e.len1, S);
  const REP = pt(d2, R + 12, S), E2 = pt(d2, R + 75, S);
  const { d1, d5, d10 } = ticksLocal();
  const rArc = `M ${-R} 0 A ${R} ${R} 0 0 1 ${R} 0`;
  let segs = '';
  for (let i = 0; i < e.steps.length - 1; i++)
    segs += `<path id="${k}arc-${i}" d="${arc(e.steps[i], e.steps[i + 1], R - 9, O)}" fill="none" stroke="${arcColor(e.steps[i], e.steps[i + 1])}" stroke-width="8" stroke-linecap="butt" opacity="0"/>`;
  const b0 = pt(e.g0, R + 30, O);
  const lab = (p, dx, dy, t, id = '') => `<text ${id ? `id="${id}"` : ''} x="${f(p.x + dx)}" y="${f(p.y + dy)}" font-family="${FONT}" font-size="19" font-weight="800" fill="#222">${t}</text>`;
  // position des étiquettes de point : décalées perpendiculairement au côté
  const off1 = pt(e.rot - 90, 22, P1), offR = pt(d2 + 90, 20, REP), offS = pt(e.rot + 180 + 35, 24, S);
  const valPos = pt(e.rot + e.ang / 2, 72, S);

  return `<svg width="590" height="${e.vb.split(' ')[3]}" viewBox="${e.vb}" style="max-width:100%">
  <!-- 1er côté, déjà tracé -->
  <line x1="${S.x}" y1="${S.y}" x2="${f(E1.x)}" y2="${f(E1.y)}" stroke="${ROUGE}" stroke-width="3" stroke-linecap="round"/>
  ${croix(k + 'P1', P1, '#222')}${croix(k + 'S', S, '#222')}
  ${lab(off1, -6, 7, e.n[0])}${lab(offS, -7, 7, e.n[1])}

  <!-- Rapporteur : translate (slide-in) puis rotation autour du sommet -->
  <g id="${k}rapp" opacity="0" transform="translate(${S.x},${S.y})">
    <g transform="rotate(${-(e.rot - e.g0)})">
      <path d="${rArc} L ${-R} 0 Z" fill="rgba(219,234,254,0.35)" stroke="none"/>
      <line x1="${-R}" y1="0" x2="${R}" y2="0" stroke="#4b5563" stroke-width="2.5" stroke-linecap="round"/>
      <path d="${rArc}" fill="none" stroke="#4b5563" stroke-width="2.5"/>
      <path d="${d1}" fill="none" stroke="#bbbbbb" stroke-width="0.8"/>
      <path d="${d5}" fill="none" stroke="#888888" stroke-width="1.2"/>
      <path d="${d10}" fill="none" stroke="#444444" stroke-width="1.8"/>
      ${segs}
      <line id="${k}bras" x1="0" y1="0" x2="${f(b0.x)}" y2="${f(b0.y)}" stroke="#888" stroke-width="3" stroke-linecap="round" opacity="0"/>
      <circle cx="0" cy="0" r="3.5" fill="#222"/>
    </g>
  </g>

  <!-- Compteur (repère absolu, toujours horizontal) -->
  <rect id="${k}box" x="0" y="0" width="58" height="28" rx="5" fill="#fffbe8" fill-opacity="0.95" stroke="#b34700" stroke-width="2" opacity="0"/>
  <text id="${k}val" x="0" y="0" text-anchor="middle" font-family="${FONT}" font-size="17" font-weight="700" fill="#b34700" opacity="0">0°</text>

  <!-- Repère, 2e côté, point et arc -->
  <g id="${k}rep" opacity="0">${croix(k + 'P2', REP, ROUGE, 6)}</g>
  <line id="${k}cote2" x1="${S.x}" y1="${S.y}" x2="${S.x}" y2="${S.y}" data-x2="${f(E2.x)}" data-y2="${f(E2.y)}" stroke="${ROUGE}" stroke-width="3" stroke-linecap="round" opacity="0"/>
  ${lab(offR, -7, 7, '', k + 'n2')}
  <path id="${k}ang" d="${arc(e.rot, d2, 42, S)}" fill="none" stroke="${ROUGE}" stroke-width="2.5" opacity="0"/>
  <g id="${k}fin" opacity="0">
    <rect x="${f(valPos.x - 29)}" y="${f(valPos.y - 15)}" width="58" height="27" rx="5" fill="#fffbe8" fill-opacity="0.95" stroke="#b34700" stroke-width="2"/>
    <text x="${f(valPos.x)}" y="${f(valPos.y + 5)}" text-anchor="middle" font-family="${FONT}" font-size="16" font-weight="700" fill="#b34700">${e.ang}°</text>
  </g>
</svg>`;
}

function resetConstr(k) {
  const e = EX[k];
  const g = document.getElementById(k + 'rapp'); if (!g) return;
  g.setAttribute('transform', `translate(${e.S.x},${e.S.y})`); g.setAttribute('opacity', '0');
  for (let i = 0; i < e.steps.length - 1; i++) { const a = document.getElementById(`${k}arc-${i}`); if (a) a.setAttribute('opacity', '0'); }
  const b0 = pt(e.g0, R + 30, O), br = document.getElementById(k + 'bras');
  br.setAttribute('x2', f(b0.x)); br.setAttribute('y2', f(b0.y)); br.setAttribute('opacity', '0');
  [k + 'box', k + 'val', k + 'rep', k + 'ang', k + 'fin', k + 'cote2'].forEach(id => document.getElementById(id).setAttribute('opacity', '0'));
  const c2 = document.getElementById(k + 'cote2'); c2.setAttribute('x2', e.S.x); c2.setAttribute('y2', e.S.y);
  document.getElementById(k + 'n2').textContent = '';
  const res = document.getElementById(k + 'res'); if (res) res.classList.remove('visible');
}

async function construire(k) {
  if (animating) return;
  animating = true;
  const myGen = animGen, live = () => animGen === myGen;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const frames = (dur, fn) => new Promise(res => {
    let t0 = null;
    const step = ts => { if (!live()) return res(); if (!t0) t0 = ts; const p = Math.min((ts - t0) / dur, 1); fn(p); if (p < 1) requestAnimationFrame(step); else res(); };
    requestAnimationFrame(step);
  });
  const e = EX[k], S = e.S;
  const btn = document.getElementById(k + 'btn'); if (btn) btn.disabled = true;
  resetConstr(k);
  const $ = id => document.getElementById(k + id);
  const g = $('rapp'), br = $('bras'), box = $('box'), val = $('val');

  function placerCompteur(g) {          // g : graduation du rapporteur
    const deg = g - e.g0;                 // mesure comptée depuis le côté tracé
    const p = pt(e.rot + deg, 60, S);
    box.setAttribute('x', f(p.x - 29)); box.setAttribute('y', f(p.y - 16));
    val.setAttribute('x', f(p.x)); val.setAttribute('y', f(p.y + 5));
    val.textContent = deg + '°';
  }

  // 1) Le rapporteur arrive : centre sur le sommet, 0 sur le côté déjà tracé
  const dy = 120;
  await frames(600, p => {
    const q = p < .5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
    g.setAttribute('transform', `translate(${S.x},${f(S.y + dy * (1 - q))})`); g.setAttribute('opacity', q.toFixed(3));
  }); if (!live()) return;
  g.setAttribute('transform', `translate(${S.x},${S.y})`); g.setAttribute('opacity', '1');
  await wait(400); if (!live()) return;

  // 2) On compte les graduations jusqu'à la mesure voulue
  br.setAttribute('opacity', '1'); box.setAttribute('opacity', '1'); val.setAttribute('opacity', '1');
  placerCompteur(e.g0);
  await wait(500); if (!live()) return;
  for (let i = 1; i < e.steps.length; i++) {
    const g1 = e.steps[i - 1], g2 = e.steps[i], petit = g2 - g1 === 1;
    // l'arc se trace en même temps que le bras tourne
    const a = $('arc-' + (i - 1)), L = a.getTotalLength();
    a.setAttribute('stroke-dasharray', L); a.setAttribute('stroke-dashoffset', L); a.setAttribute('opacity', '1');
    await frames(petit ? 180 : 380, p => {
      a.setAttribute('stroke-dashoffset', f(L * (1 - p)));
      const b = pt(g1 + (g2 - g1) * p, R + 30, O); br.setAttribute('x2', f(b.x)); br.setAttribute('y2', f(b.y));
    }); if (!live()) return;
    placerCompteur(g2);
    await wait(petit ? 150 : 180); if (!live()) return;
  }

  // 3) On fait un repère au bord du rapporteur
  await wait(300); if (!live()) return;
  const rep = $('rep');
  await frames(300, p => rep.setAttribute('opacity', p.toFixed(2))); if (!live()) return;
  await wait(700); if (!live()) return;

  // 4) On retire le rapporteur
  br.setAttribute('opacity', '0'); box.setAttribute('opacity', '0'); val.setAttribute('opacity', '0');
  await frames(500, p => { g.setAttribute('opacity', (1 - p).toFixed(3)); g.setAttribute('transform', `translate(${S.x},${f(S.y + dy * p * p)})`); }); if (!live()) return;
  await wait(300); if (!live()) return;

  // 5) On trace le 2e côté : du sommet en passant par le repère
  const c2 = $('cote2'), x2 = +c2.dataset.x2, y2 = +c2.dataset.y2;
  c2.setAttribute('opacity', '1');
  await frames(800, p => { const q = 1 - Math.pow(1 - p, 2); c2.setAttribute('x2', f(S.x + (x2 - S.x) * q)); c2.setAttribute('y2', f(S.y + (y2 - S.y) * q)); }); if (!live()) return;
  $('n2').textContent = e.n[2];
  await wait(400); if (!live()) return;

  // 6) On code l'angle et on affiche sa mesure
  const an = $('ang'), La = an.getTotalLength();
  an.setAttribute('stroke-dasharray', La); an.setAttribute('stroke-dashoffset', La); an.setAttribute('opacity', '1');
  await frames(600, p => an.setAttribute('stroke-dashoffset', f(La * (1 - p)))); if (!live()) return;
  await wait(300); if (!live()) return;
  $('fin').setAttribute('opacity', '1');
  const res = $('res'); if (res) res.classList.add('visible');

  animating = false; if (btn) btn.disabled = false;
}

// ═══════════════════════════════════════════════════════════════
// PAGES
// ═══════════════════════════════════════════════════════════════
const STEPS_PAGE = [

// PAGE 1 — Pourquoi
() => `
  <div class="step-title pop">💡 Construire un angle avec le rapporteur</div>
  <div class="pourquoi fade-in">
    <span class="pq-lead">🤔 Pourquoi ?</span>
    Pour tracer un angle qui a exactement la mesure demandée.
  </div>
  <p class="fade-in" style="font-size:.95rem;line-height:1.7;color:#334155;max-width:620px;width:100%;">
    Construire un angle, c'est le contraire de le mesurer : on connaît déjà la mesure, et on doit <b>tracer</b> l'angle.
  </p>
  <div class="info violet fade-in">
    On commence toujours d'un <b>côté déjà tracé</b> : une de ses extrémités sera le <b>sommet</b> de l'angle.
    Le rapporteur sert à trouver la direction du deuxième côté.
  </div>
  <div class="info orange fade-in">
    Avant de commencer à tracer, on regarde la mesure demandée et on <b>imagine l'angle dans sa tête</b> (est-il <b>aigu</b> ? <b>obtus</b> ?).
  </div>
`,

// PAGE 2 — Exemple 1 : 50°, côté horizontal
() => `
  <div class="step-title pop">✏️ Exemple : un angle aigu</div>
  <div class="consigne fade-in">Construire l'angle ${hat('ABC')} de mesure 50°.</div>
  <p class="fade-in" style="font-size:.9rem;color:#334155;max-width:620px;width:100%;line-height:1.9;">
    L'angle mesure 50°, ce sera un angle <b>aigu</b> (un peu plus que la moitié d'un angle droit).<br>
    Le sommet de l'angle ${hat('ABC')} est le point <b>B</b>.<br>
    On place le centre du rapporteur sur B, puis on compte les graduations jusqu'à 50°. Entre deux grandes graduations, il y a <b>10°</b>.
  </p>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;">
    <div class="fade-in">${buildConstr('e1')}</div>
    <button id="e1btn" class="btn-mesurer fade-in" onclick="construire('e1')">Construire</button>
    <div id="e1res" class="result-label">L'angle ${hat('ABC')} mesure 50°. Il est bien aigu.</div>
  </div>
`,

// PAGE 3 — Exemple 2 : 125°, côté incliné
() => `
  <div class="step-title pop">✏️ Exemple : un angle obtus</div>
  <div class="consigne fade-in">Construire l'angle ${hat('EFG')} de mesure 125°.</div>
  <p class="fade-in" style="font-size:.9rem;color:#334155;max-width:620px;width:100%;line-height:1.6;">
    L'angle mesure 125°, c'est 35° de plus qu'un angle droit : l'angle sera <b>obtus</b>.<br>
    On place le centre du rapporteur sur le sommet F de l'angle puis on compte jusqu'à 125° avec les graduations
    (on compte de 10° en 10° jusqu'à 120°, puis de 1° en 1° jusqu'à 125°).
  </p>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;">
    <div class="fade-in">${buildConstr('e2')}</div>
    <button id="e2btn" class="btn-mesurer fade-in" onclick="construire('e2')">Construire</button>
    <div id="e2res" class="result-label">L'angle ${hat('EFG')} mesure 125°. Il est bien obtus.</div>
  </div>
`,

// PAGE 4 — Bilan
() => `
  <div class="step-title pop">📋 Ce qu'il faut retenir</div>
  <div class="recap-list">
    <div class="recap-item fade-in" style="border-left-color:var(--primary);">
      <div class="recap-num" style="background:var(--primary);">1</div>
      <div>Avant de construire, on <b>imagine</b> l'angle : <b>aigu</b> ou <b>obtus</b> ?</div>
    </div>
    <div class="recap-item fade-in" style="animation-delay:.07s;border-left-color:var(--teal);">
      <div class="recap-num" style="background:var(--teal);">2</div>
      <div>On part d'un <b>côté déjà tracé</b>. On place le <b>centre du rapporteur sur le sommet</b>.</div>
    </div>
    <div class="recap-item fade-in" style="animation-delay:.14s;border-left-color:var(--bleu);">
      <div class="recap-num" style="background:var(--bleu);">3</div>
      <div>On <b>compte</b> les graduations jusqu'à la mesure voulue (de 10° en 10°, puis de 1° en 1°) et on fait un <b>repère</b> au bord du rapporteur.</div>
    </div>
    <div class="recap-item fade-in" style="animation-delay:.21s;border-left-color:var(--orange);">
      <div class="recap-num" style="background:var(--orange);">4</div>
      <div>On retire le rapporteur et on trace le <b>deuxième côté</b> : du sommet, en passant par le repère.</div>
    </div>
    <div class="recap-item fade-in" style="animation-delay:.28s;border-left-color:var(--vert);">
      <div class="recap-num" style="background:var(--vert);">5</div>
      <div>On <b>vérifie</b> que l'angle tracé ressemble à ce qu'on avait imaginé.</div>
    </div>
  </div>
`,

];

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function render() {
  animating = false;
  animGen++;
  document.getElementById('card').innerHTML = STEPS_PAGE[cur]();
  document.getElementById('pbar').style.width = `${((cur + 1) / N) * 100}%`;
  const stepsEl = document.getElementById('steps');
  stepsEl.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i === cur ? ' active' : i < cur ? ' done' : '');
    d.textContent = i + 1;
    d.onclick = () => { cur = i; render(); };
    stepsEl.appendChild(d);
  }
  document.getElementById('btnPrev').style.visibility = cur === 0 ? 'hidden' : 'visible';
  document.getElementById('btnNext').style.display = cur === N - 1 ? 'none' : 'inline-block';
  document.getElementById('pageInfo').textContent = `${cur + 1} / ${N}`;
}
function next() { if (cur < N - 1) { cur++; render(); } }
function prev() { if (cur > 0) { cur--; render(); } }
render();
</script>
</body>
</html>
