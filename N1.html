<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>Multiplier par 10, 100, 1000 – 6e</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:light;
    --bleu: #1a73e8; --bleu-clair: #e8f0fe;
    --orange: #ea580c; --orange-clair: #ffedd5;
    --vert: #16a34a; --vert-clair: #f0fdf4;
    --violet: #7c3aed; --violet-clair: #f5f3ff;
    --violet2: #a855f7;
    --gris: #94a3b8; --bg: #f0f4ff;
    --card: #ffffff; --texte: #1e293b; --border: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; color:var(--texte); }
  header { display:flex; justify-content:center; margin-bottom:22px; }
  .header-row { display:flex; align-items:center; gap:14px; max-width:680px; width:100%; }
  .badge-code { display:inline-flex; align-items:center; justify-content:center; min-width:48px; height:48px; border-radius:12px; border:2.5px solid var(--bleu); background:var(--bleu-clair); font-family:'Baloo 2',cursive; font-size:1.3rem; font-weight:800; color:var(--bleu); flex-shrink:0; }
  .tache-label { font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; color:var(--bleu); line-height:1.3; }
  .progress-bar-wrap { width:100%; max-width:680px; background:#dbeafe; border-radius:99px; height:10px; margin-bottom:18px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:99px; transition:width 0.5s ease; }
  .steps-indicator { display:flex; gap:10px; margin-bottom:20px; }
  .step-dot { width:34px; height:34px; border-radius:50%; background:#dbeafe; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:#93c5fd; transition:all 0.4s; border:2px solid transparent; }
  .step-dot.active { background:var(--bleu); color:white; border-color:var(--bleu); transform:scale(1.15); box-shadow:0 0 0 4px #bfdbfe; }
  .step-dot.done   { background:var(--vert); color:white; border-color:var(--vert); }
  .card { background:var(--card); border-radius:20px; padding:26px 28px; max-width:680px; width:100%; min-height:360px; display:flex; flex-direction:column; align-items:center; gap:16px; box-shadow:0 4px 24px rgba(26,115,232,0.10); position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:20px 20px 0 0; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.4s ease both; }
  @keyframes pop { 0%{transform:scale(0.8);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  .pop { animation:pop 0.45s ease both; }
  .step-title { font-family:'Baloo 2',cursive; font-size:1.2rem; font-weight:800; color:var(--bleu); text-align:center; }
  .step-text  { font-size:0.97rem; color:var(--texte); text-align:center; line-height:1.75; max-width:540px; font-weight:600; }
  .info { border-radius:12px; padding:12px 18px; font-size:0.93rem; font-weight:600; max-width:580px; width:100%; line-height:1.6; }
  .info.bleu { background:var(--bleu-clair); color:var(--bleu); border-left:4px solid var(--bleu); }
  .big-eq { display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center; font-family:'Baloo 2',cursive; font-size:1.7rem; font-weight:800; }
  .big-eq .op { color:var(--gris); font-size:1.4rem; }
  .big-eq .eq { color:var(--bleu); }
  .recap-list { display:flex; flex-direction:column; gap:9px; max-width:580px; width:100%; }
  .recap-item { display:flex; align-items:flex-start; gap:12px; background:#f8faff; border-radius:12px; padding:11px 16px; font-size:0.93rem; font-weight:600; color:var(--texte); animation:fadeIn 0.4s ease both; border-left:4px solid transparent; line-height:1.5; }
  .recap-num  { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:700; flex-shrink:0; color:white; margin-top:1px; }
  .nav { display:flex; gap:14px; margin-top:10px; align-items:center; }
  button.btn-nav { font-family:'Baloo 2',cursive; font-weight:700; font-size:1rem; border:none; cursor:pointer; border-radius:12px; padding:12px 28px; transition:all 0.2s; }
  .btn-next { background:linear-gradient(135deg,var(--bleu),var(--violet)); color:white; box-shadow:0 4px 14px rgba(26,115,232,0.3); }
  .btn-next:hover { transform:translateY(-2px); }
  .btn-next:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
  .btn-prev { background:#e0e7ff; color:var(--bleu); }
  .btn-prev:hover { background:#c7d2fe; }
  .btn-complete { font-family:'Baloo 2',cursive; font-weight:700; font-size:0.95rem; border:2px solid var(--vert); cursor:pointer; border-radius:10px; padding:10px 22px; background:var(--vert-clair); color:var(--vert); transition:all 0.2s; }
  .btn-complete:hover { background:var(--vert); color:white; }
  .pourquoi { position:relative; background:#f0fdfa; border-left:4px solid #0d9488; border-radius:10px; padding:12px 15px; font-size:0.92rem; font-weight:600; color:#134e4a; line-height:1.6; max-width:580px; width:100%; }
  .pq-lead { font-family:'Baloo 2',cursive; font-weight:800; color:#0d9488; }
  .step-counter { font-size:0.85rem; color:var(--gris); font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="badge-code">N1</div>
    <div class="tache-label">Multiplier un nombre par 10, par 100, ou par 1 000</div>
  </div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-nav btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-nav btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
const CW=76,CMW=24,HDR=24,ROW=70,TH=2*(HDR+ROW);
const COTE='#1251a3';

// ── Cote dessin technique ────────────────────────────────────────────────────
function coteLine(x1,y1,x2,y2,label,col,t,lox,loy,anc){
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  const nx=-dy/len,ny=dx/len; t=t||6;
  const lx=(x1+x2)/2+(lox||0),ly=(y1+y2)/2+(loy||0);
  return `
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="${x1-nx*t}" y1="${y1-ny*t}" x2="${x1+nx*t}" y2="${y1+ny*t}" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="${x2-nx*t}" y1="${y2-ny*t}" x2="${x2+nx*t}" y2="${y2+ny*t}" stroke="${col}" stroke-width="1.8" stroke-linecap="round"/>
    <polygon points="${x1},${y1} ${x1+dx/len*10+nx*4},${y1+dy/len*10+ny*4} ${x1+dx/len*10-nx*4},${y1+dy/len*10-ny*4}" fill="${col}"/>
    <polygon points="${x2},${y2} ${x2-dx/len*10+nx*4},${y2-dy/len*10+ny*4} ${x2-dx/len*10-nx*4},${y2-dy/len*10-ny*4}" fill="${col}"/>
    <text x="${lx}" y="${ly}" text-anchor="${anc||'middle'}" font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="${col}">${label}</text>`;
}

// ── Grille 12×10 pour 12×10=120 ─────────────────────────────────────────────
// 10 lignes bleues + 2 lignes violettes
// cote H "10", cote V unique "12"
// texte "120" au-dessus (sur les lignes bleues) en overlay
function buildGrille12x10(reveal){
  const SQ=14,GAP=2,perRow=10,LM=42,TM=34,rowStep=SQ+GAP;
  const barW=perRow*SQ+(perRow-1)*GAP;
  let s='';

  for(let r=0;r<12;r++){
    const y=TM+r*rowStep;
    const col=r<10?'var(--bleu)':'var(--violet2)';
    const op=r<10?0.78:0.65;
    s+=`<rect x="${LM}" y="${y}" width="${barW}" height="${SQ}" rx="2" fill="${col}" opacity="0.15"/>`;
    for(let c=0;c<perRow;c++)
      s+=`<rect x="${LM+c*(SQ+GAP)}" y="${y}" width="${SQ}" height="${SQ}" rx="2" fill="${col}" opacity="${op}"/>`;
  }

  // séparateur entre zones
  const sepY=TM+10*rowStep-GAP/2;
  s+=`<line x1="${LM-2}" y1="${sepY}" x2="${LM+barW+2}" y2="${sepY}" stroke="white" stroke-width="2.5" stroke-dasharray="3,2"/>`;

  // texte "100" centré sur les 10 premières lignes
  const blueH=10*rowStep-GAP;
  const textY=TM+blueH/2+8;
  // résultats "100" et "20" : seulement au clic
  if(reveal){
  s+=`<text x="${LM+barW/2}" y="${textY}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="22" font-weight="800"
    fill="#0d3d8a" stroke="#0d3d8a" stroke-width="4" stroke-linejoin="round" paint-order="stroke">100</text>`;
  s+=`<text x="${LM+barW/2}" y="${textY}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="22" font-weight="800"
    fill="white">100</text>`;
  const purpY=TM+blueH+GAP+rowStep;
  s+=`<text x="${LM+barW/2}" y="${purpY+6}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="14" font-weight="800"
    fill="#4a1272" stroke="#4a1272" stroke-width="3" stroke-linejoin="round" paint-order="stroke">20</text>`;
  s+=`<text x="${LM+barW/2}" y="${purpY+6}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="14" font-weight="800"
    fill="white">20</text>`;
  }

  const svgH=TM+12*rowStep+4, svgW=LM+barW+6;
  // cote H
  s+=coteLine(LM,TM-16,LM+barW,TM-16,'10',COTE,5,0,-8,'middle');
  // cote V unique 12
  s+=coteLine(LM-14,TM,LM-14,TM+12*rowStep-GAP,'12',COTE,5,-22,0,'middle');

  return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" style="display:block;overflow:visible">${s}</svg>`;
}

// ── Visuel 12×100 : 1 grand rectangle bleu + 1 rectangle violet ─────────────
// Grand rectangle bleu = 10×100 = 1000, avec "10×100=1000" inscrit
// Petit rectangle violet = 2×100 = 200, avec "200" inscrit
// Cotes : H="100", V="12" (sur toute la hauteur)
function buildBlocs12x100(reveal){
  const BW=140;
  const LM=46, TM=34;

  // hauteur proportionnelle : bleu = 10/12, violet = 2/12
  const totalH=200;
  const blueH=Math.round(totalH*10/12);
  const purpH=totalH-blueH;
  const GAP=4;

  let s='';

  // grand rectangle bleu
  s+=`<rect x="${LM}" y="${TM}" width="${BW}" height="${blueH}" rx="6"
    fill="var(--bleu)" opacity="0.80"/>`;
  if(reveal){
  s+=`<text x="${LM+BW/2}" y="${TM+blueH/2-6}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="15" font-weight="800" fill="white">10 × 100</text>`;
  s+=`<text x="${LM+BW/2}" y="${TM+blueH/2+16}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="18" font-weight="800"
    fill="#0d3d8a" stroke="#0d3d8a" stroke-width="4" stroke-linejoin="round" paint-order="stroke">1 000</text>`;
  s+=`<text x="${LM+BW/2}" y="${TM+blueH/2+16}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="18" font-weight="800" fill="white">1 000</text>`;
  }

  // rectangle violet
  s+=`<rect x="${LM}" y="${TM+blueH+GAP}" width="${BW}" height="${purpH}" rx="6"
    fill="var(--violet2)" opacity="0.75"/>`;
  // rectangle violet — "2 × 100 = 200" : seulement au clic
  if(reveal){
  const vyc = TM+blueH+GAP+purpH/2+6; // y centre vertical
  s+=`<text x="${LM+BW/2-18}" y="${vyc}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="white">2 × 100 =</text>`;
  s+=`<text x="${LM+BW/2+30}" y="${vyc}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="14" font-weight="800"
    fill="#4a1272" stroke="#4a1272" stroke-width="3" stroke-linejoin="round" paint-order="stroke">200</text>`;
  s+=`<text x="${LM+BW/2+30}" y="${vyc}" text-anchor="middle"
    font-family="Baloo 2,cursive" font-size="14" font-weight="800" fill="white">200</text>`;
  }

  const svgH=TM+blueH+GAP+purpH+6;
  const svgW=LM+BW+6;

  // séparateur
  s+=`<line x1="${LM-2}" y1="${TM+blueH+GAP/2}" x2="${LM+BW+2}" y2="${TM+blueH+GAP/2}"
    stroke="white" stroke-width="2" stroke-dasharray="4,3"/>`;

  // cote H
  s+=coteLine(LM,TM-16,LM+BW,TM-16,'100',COTE,5,0,-8,'middle');
  // cote V unique "12"
  s+=coteLine(LM-14,TM,LM-14,TM+blueH+GAP+purpH,'12',COTE,5,-22,0,'middle');

  return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" style="display:block;overflow:visible">${s}</svg>`;
}

// ── Tableau rangs ────────────────────────────────────────────────────────────
function buildTableau(cfg,uid,reveal){
  const cols=cfg.cols,TV=cfg.topVals||[],BV=cfg.botVals||[];
  const TC=cfg.topCls||[],BC=cfg.botCls||[],AR=cfg.arrows||[];
  const AVC='var(--orange)',AVBG='var(--orange-clair)';
  const APC='var(--vert)',  APBG='var(--vert-clair)';
  const GRC='var(--gris)', WT='white', HD='#f8faff';
  let W=0; const colX=[],realX=[];
  cols.forEach(c=>{colX.push(W);if(c.comma){W+=CMW;}else{realX.push(W+CW/2);W+=CW;}});
  const yFS=HDR+ROW-12,yFE=HDR+ROW+HDR+12,yMZ=HDR+ROW+HDR/2;
  function cC(cls){return cls==='av'?AVC:cls==='ap'?APC:cls==='gr'?GRC:'var(--texte)';}
  function cB(cls){return cls==='av'?AVBG:cls==='ap'?APBG:WT;}
  let s=`<svg width="${W}" height="${TH}" viewBox="0 0 ${W} ${TH}" style="display:block;overflow:visible" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect x="0" y="0" width="${W}" height="${TH}" rx="12" fill="white" stroke="var(--border)" stroke-width="2"/>`;
  s+=`<line x1="0" y1="${HDR+ROW}" x2="${W}" y2="${HDR+ROW}" stroke="var(--border)" stroke-width="2"/>`;
  let xv=0;
  cols.forEach((c,ci)=>{xv+=c.comma?CMW:CW;if(ci<cols.length-1)s+=`<line x1="${xv}" y1="0" x2="${xv}" y2="${TH}" stroke="var(--border)" stroke-width="1.5"/>`;});
  let ri=0;
  cols.forEach((c,ci)=>{
    const x=colX[ci];
    if(c.comma){
      s+=`<text x="${x+CMW/2}" y="${HDR+ROW/2+11}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="30" font-weight="800" fill="var(--texte)">,</text>`;
      s+=`<text x="${x+CMW/2}" y="${HDR+ROW+HDR+ROW/2+11}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="30" font-weight="800" fill="var(--texte)">,</text>`;
      return;
    }
    s+=`<rect x="${x}" y="0" width="${CW}" height="${HDR}" fill="${HD}"/>`;
    s+=`<text x="${x+CW/2}" y="${HDR-6}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="9.5" font-weight="700" fill="var(--gris)" letter-spacing="0.3">${c.label.toUpperCase()}</text>`;
    s+=`<rect x="${x}" y="${HDR+ROW}" width="${CW}" height="${HDR}" fill="${HD}" opacity="0.6"/>`;
    const tC=TC[ri]||'',tV=TV[ri]!==undefined?TV[ri]:'';
    if(cB(tC)!==WT)s+=`<rect x="${x+1}" y="${HDR+1}" width="${CW-2}" height="${ROW-2}" rx="4" fill="${cB(tC)}"/>`;
    if(tV!=='')s+=`<text x="${x+CW/2}" y="${HDR+ROW/2+11}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="30" font-weight="800" fill="${cC(tC)}">${tV}</text>`;
    const bC=BC[ri]||'',bV=BV[ri]!==undefined?BV[ri]:'';
    const yB=HDR+ROW+HDR;
    if(cB(bC)!==WT && reveal)s+=`<rect x="${x+1}" y="${yB+1}" width="${CW-2}" height="${ROW-2}" rx="4" fill="${cB(bC)}"/>`;
    if(bV!=='' && reveal)s+=`<text x="${x+CW/2}" y="${yB+ROW/2+11}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="30" font-weight="800" fill="${cC(bC)}">${bV}</text>`;
    ri++;
  });
  if(reveal) AR.forEach((a,ai)=>{
    const col=a.color||'var(--bleu)',mkId=`mk${uid}${ai}`;
    s+=`<defs><marker id="${mkId}" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="${col}"/></marker></defs>`;
    const x1=realX[a.f],x2=realX[a.t];
    if(a.via!==undefined){
      const xV=realX[a.via],yMid=yMZ,mkId2=`mk${uid}${ai}b`;
      s+=`<defs><marker id="${mkId2}" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="${col}"/></marker></defs>`;
      s+=`<line x1="${x1}" y1="${yFS}" x2="${xV}" y2="${yMid}" stroke="${col}" stroke-width="2.5" stroke-linecap="round" marker-end="url(#${mkId2})"/>`;
      const lx1=(x1+xV)/2+(xV<x1?6:-6),ly1=(yFS+yMid)/2-4;
      s+=`<text x="${lx1}" y="${ly1}" text-anchor="${xV<x1?'start':'end'}" font-family="Nunito,sans-serif" font-size="11" font-weight="700" fill="${col}">${a.label}</text>`;
      s+=`<line x1="${xV}" y1="${yMid}" x2="${x2}" y2="${yFE}" stroke="${col}" stroke-width="2.5" stroke-linecap="round" marker-end="url(#${mkId})"/>`;
      const lx2=(xV+x2)/2+(x2<xV?6:-6),ly2=(yMid+yFE)/2+13;
      s+=`<text x="${lx2}" y="${ly2}" text-anchor="${x2<xV?'start':'end'}" font-family="Nunito,sans-serif" font-size="11" font-weight="700" fill="${col}">${a.label}</text>`;
    } else {
      s+=`<line x1="${x1}" y1="${yFS}" x2="${x2}" y2="${yFE}" stroke="${col}" stroke-width="2.8" stroke-linecap="round" marker-end="url(#${mkId})"/>`;
      const lx=(x1+x2)/2,ly=(yFS+yFE)/2-3,dx=x2<=x1?-7:7,anc=x2<=x1?'end':'start';
      s+=`<text x="${lx+dx}" y="${ly}" text-anchor="${anc}" font-family="Nunito,sans-serif" font-size="11" font-weight="700" fill="${col}">${a.label}</text>`;
    }
  });
  s+=`<rect x="0" y="0" width="${W}" height="${TH}" rx="12" fill="none" stroke="var(--border)" stroke-width="2"/></svg>`;
  return `<div class="fade-in" style="display:flex;justify-content:center;width:100%">${s}</div>`;
}

function legendeG(colA,lA,colB,lB){
  return `<div class="fade-in" style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:0.82rem;font-weight:700">
    <div style="display:flex;align-items:center;gap:5px">
      <svg width="22" height="11"><rect width="22" height="11" rx="2" fill="${colA}" opacity="0.78"/></svg>
      <span style="color:${colA}">${lA}</span>
    </div>
    <div style="display:flex;align-items:center;gap:5px">
      <svg width="22" height="11"><rect width="22" height="11" rx="2" fill="${colB}" opacity="0.65"/></svg>
      <span style="color:${colB}">${lB}</span>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
const STEPS = [

() => `
<div class="step-title pop">💡 L'idée de base</div>
<div class="pourquoi fade-in"><span class="pq-lead">🤔 Pourquoi ?</span> La multiplication par 10, 100 ou 1000 utilise la manière dont les nombres sont écrits (dizaines, centaines…). Travailler sur ces multiplications nous permet de mieux comprendre les nombres.</div>
<p class="step-text fade-in">
  Dans un nombre, chaque rang vaut <strong style="color:var(--bleu)">10 fois plus</strong>
  que le rang à sa droite.<br><br>
  Multiplier un nombre par 10, c'est rendre chaque chiffre
  <strong style="color:var(--orange)">10 fois plus grand</strong>.<br><br>
  Le rang juste à gauche vaut exactement 10 fois plus :
  chaque chiffre <strong style="color:var(--vert)">prend la place du rang à sa gauche</strong>.
</p>
<div class="info bleu fade-in">
  📌 Ce sont les <strong>chiffres qui changent de rang</strong>.
  La virgule reste toujours à la même place, entre les unités et les dixièmes.
</div>
`,

() => `
<div class="step-title pop">✏️ Exemple : 12 × 10</div>
<p class="step-text fade-in">
  Les <strong style="color:var(--orange)">2 unités</strong> deviennent des <strong style="color:var(--vert)">dizaines</strong>,<br>
  la <strong style="color:var(--orange)">1 dizaine</strong> devient une <strong style="color:var(--vert)">centaine</strong>.<br><br>

let cur=0, revealed=false; const N=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=STEPS[cur](); card.className='card fade-in';
  document.getElementById('progressBar').style.width=(cur/(N-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator'); ind.innerHTML='';
  for(let i=0;i<N;i++){
    const d=document.createElement('div');
    d.className='step-dot'+(i===cur?' active':i<cur?' done':'');
    d.textContent=i<cur?'✓':i+1; ind.appendChild(d);
  }
  document.getElementById('counter').textContent=`Page ${cur+1} / ${N}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===N-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===N-1?0:cur+1;revealed=false;render();}
function prev(){if(cur>0){cur--;revealed=false;render();}}
function completer(){revealed=true;render();}
render();
</script>
