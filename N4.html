<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>N4 Écrire un nombre entier en lettres</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:light;
    --bleu:#1a73e8; --bleu-clair:#e8f0fe;
    --orange:#ea580c; --orange-clair:#ffedd5;
    --vert:#16a34a; --vert-clair:#f0fdf4;
    --violet:#7c3aed; --violet-clair:#f5f3ff;
    --rouge:#dc2626; --rouge-clair:#fee2e2;
    --gris:#94a3b8; --bg:#f0f4ff;
    --card:#ffffff; --texte:#1e293b; --border:#e2e8f0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; color:var(--texte); }
  header { display:flex; justify-content:center; margin-bottom:22px; }
  .header-row { display:flex; align-items:center; gap:14px; max-width:680px; width:100%; }
  .badge-code { display:inline-flex; align-items:center; justify-content:center; min-width:48px; height:48px; border-radius:12px; border:2.5px solid var(--bleu); background:var(--bleu-clair); font-family:'Baloo 2',cursive; font-size:1.3rem; font-weight:800; color:var(--bleu); flex-shrink:0; }
  .tache-label { font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; color:var(--bleu); line-height:1.3; }
  .progress-bar-wrap { width:100%; max-width:680px; background:#dbeafe; border-radius:99px; height:10px; margin-bottom:18px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:99px; transition:width 0.5s ease; }
  .steps-indicator { display:flex; gap:10px; margin-bottom:20px; }
  .step-dot { width:34px; height:34px; border-radius:50%; background:#dbeafe; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:#93c5fd; transition:all 0.4s; border:2px solid transparent; }
  .step-dot.active { background:var(--bleu); color:white; border-color:var(--bleu); transform:scale(1.15); box-shadow:0 0 0 4px #bfdbfe; }
  .step-dot.done   { background:var(--vert); color:white; border-color:var(--vert); }
  .card { background:var(--card); border-radius:20px; padding:26px 28px; max-width:680px; width:100%; min-height:360px; display:flex; flex-direction:column; align-items:center; gap:14px; box-shadow:0 4px 24px rgba(26,115,232,0.10); position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:20px 20px 0 0; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.4s ease both; }
  @keyframes pop { 0%{transform:scale(0.8);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  .pop { animation:pop 0.45s ease both; }
  .step-title { font-family:'Baloo 2',cursive; font-size:1.2rem; font-weight:800; color:var(--bleu); text-align:center; line-height:1.3; max-width:560px; }
  .step-text  { font-size:0.97rem; color:var(--texte); text-align:center; line-height:1.75; max-width:540px; font-weight:600; }
  .info { border-radius:12px; padding:12px 18px; font-size:0.93rem; font-weight:600; max-width:580px; width:100%; line-height:1.6; }
  .info.bleu   { background:var(--bleu-clair);   color:var(--bleu);   border-left:4px solid var(--bleu); }
  .info.orange { background:var(--orange-clair); color:var(--orange); border-left:4px solid var(--orange); }
  .info.violet { background:var(--violet-clair); color:var(--violet); border-left:4px solid var(--violet); }
  .info.vert   { background:var(--vert-clair);   color:var(--vert);   border-left:4px solid var(--vert); }
  .info.gris   { background:#f1f5f9; color:#475569; border-left:4px solid var(--gris); }

  /* Nombre en chiffres avec groupes colorés */
  .nombre-chiffres { font-family:'Baloo 2',cursive; font-size:2rem; font-weight:800; letter-spacing:3px; text-align:center; }
  .g-milliards { color:var(--orange); }
  .g-millions  { color:var(--violet); }
  .g-milliers  { color:var(--bleu); }
  .g-unites    { color:var(--vert); }

  /* Résultat en lettres */
  .big-lettres { font-family:'Baloo 2',cursive; font-size:1.3rem; font-weight:800; color:var(--bleu); text-align:center; line-height:1.5; background:var(--bleu-clair); border-radius:14px; padding:14px 20px; max-width:560px; width:100%; border:2px solid var(--bleu); }

  /* Tableau CDU */
  .cdu-wrap { display:flex; justify-content:center; width:100%; }

  /* Grille décomposition chiffre par chiffre */
  .decomp { display:flex; flex-direction:column; gap:6px; max-width:480px; width:100%; }
  .decomp-row { display:flex; align-items:center; gap:10px; border-radius:10px; padding:8px 14px; font-size:0.93rem; font-weight:700; }
  .decomp-chiffre { font-family:'Baloo 2',cursive; font-size:1.5rem; font-weight:800; min-width:32px; text-align:center; flex-shrink:0; }
  .decomp-rang  { min-width:90px; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; flex-shrink:0; }
  .decomp-sep   { color:var(--gris); font-size:1.1rem; flex-shrink:0; }
  .decomp-mot   { font-size:0.97rem; font-weight:700; }

  /* Groupes tableau (réutilisé de N3) */
  .recap-list { display:flex; flex-direction:column; gap:9px; max-width:580px; width:100%; }
  .recap-item { display:flex; align-items:flex-start; gap:12px; background:#f8faff; border-radius:12px; padding:11px 16px; font-size:0.93rem; font-weight:600; color:var(--texte); animation:fadeIn 0.4s ease both; border-left:4px solid transparent; line-height:1.5; }
  .recap-num  { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:700; flex-shrink:0; color:white; margin-top:1px; }

  /* Page orthographe */
  .ortho-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:560px; }
  .ortho-bloc { background:#f8faff; border-radius:14px; padding:12px 16px; }
  .ortho-titre { font-family:'Baloo 2',cursive; font-size:0.9rem; font-weight:800; margin-bottom:8px; }
  .ortho-mots  { display:flex; flex-wrap:wrap; gap:6px; }
  .mot-tag { border-radius:8px; padding:4px 10px; font-size:0.85rem; font-weight:700; }

  .nav { display:flex; gap:14px; margin-top:10px; align-items:center; }
  button { font-family:'Baloo 2',cursive; font-weight:700; font-size:1rem; border:none; cursor:pointer; border-radius:12px; padding:12px 28px; transition:all 0.2s; }
  .btn-next { background:linear-gradient(135deg,var(--bleu),var(--violet)); color:white; box-shadow:0 4px 14px rgba(26,115,232,0.3); }
  .btn-next:hover { transform:translateY(-2px); }
  .btn-next:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
  .btn-prev { background:#e0e7ff; color:var(--bleu); }
  .btn-prev:hover { background:#c7d2fe; }
  .btn-complete { font-family:'Baloo 2',cursive; font-weight:700; font-size:0.95rem; border:2px solid var(--vert); cursor:pointer; border-radius:10px; padding:10px 22px; background:var(--vert-clair); color:var(--vert); transition:all 0.2s; }
  .btn-complete:hover { background:var(--vert); color:white; }
  .pourquoi { position:relative; background:#f0fdfa; border-left:4px solid #0d9488; border-radius:10px; padding:12px 15px; font-size:0.92rem; font-weight:600; color:#134e4a; line-height:1.6; max-width:580px; width:100%; }
  .pq-lead { font-family:'Baloo 2',cursive; font-weight:800; color:#0d9488; }
  .step-counter { font-size:0.85rem; color:var(--gris); font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="badge-code">N4</div>
    <div class="tache-label">Écrire un nombre entier en lettres</div>
  </div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
// ── Tableau groupes (même moteur que N3, responsive) ─────────────────────────
const HDR_H=28, CELL_H=58;
const GRP_COLORS = {
  milliards: { hbg:'#fde8d4', hcol:'#d4600a', bg:'var(--orange-clair)', col:'var(--orange)' },
  millions:  { hbg:'var(--violet-clair)', hcol:'var(--violet)', bg:'var(--violet-clair)', col:'var(--violet)' },
  milliers:  { hbg:'var(--bleu-clair)', hcol:'var(--bleu)', bg:'var(--bleu-clair)', col:'var(--bleu)' },
  unites:    { hbg:'var(--vert-clair)', hcol:'var(--vert)', bg:'var(--vert-clair)', col:'var(--vert)' },
};

function buildGroupes(groups, reveal) {
  if(reveal===undefined) reveal=true;
  const N=groups.length;
  const gw = N<=2?110:N===3?90:76;
  const totalW=N*gw, H=HDR_H+CELL_H;
  let s=`<svg width="${totalW}" height="${H}" viewBox="0 0 ${totalW} ${H}" style="display:block;width:100%;max-width:${totalW}px;height:auto">`;
  s+=`<rect x="0" y="0" width="${totalW}" height="${H}" rx="12" fill="white" stroke="var(--border)" stroke-width="2"/>`;
  s+=`<line x1="0" y1="${HDR_H}" x2="${totalW}" y2="${HDR_H}" stroke="var(--border)" stroke-width="1.5"/>`;
  groups.forEach((g,gi)=>{
    const x=gi*gw, c=GRP_COLORS[g.key];
    if(gi>0) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--border)" stroke-width="1.5"/>`;
    s+=`<rect x="${x}" y="0" width="${gw}" height="${HDR_H}" fill="${c.hbg}"/>`;
    const fs=g.label.length>8?'8.5':'9.5';
    s+=`<text x="${x+gw/2}" y="${HDR_H-8}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="${fs}" font-weight="700" fill="${c.hcol}" letter-spacing="0.2">${g.label.toUpperCase()}</text>`;
    if(c.bg && !g.nonlu) s+=`<rect x="${x+1}" y="${HDR_H+1}" width="${gw-2}" height="${CELL_H-2}" rx="4" fill="${c.bg}"/>`;
    if(g.nonlu) s+=`<rect x="${x+1}" y="${HDR_H+1}" width="${gw-2}" height="${CELL_H-2}" rx="4" fill="#f1f5f9"/>`;
    const vfs=g.val&&g.val.length>=3?'20':'22';
    const valcol = g.nonlu ? 'var(--gris)' : c.col;
    s+=`<text x="${x+gw/2}" y="${HDR_H+22}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${vfs}" font-weight="800" fill="${valcol}">${g.val||''}</text>`;
    const letcol = g.nonlu ? 'var(--gris)' : c.hcol;
    if(g.lettres && reveal) s+=`<text x="${x+gw/2}" y="${HDR_H+CELL_H-10}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="8.5" font-weight="700" fill="${letcol}">${g.lettres}</text>`;
  });
  s+=`<rect x="0" y="0" width="${totalW}" height="${H}" rx="12" fill="none" stroke="var(--border)" stroke-width="2"/>`;
  s+=`</svg>`;
  return `<div class="fade-in" style="display:flex;justify-content:center;width:100%">${s}</div>`;
}

// ── Ligne de décomposition ────────────────────────────────────────────────────
function decompRow(chiffre, rang, mot, color, bg) {
  return `<div class="decomp-row fade-in" style="background:${bg}">
    <span class="decomp-chiffre" style="color:${color}">${chiffre}</span>
    <span class="decomp-rang" style="color:${color}">${rang}</span>
    <span class="decomp-sep">→</span>
    <span class="decomp-mot" style="color:${color}">${mot}</span>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
const STEPS = [

// 0 — L'idée
() => `
<div class="step-title pop">💡 L'idée : lire par groupes depuis la droite</div>
<div class="pourquoi fade-in"><span class="pq-lead">🤔 Pourquoi ?</span> Pour mieux se comprendre quand on parle d'un nombre, il faut savoir lire le nombre à partir de son écriture mathématique avec les chiffres.</div>
<p class="step-text fade-in">
  On découpe le nombre en <strong style="color:var(--bleu)">groupes de 3 chiffres</strong>
  en partant de la droite.<br><br>
  Pour chaque groupe, on lit les chiffres et on ajoute
  le <strong>nom du groupe</strong> :
  <strong style="color:var(--orange)">milliards</strong>,
  <strong style="color:var(--violet)">millions</strong>,
  <strong style="color:var(--bleu)">mille</strong>.<br>
  Le groupe des unités ne reçoit pas de nom.
</p>
${buildGroupes([
  {key:'milliards',label:'Milliards',val:'???',lettres:'… milliards'},
  {key:'millions', label:'Millions', val:'???',lettres:'… millions'},
  {key:'milliers', label:'Milliers', val:'???',lettres:'… mille'},
  {key:'unites',   label:'Unités',   val:'???',lettres:'…'},
])}
<div class="info bleu fade-in">
  📌 On ne dit pas le nom des groupes qui valent <strong>000</strong>.
</div>
`,

// 1 — 529
() => `
<div class="step-title pop">✏️ Exemple : <span class="g-unites">529</span></div>
<p class="step-text fade-in">
  Un seul groupe : les unités.<br>
  On lit chiffre par chiffre.
</p>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="decomp fade-in">
  ${decompRow('5','centaine','cinq cent','var(--vert)','var(--vert-clair)')}
  ${decompRow('2','dizaine','vingt','var(--vert)','var(--vert-clair)')}
  ${decompRow('9','unité','neuf','var(--vert)','var(--vert-clair)')}
</div>
<div class="big-lettres fade-in">cinq cent vingt-neuf</div>`:''}
`,

// 2 — 74 008
() => `
<div class="step-title pop">✏️ Exemple : <span class="g-milliers">74</span> <span class="g-unites">008</span></div>
<p class="step-text fade-in">
  Deux groupes : milliers et unités.
</p>
${buildGroupes([
  {key:'milliers',label:'Milliers',val:'74', lettres:'soixante-quatorze mille'},
  {key:'unites',  label:'Unités',  val:'008',lettres:'huit'},
],revealed)}
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="decomp fade-in" style="margin-top:4px">
  ${decompRow('74','milliers','soixante-quatorze mille','var(--bleu)','var(--bleu-clair)')}
  ${decompRow('008','unités','huit','var(--vert)','var(--vert-clair)')}
</div>
<p class="fade-in" style="font-size:0.88rem;color:var(--gris);font-weight:700;text-align:center">
  Le groupe unités vaut 008 → on lit <strong>huit</strong> (pas "zéro zéro huit").
</p>
<div class="big-lettres fade-in">soixante-quatorze mille huit</div>`:''}
`,

// 3 — 3 050 200
() => `
<div class="step-title pop">✏️ Exemple : <span class="g-millions">3</span> <span class="g-milliers">050</span> <span class="g-unites">200</span></div>
<p class="step-text fade-in">
  Trois groupes : millions, milliers, unités.
</p>
${buildGroupes([
  {key:'millions',label:'Millions',val:'3',  lettres:'trois millions'},
  {key:'milliers',label:'Milliers',val:'050',lettres:'cinquante mille'},
  {key:'unites',  label:'Unités',  val:'200',lettres:'deux cents'},
],revealed)}
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="decomp fade-in" style="margin-top:4px">
  ${decompRow('3','millions','trois millions','var(--violet)','var(--violet-clair)')}
  ${decompRow('050','milliers','cinquante mille','var(--bleu)','var(--bleu-clair)')}
  ${decompRow('200','unités','deux cents','var(--vert)','var(--vert-clair)')}
</div>
<div class="big-lettres fade-in">trois millions cinquante mille deux cents</div>`:''}
`,

// 4 — 15 000 400 060
() => `
<div class="step-title pop">✏️ Exemple : <span class="g-milliards">15</span> <span style="color:var(--gris)">000</span> <span class="g-milliers">400</span> <span class="g-unites">060</span></div>
<p class="step-text fade-in">
  Le groupe millions vaut 000 : on ne le dit pas.<br>
  Trois groupes à lire : milliards, milliers, unités.
</p>
${buildGroupes([
  {key:'milliards',label:'Milliards',val:'15', lettres:'quinze milliards'},
  {key:'millions', label:'Millions', val:'000',lettres:'(non lu)', nonlu:true},
  {key:'milliers', label:'Milliers', val:'400',lettres:'quatre cent mille'},
  {key:'unites',   label:'Unités',   val:'060',lettres:'soixante'},
],revealed)}
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="decomp fade-in" style="margin-top:4px">
  ${decompRow('15','milliards','quinze milliards','var(--orange)','var(--orange-clair)')}
  ${decompRow('400','milliers','quatre cent mille','var(--bleu)','var(--bleu-clair)')}
  ${decompRow('060','unités','soixante','var(--vert)','var(--vert-clair)')}
</div>
<div class="big-lettres fade-in">quinze milliards quatre cent mille soixante</div>`:''}
`,

// 5 — Orthographe
() => `
<div class="step-title pop">📝 Les mots à connaître</div>
<div class="ortho-grid fade-in">
  <div class="ortho-bloc">
    <div class="ortho-titre" style="color:var(--vert)">Unités</div>
    <div class="ortho-mots">
      ${['un','deux','trois','quatre','cinq','six','sept','huit','neuf'].map(m=>`<span class="mot-tag" style="background:var(--vert-clair);color:var(--vert)">${m}</span>`).join('')}
    </div>
  </div>
  <div class="ortho-bloc">
    <div class="ortho-titre" style="color:var(--bleu)">De 10 à 19</div>
    <div class="ortho-mots">
      ${['dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'].map(m=>`<span class="mot-tag" style="background:var(--bleu-clair);color:var(--bleu)">${m}</span>`).join('')}
    </div>
  </div>
  <div class="ortho-bloc">
    <div class="ortho-titre" style="color:var(--violet)">Dizaines</div>
    <div class="ortho-mots">
      ${['vingt','trente','quarante','cinquante','soixante','soixante-dix','quatre-vingts','quatre-vingt-dix'].map(m=>`<span class="mot-tag" style="background:var(--violet-clair);color:var(--violet)">${m}</span>`).join('')}
    </div>
  </div>
  <div class="ortho-bloc">
    <div class="ortho-titre" style="color:var(--orange)">Grands groupes</div>
    <div class="ortho-mots">
      ${['cent','mille','million','milliard'].map(m=>`<span class="mot-tag" style="background:var(--orange-clair);color:var(--orange)">${m}</span>`).join('')}
    </div>
  </div>
</div>
`,

// 6 — Récap
() => `
<div class="step-title pop">🏆 Ce qu'il faut retenir</div>
<div class="recap-list">
  ${[
    ['var(--bleu)',   'On découpe le nombre en groupes de 3 chiffres en partant de la droite.'],
    ['var(--vert)',   'On lit chaque groupe : d\'abord les centaines, puis les dizaines, puis les unités du groupe.'],
    ['var(--violet)', 'On ajoute le nom du groupe : <strong>mille</strong>, <strong>millions</strong>, <strong>milliards</strong>. Le groupe des unités ne reçoit pas de nom.'],
    ['var(--orange)', 'On ne dit pas les groupes qui valent 000.'],
  ].map(([c,t],i)=>`
    <div class="recap-item" style="animation-delay:${i*0.09}s;border-left-color:${c}">
      <div class="recap-num" style="background:${c}">${i+1}</div>
      <span>${t}</span>
    </div>`).join('')}
</div>
`,
];

let cur=0, revealed=false; const N=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=STEPS[cur](); card.className='card fade-in';
  document.getElementById('progressBar').style.width=(cur/(N-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator'); ind.innerHTML='';
  for(let i=0;i<N;i++){
    const d=document.createElement('div');
    d.className='step-dot'+(i===cur?' active':i<cur?' done':'');
    d.textContent=i<cur?'✓':i+1; ind.appendChild(d);
  }
  document.getElementById('counter').textContent=`Page ${cur+1} / ${N}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===N-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===N-1?0:cur+1;revealed=false;render();}
function prev(){if(cur>0){cur--;revealed=false;render();}}
function completer(){revealed=true;render();}
render();
</script>
</body>
</html>
