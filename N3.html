<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>N3 Écrire un nombre entier en chiffres</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme:light;
    --bleu:#1a73e8; --bleu-clair:#e8f0fe;
    --orange:#ea580c; --orange-clair:#ffedd5;
    --vert:#16a34a; --vert-clair:#f0fdf4;
    --violet:#7c3aed; --violet-clair:#f5f3ff;
    --gris:#94a3b8; --bg:#f0f4ff;
    --card:#ffffff; --texte:#1e293b; --border:#e2e8f0;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Nunito',sans-serif; background:var(--bg); min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 16px 40px; color:var(--texte); }
  header { display:flex; justify-content:center; margin-bottom:22px; }
  .header-row { display:flex; align-items:center; gap:14px; max-width:680px; width:100%; }
  .badge-code { display:inline-flex; align-items:center; justify-content:center; min-width:48px; height:48px; border-radius:12px; border:2.5px solid var(--bleu); background:var(--bleu-clair); font-family:'Baloo 2',cursive; font-size:1.3rem; font-weight:800; color:var(--bleu); flex-shrink:0; }
  .tache-label { font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:800; color:var(--bleu); line-height:1.3; }
  .progress-bar-wrap { width:100%; max-width:680px; background:#dbeafe; border-radius:99px; height:10px; margin-bottom:18px; overflow:hidden; }
  .progress-bar { height:100%; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:99px; transition:width 0.5s ease; }
  .steps-indicator { display:flex; gap:10px; margin-bottom:20px; }
  .step-dot { width:34px; height:34px; border-radius:50%; background:#dbeafe; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:#93c5fd; transition:all 0.4s; border:2px solid transparent; }
  .step-dot.active { background:var(--bleu); color:white; border-color:var(--bleu); transform:scale(1.15); box-shadow:0 0 0 4px #bfdbfe; }
  .step-dot.done   { background:var(--vert); color:white; border-color:var(--vert); }
  .card { background:var(--card); border-radius:20px; padding:26px 28px; max-width:680px; width:100%; min-height:360px; display:flex; flex-direction:column; align-items:center; gap:16px; box-shadow:0 4px 24px rgba(26,115,232,0.10); position:relative; overflow:hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--bleu),var(--violet)); border-radius:20px 20px 0 0; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.4s ease both; }
  @keyframes pop { 0%{transform:scale(0.8);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
  .pop { animation:pop 0.45s ease both; }
  .step-title { font-family:'Baloo 2',cursive; font-size:1.2rem; font-weight:800; color:var(--bleu); text-align:center; line-height:1.3; max-width:580px; }
  .step-text  { font-size:0.97rem; color:var(--texte); text-align:center; line-height:1.75; max-width:540px; font-weight:600; }
  .info { border-radius:12px; padding:12px 18px; font-size:0.93rem; font-weight:600; max-width:580px; width:100%; line-height:1.6; }
  .info.bleu   { background:var(--bleu-clair);   color:var(--bleu);   border-left:4px solid var(--bleu); }
  .info.orange { background:var(--orange-clair); color:var(--orange); border-left:4px solid var(--orange); }
  .info.violet { background:var(--violet-clair); color:var(--violet); border-left:4px solid var(--violet); }
  .info.vert   { background:var(--vert-clair);   color:var(--vert);   border-left:4px solid var(--vert); }
  .info.gris   { background:#f1f5f9; color:#475569; border-left:4px solid var(--gris); }

  /* Nombre en lettres mis en valeur */
  .nombre-lettres {
    font-family:'Baloo 2',cursive;
    font-size:1.05rem; font-weight:800;
    text-align:center; line-height:1.8;
    max-width:540px;
  }
  .surligné-bleu   { background:var(--bleu-clair);   color:var(--bleu);   border-radius:4px; padding:1px 4px; }
  .surligné-violet { background:var(--violet-clair); color:var(--violet); border-radius:4px; padding:1px 4px; }
  .surligné-orange { background:var(--orange-clair); color:var(--orange); border-radius:4px; padding:1px 4px; }

  .big-number { font-family:'Baloo 2',cursive; font-size:2rem; font-weight:800; color:var(--bleu); letter-spacing:3px; text-align:center; }
  .recap-list { display:flex; flex-direction:column; gap:9px; max-width:580px; width:100%; }
  .recap-item { display:flex; align-items:flex-start; gap:12px; background:#f8faff; border-radius:12px; padding:11px 16px; font-size:0.93rem; font-weight:600; color:var(--texte); animation:fadeIn 0.4s ease both; border-left:4px solid transparent; line-height:1.5; }
  .recap-num  { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.82rem; font-weight:700; flex-shrink:0; color:white; margin-top:1px; }
  .nav { display:flex; gap:14px; margin-top:10px; align-items:center; }
  button { font-family:'Baloo 2',cursive; font-weight:700; font-size:1rem; border:none; cursor:pointer; border-radius:12px; padding:12px 28px; transition:all 0.2s; }
  .btn-next { background:linear-gradient(135deg,var(--bleu),var(--violet)); color:white; box-shadow:0 4px 14px rgba(26,115,232,0.3); }
  .btn-next:hover { transform:translateY(-2px); }
  .btn-next:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
  .btn-prev { background:#e0e7ff; color:var(--bleu); }
  .btn-prev:hover { background:#c7d2fe; }
  .btn-complete { font-family:'Baloo 2',cursive; font-weight:700; font-size:0.95rem; border:2px solid var(--vert); cursor:pointer; border-radius:10px; padding:10px 22px; background:var(--vert-clair); color:var(--vert); transition:all 0.2s; }
  .btn-complete:hover { background:var(--vert); color:white; }
  .pourquoi { position:relative; background:#f0fdfa; border-left:4px solid #0d9488; border-radius:10px; padding:12px 15px; font-size:0.92rem; font-weight:600; color:#134e4a; line-height:1.6; max-width:580px; width:100%; }
  .pq-lead { font-family:'Baloo 2',cursive; font-weight:800; color:#0d9488; }
  .step-counter { font-size:0.85rem; color:var(--gris); font-weight:700; }
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="badge-code">N3</div>
    <div class="tache-label">Écrire un nombre entier en chiffres</div>
  </div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
// ── Tableau CDU (page 347) ───────────────────────────────────────────────────
const CELL_W = 72, HDR_H = 28, CELL_H = 62;

function buildCDU(vals, colors, bgs, reveal) {
  const cols = ['Centaines','Dizaines','Unités'];
  const W = cols.length * CELL_W, H = HDR_H + CELL_H;
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="white" stroke="var(--border)" stroke-width="2"/>`;
  s+=`<line x1="0" y1="${HDR_H}" x2="${W}" y2="${HDR_H}" stroke="var(--border)" stroke-width="1.5"/>`;
  cols.forEach((c,i)=>{
    const x=i*CELL_W;
    if(i>0) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--border)" stroke-width="1.5"/>`;
    s+=`<rect x="${x}" y="0" width="${CELL_W}" height="${HDR_H}" fill="#f0fdf4"/>`;
    s+=`<text x="${x+CELL_W/2}" y="${HDR_H-8}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="10" font-weight="700" fill="var(--vert)" letter-spacing="0.3">${c.toUpperCase()}</text>`;
    if(bgs[i] && reveal) s+=`<rect x="${x+1}" y="${HDR_H+1}" width="${CELL_W-2}" height="${CELL_H-2}" rx="4" fill="${bgs[i]}"/>`;
    if(reveal) s+=`<text x="${x+CELL_W/2}" y="${HDR_H+CELL_H/2+11}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="28" font-weight="800" fill="${colors[i]}">${vals[i]}</text>`;
  });
  s+=`<rect x="0" y="0" width="${W}" height="${H}" rx="12" fill="none" stroke="var(--border)" stroke-width="2"/>`;
  s+=`</svg>`;
  return `<div class="fade-in" style="display:flex;justify-content:center">${s}</div>`;
}

// ── Tableau groupes (pages 3→5) ──────────────────────────────────────────────
// Adapte la largeur selon le nombre de groupes pour tenir dans la carte
const GRP_COLORS = {
  milliards: { hbg:'#fde8d4', hcol:'#d4600a', bg:'var(--orange-clair)', col:'var(--orange)' },
  millions:  { hbg:'var(--violet-clair)', hcol:'var(--violet)', bg:'var(--violet-clair)', col:'var(--violet)' },
  milliers:  { hbg:'var(--bleu-clair)', hcol:'var(--bleu)', bg:'var(--bleu-clair)', col:'var(--bleu)' },
  unites:    { hbg:'var(--vert-clair)', hcol:'var(--vert)', bg:'var(--vert-clair)', col:'var(--vert)' },
};

function buildGroupes(groups, reveal) {
  if(reveal===undefined) reveal=true;
  const N = groups.length;
  // largeur par groupe : max 90px, minimum raisonnable
  const gw = N <= 2 ? 110 : N === 3 ? 90 : 76;
  const totalW = N * gw;
  const H = HDR_H + CELL_H;
  let s = `<svg width="${totalW}" height="${H}" viewBox="0 0 ${totalW} ${H}" style="display:block;width:100%;max-width:${totalW}px;height:auto">`;
  s+=`<rect x="0" y="0" width="${totalW}" height="${H}" rx="12" fill="white" stroke="var(--border)" stroke-width="2"/>`;
  s+=`<line x1="0" y1="${HDR_H}" x2="${totalW}" y2="${HDR_H}" stroke="var(--border)" stroke-width="1.5"/>`;
  groups.forEach((g,gi)=>{
    const x=gi*gw;
    const c=GRP_COLORS[g.key];
    if(gi>0) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--border)" stroke-width="1.5"/>`;
    s+=`<rect x="${x}" y="0" width="${gw}" height="${HDR_H}" fill="${c.hbg}"/>`;
    const fs = g.label.length>8 ? '8.5' : '9.5';
    s+=`<text x="${x+gw/2}" y="${HDR_H-8}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="${fs}" font-weight="700" fill="${c.hcol}" letter-spacing="0.2">${g.label.toUpperCase()}</text>`;
    if(c.bg && reveal) s+=`<rect x="${x+1}" y="${HDR_H+1}" width="${gw-2}" height="${CELL_H-2}" rx="4" fill="${c.bg}"/>`;
    const vfs = g.val && g.val.length>=3 ? '22' : '26';
    if(reveal) s+=`<text x="${x+gw/2}" y="${HDR_H+CELL_H/2+10}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${vfs}" font-weight="800" fill="${c.col}">${g.val||''}</text>`;
  });
  s+=`<rect x="0" y="0" width="${totalW}" height="${H}" rx="12" fill="none" stroke="var(--border)" stroke-width="2"/>`;
  s+=`</svg>`;
  return `<div class="fade-in" style="display:flex;justify-content:center;width:100%">${s}</div>`;
}

// ── Steps ────────────────────────────────────────────────────────────────────
const STEPS = [

// 0 — L'idée
() => `
<div class="step-title pop">💡 L'idée : des groupes de 3 chiffres</div>
<div class="pourquoi fade-in"><span class="pq-lead">🤔 Pourquoi ?</span> Pour pouvoir mieux comprendre le nombre qu'on lit ou qu'on entend, il faut savoir l'écrire avec l'écriture mathématique qui utilise des chiffres.</div>
<p class="step-text fade-in">
  Pour écrire un grand nombre, on repère d'abord les <strong style="color:var(--bleu)">groupes</strong>
  grâce aux mots <strong style="color:var(--orange)">milliards</strong>,
  <strong style="color:var(--violet)">millions</strong>,
  <strong style="color:var(--bleu)">mille</strong>.<br><br>
  Chaque groupe contient <strong>exactement 3 chiffres</strong>,
  sauf le premier groupe à gauche qui peut en avoir 1, 2 ou 3.<br><br>
  On sépare les groupes par un <strong style="color:var(--vert)">espace</strong>.
</p>
${buildGroupes([
  {key:'milliards', label:'Milliards', val:'???'},
  {key:'millions',  label:'Millions',  val:'???'},
  {key:'milliers',  label:'Milliers',  val:'???'},
  {key:'unites',    label:'Unités',    val:'???'},
])}
<div class="info bleu fade-in">
  📌 Si un groupe vaut zéro, on écrit quand même <strong>000</strong>
  — sauf si c'est le groupe le plus à gauche.
</div>
`,

// 1 — 347
() => `
<div class="step-title pop">✏️ Exemple : trois cent quarante-sept</div>
<p class="step-text fade-in">
  Trois <strong style="color:var(--vert)">cents</strong> → ${revealed?'3 centaines':''}<br>
  Quarante → ${revealed?'4 dizaines':''}<br>
  Sept → ${revealed?'7 unités':''}
</p>
${buildCDU(['3','4','7'],['var(--vert)','var(--vert)','var(--vert)'],['var(--vert-clair)','var(--vert-clair)','var(--vert-clair)'],revealed)}
<div class="big-number fade-in">${revealed?'347':'?'}</div>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="info gris fade-in">
  Pas de <em>mille</em>, pas de <em>million</em> → un seul groupe.
</div>`:''}
`,

// 2 — 105 680
() => `
<div class="step-title pop">✏️ Exemple : cent cinq <span class="surligné-bleu">mille</span> six cent quatre-vingts</div>
<p class="step-text fade-in">
  Cent cinq <strong style="color:var(--bleu)">mille</strong> → ${revealed?'<strong style="color:var(--bleu)">105</strong> milliers':''}<br>
  Six cent quatre-vingts → ${revealed?'<strong style="color:var(--vert)">680</strong> unités':''}
</p>
${buildGroupes([
  {key:'milliers', label:'Milliers', val:'105'},
  {key:'unites',   label:'Unités',   val:'680'},
],revealed)}
<div class="big-number fade-in">${revealed?'105 680':'?'}</div>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="info bleu fade-in">
  Le mot <strong>mille</strong> annonce le groupe des milliers.
  Ce qui est avant = les milliers, ce qui est après = les unités.
</div>`:''}
`,

// 3 — 24 400 110
() => `
<div class="step-title pop">✏️ Exemple : vingt-quatre <span class="surligné-violet">millions</span> quatre cent <span class="surligné-bleu">mille</span> cent dix</div>
<p class="step-text fade-in">
  Vingt-quatre <strong style="color:var(--violet)">millions</strong> → ${revealed?'<strong style="color:var(--violet)">24</strong> millions':''}<br>
  Quatre cent <strong style="color:var(--bleu)">mille</strong> → ${revealed?'<strong style="color:var(--bleu)">400</strong> milliers':''}<br>
  Cent dix → ${revealed?'<strong style="color:var(--vert)">110</strong> unités':''}
</p>
${buildGroupes([
  {key:'millions', label:'Millions', val:'24'},
  {key:'milliers', label:'Milliers', val:'400'},
  {key:'unites',   label:'Unités',   val:'110'},
],revealed)}
<div class="big-number fade-in">${revealed?'24 400 110':'?'}</div>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="info violet fade-in">
  Le groupe millions vaut vingt-quatre → on écrit <strong>24</strong>
  (premier groupe à gauche : pas de zéro devant).
</div>`:''}
`,

// 4 — 30 006 130 050
() => `
<div class="step-title pop">✏️ Exemple : trente <span class="surligné-orange">milliards</span> six <span class="surligné-violet">millions</span> cent trente <span class="surligné-bleu">mille</span> cinquante</div>
<p class="step-text fade-in">
  Trente <strong style="color:var(--orange)">milliards</strong> → ${revealed?'<strong style="color:var(--orange)">30</strong> milliards':''}<br>
  Six <strong style="color:var(--violet)">millions</strong> → ${revealed?'<strong style="color:var(--violet)">006</strong> millions':''}<br>
  Cent trente <strong style="color:var(--bleu)">mille</strong> → ${revealed?'<strong style="color:var(--bleu)">130</strong> milliers':''}<br>
  Cinquante → ${revealed?'<strong style="color:var(--vert)">050</strong> unités':''}
</p>
${buildGroupes([
  {key:'milliards', label:'Milliards', val:'30'},
  {key:'millions',  label:'Millions',  val:'006'},
  {key:'milliers',  label:'Milliers',  val:'130'},
  {key:'unites',    label:'Unités',    val:'050'},
],revealed)}
<div class="big-number fade-in">${revealed?'30 006 130 050':'?'}</div>
${revealed?'':'<button class="btn-complete" onclick="completer()">✏️ Compléter</button>'}
${revealed?`<div class="info orange fade-in">
  <strong>30</strong> milliards : premier groupe à gauche → on écrit 30, pas 030.<br>
  <strong>006</strong> : six millions, pas le premier groupe → on complète avec des 0 devant.<br>
  <strong>050</strong> : cinquante unités → même principe.
</div>`:''}
`,

// 5 — Récap
() => `
<div class="step-title pop">🏆 Ce qu'il faut retenir</div>
<div class="recap-list">
  ${[
    ['var(--bleu)',   'On repère les groupes grâce aux mots <strong>milliards</strong>, <strong>millions</strong>, <strong>mille</strong>. Chaque mot annonce un groupe de 3 chiffres.'],
    ['var(--vert)',   'On écrit les chiffres de chaque groupe, séparés par un <strong>espace</strong>.'],
    ['var(--orange)', 'Chaque groupe (sauf le premier à gauche) s\'écrit toujours avec <strong>3 chiffres</strong>. Si le groupe vaut 6, on écrit <strong>006</strong>.'],
    ['var(--violet)', 'Le premier groupe à gauche s\'écrit normalement, sans zéros devant : vingt-quatre millions → <strong>24</strong>, pas 024.'],
  ].map(([c,t],i)=>`
    <div class="recap-item" style="animation-delay:${i*0.09}s;border-left-color:${c}">
      <div class="recap-num" style="background:${c}">${i+1}</div>
      <span>${t}</span>
    </div>`).join('')}
</div>
`,
];

let cur=0, revealed=false; const N=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=STEPS[cur](); card.className='card fade-in';
  document.getElementById('progressBar').style.width=(cur/(N-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator'); ind.innerHTML='';
  for(let i=0;i<N;i++){
    const d=document.createElement('div');
    d.className='step-dot'+(i===cur?' active':i<cur?' done':'');
    d.textContent=i<cur?'✓':i+1; ind.appendChild(d);
  }
  document.getElementById('counter').textContent=`Page ${cur+1} / ${N}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===N-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===N-1?0:cur+1;revealed=false;render();}
function prev(){if(cur>0){cur--;revealed=false;render();}}
function completer(){revealed=true;render();}
render();
</script>
</body>
</html>
