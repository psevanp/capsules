<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>N25 — Additionner ou soustraire des fractions décimales</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--bleu:#1a73e8;--bleu-clair:#e8f0fe;--violet:#7c3aed;--violet-clair:#f5f3ff;--vert:#16a34a;--vert-clair:#dcfce7;--orange:#ea580c;--orange-clair:#ffedd5;--gris:#94a3b8;--bg:#f0f4ff;--card:#fff;--texte:#1e293b;--border:#e2e8f0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;color:var(--texte);}
  header{display:flex;justify-content:center;margin-bottom:22px;}
  .header-row{display:flex;align-items:center;gap:14px;max-width:680px;width:100%;}
  .badge-code{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;border-radius:12px;border:2.5px solid var(--bleu);background:var(--bleu-clair);font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800;color:var(--bleu);flex-shrink:0;}
  .tache-label{font-family:'Baloo 2',cursive;font-size:1.02rem;font-weight:800;color:var(--bleu);line-height:1.3;}
  .progress-bar-wrap{width:100%;max-width:680px;background:#dbeafe;border-radius:99px;height:10px;margin-bottom:18px;overflow:hidden;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--bleu),var(--violet));border-radius:99px;transition:width .5s ease;}
  .steps-indicator{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
  .step-dot{width:32px;height:32px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:#93c5fd;transition:all .4s;border:2px solid transparent;}
  .step-dot.active{background:var(--bleu);color:#fff;border-color:var(--bleu);transform:scale(1.15);box-shadow:0 0 0 4px #bfdbfe;}
  .step-dot.done{background:var(--vert);color:#fff;border-color:var(--vert);}
  .card{background:var(--card);border-radius:20px;padding:26px 24px;max-width:680px;width:100%;min-height:340px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 4px 24px rgba(26,115,232,.10);position:relative;overflow-x:auto;}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--bleu),var(--violet));border-radius:20px 20px 0 0;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeIn .4s ease both;}
  @keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .45s ease both;}
  .step-title{font-family:'Baloo 2',cursive;font-size:1.12rem;font-weight:800;color:var(--bleu);text-align:center;line-height:1.3;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;}
  .info{border-radius:12px;padding:12px 16px;font-weight:600;max-width:580px;width:100%;line-height:1.7;font-size:.9rem;}
  .info.bleu{background:var(--bleu-clair);color:var(--bleu);border-left:4px solid var(--bleu);}
  .info.violet{background:var(--violet-clair);color:var(--violet);border-left:4px solid var(--violet);}
  .btn-complete{font-family:'Baloo 2',cursive;font-weight:700;font-size:.95rem;border:2px solid var(--vert);cursor:pointer;border-radius:10px;padding:10px 22px;background:var(--vert-clair);color:var(--vert);transition:all .2s;}
  .btn-complete:hover{background:var(--vert);color:#fff;}
  .recap-list{display:flex;flex-direction:column;gap:9px;max-width:580px;width:100%;}
  .recap-item{display:flex;align-items:flex-start;gap:12px;background:#f8faff;border-radius:12px;padding:11px 16px;font-size:.92rem;font-weight:600;color:var(--texte);animation:fadeIn .4s ease both;border-left:4px solid transparent;line-height:1.5;}
  .recap-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;flex-shrink:0;color:#fff;margin-top:1px;}
  .calc-box{background:#f1f5f9;border:2px solid #cbd5e1;border-radius:14px;padding:13px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;font-family:'Baloo 2',cursive;font-size:1.1rem;font-weight:800;width:100%;max-width:540px;transition:background .3s,border-color .3s;}
  .calc-box .op{color:var(--texte);}
  .calc-box.bleu{background:var(--bleu-clair);border-color:var(--bleu);}
  .calc-box.violet{background:var(--violet-clair);border-color:var(--violet);}
  .nav{display:flex;gap:14px;margin-top:10px;align-items:center;}
  button.btn-nav{font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;border:none;cursor:pointer;border-radius:12px;padding:12px 28px;transition:all .2s;}
  .btn-next{background:linear-gradient(135deg,var(--bleu),var(--violet));color:#fff;box-shadow:0 4px 14px rgba(26,115,232,.3);}
  .btn-next:hover{transform:translateY(-2px);}
  .btn-prev{background:#e0e7ff;color:var(--bleu);}
  .btn-prev:hover{background:#c7d2fe;}
  .step-counter{font-size:.85rem;color:var(--gris);font-weight:700;}
  .pourquoi { position:relative; background:#f0fdfa; border-left:4px solid #0d9488; border-radius:10px; padding:12px 15px; font-size:0.92rem; font-weight:600; color:#134e4a; line-height:1.6; max-width:580px; width:100%; }
  .pq-lead { font-family:'Baloo 2',cursive; font-weight:800; color:#0d9488; }
</style>
</head>
<body>
<header><div class="header-row">
  <div class="badge-code">N25</div>
  <div class="tache-label">Additionner ou soustraire des fractions décimales</div>
</div></header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-nav btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-nav btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
const EXOS={};

// ── fracSVG ───────────────────────────────────────────────────────────────────
function fracSVG(n,d,col,fs1,fs2){
  col=col||'var(--texte)';fs1=fs1||22;fs2=fs2||22;
  const W=Math.max(String(n).length,String(d).length)*fs1*.62+8;
  const yN=fs1,yT=yN+Math.round(fs1*.28),yD=yT+3+Math.round(fs2*.93),H=yD+4;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:inline-block;vertical-align:middle;overflow:visible">
    <text x="${W/2}" y="${yN}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs1}" font-weight="800" fill="${col}">${n}</text>
    <rect x="0" y="${yT}" width="${W}" height="3" rx="1" fill="${col}"/>
    <text x="${W/2}" y="${yD}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs2}" font-weight="800" fill="${col}">${d}</text>
  </svg>`;
}

// ── fracLab (étiquette sur SVG) ───────────────────────────────────────────────
function fracLab(cx,y,n,d,col,fs,hl){
  fs=fs||10;
  const nS=String(n),dS=String(d);
  const fw=Math.max(nS.length,dS.length)*fs*.65+6;
  const yN=fs,yT=yN+2,yD=yT+2+fs,lH=yD+3;
  const bg=col==='#1a73e8'?'#dbeafe':'#ede9fe';
  let r='';
  if(hl) r+=`<rect x="${cx-fw/2-4}" y="${y-1}" width="${fw+8}" height="${lH+2}" rx="5" fill="${bg}" stroke="${col}" stroke-width="1.8"/>`;
  r+=`<text x="${cx}" y="${y+yN}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${nS}</text>`;
  r+=`<rect x="${cx-fw/2+1}" y="${y+yT}" width="${fw-2}" height="2" fill="${col}"/>`;
  r+=`<text x="${cx}" y="${y+yD}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="${fs}" font-weight="800" fill="${col}">${dS}</text>`;
  return r;
}

// ── Double flèche ─────────────────────────────────────────────────────────────
function dblArrow(x1,x2,y,col,label,lY){
  const ah=4, mid=(x1+x2)/2;
  let s='';
  if(x2-x1>ah*3) s+=`<line x1="${x1+ah*1.5}" y1="${y}" x2="${x2-ah*1.5}" y2="${y}" stroke="${col}" stroke-width="1.5"/>`;
  s+=`<polygon points="${x1},${y} ${x1+ah*1.5},${y-ah} ${x1+ah*1.5},${y+ah}" fill="${col}"/>`;
  s+=`<polygon points="${x2},${y} ${x2-ah*1.5},${y-ah} ${x2-ah*1.5},${y+ah}" fill="${col}"/>`;
  if(label) s+=`<text x="${mid}" y="${lY}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="10" font-weight="700" fill="${col}">${label}</text>`;
  return s;
}

// ── Pages 2–3 : addition même dénominateur ───────────────────────────────────
function drawAddSameDen(n1,n2,den,maxUnit,completed){
  const PADL=24,PADR=20,avail=360,UW=avail/maxUnit;
  const barH=18,barY=36,barBot=barY+barH;        // 36,54
  const lineY=barBot+5,lineEnd=PADL+avail+UW*0.12; // 59
  const unitNumY=lineY+22,H=unitNumY+18;           // 81,99
  const W=lineEnd+PADR;
  const isDix=den<=10,segs=den*maxUnit,segW=avail/segs,result=n1+n2;
  const stroke=isDix?'#1a73e8':'#7c3aed';
  const prvSegs=!completed&&maxUnit>1?den:segs; // preview: 1 unité seulement
  const outW=!completed&&maxUnit>1?(avail/maxUnit):avail;

  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;

  // Barre unique (3 états : A = premier, B = deuxième, C = vide)
  for(let p=0;p<prvSegs;p++){
    const x=PADL+p*segW, odd=p%2===1;
    let fill;
    if(!completed){
      if(isDix) fill=odd?'#a8c8f0':'#c0d8f6';
      else{const g=Math.floor(p/10)%2===1;fill=g?(odd?'#a898e0':'#c0b0ea'):(odd?'#dcd4f2':'#e8e2f8');}
    } else if(p<n1){
      // État A : addende 1 (plus foncé)
      if(isDix) fill=odd?'#2563c8':'#4a84e0';
      else{const g=Math.floor(p/10)%2===1;fill=g?(odd?'#5a44b8':'#7c64d8'):(odd?'#7060c8':'#9080d8');}
    } else if(p<result){
      // État B : addende 2 (intermédiaire)
      if(isDix) fill=odd?'#7aaae0':'#98bef0';
      else{const g=Math.floor(p/10)%2===1;fill=g?(odd?'#9880d8':'#b0a0e8'):(odd?'#b0a8f0':'#c8c0f8');}
    } else {
      // État C : vide
      if(isDix) fill=odd?'#d8e8f8':'#e8f2fc';
      else{const g=Math.floor(p/10)%2===1;fill=g?(odd?'#d0cce8':'#e0dcf4'):(odd?'#e8e4f8':'#f4f0ff');}
    }
    s+=`<rect x="${x}" y="${barY}" width="${segW}" height="${barH}" fill="${fill}"/>`;
  }
  s+=`<rect x="${PADL}" y="${barY}" width="${outW}" height="${barH}" fill="none" stroke="${stroke}" stroke-width="1.5" rx="1"/>`;

  // Ligne
  s+=`<line x1="${PADL}" y1="${lineY}" x2="${lineEnd}" y2="${lineY}" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>`;

  // Graduations
  const uMax=!completed&&maxUnit>1?1:maxUnit;
  for(let u=0;u<=uMax;u++){
    const x=PADL+u*UW;
    s+=`<line x1="${x}" y1="${barY-2}" x2="${x}" y2="${lineY+5}" stroke="#1e293b" stroke-width="2"/>`;
    s+=`<text x="${x}" y="${unitNumY}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="#1e293b" stroke="white" stroke-width="3" paint-order="stroke">${u}</text>`;
  }

  if(completed){
    const xA=PADL+(n1/den)*UW, xR=PADL+(result/den)*UW;
    const lbl=isDix?'dixièmes':'centièmes';
    // Marqueurs
    s+=`<line x1="${xA}" y1="${barY-2}" x2="${xA}" y2="${lineY+4}" stroke="${stroke}" stroke-width="1.8"/>`;
    s+=`<line x1="${xR}" y1="${barY-2}" x2="${xR}" y2="${lineY+4}" stroke="${stroke}" stroke-width="2.5"/>`;
    // Flèches doubles au-dessus
    s+=dblArrow(PADL,xA,22,stroke,`${n1} ${lbl}`,10);
    s+=dblArrow(xA,xR,22,stroke,`${n2} ${lbl}`,10);
    // Étiquette résultat (en haut)
    s+=fracLab(xR,2,result,den,stroke,10,true);
  }

  s+=`</svg>`;
  return s;
}

// ── Page 4 : 3/10 + 5/100 = 35/100 ─────────────────────────────────────────
function drawAddMixed(completed){
  const PADL=24,PADR=20,avail=360,UW=avail;       // maxUnit=1
  const barH=18;
  const topBarY=36,topBarBot=topBarY+barH;          // dixièmes, DESSUS la ligne : 36,54
  const lineY=topBarBot+5;                           // 59
  const botBarY=lineY+5,botBarBot=botBarY+barH;      // centièmes, DESSOUS la ligne : 64,82
  const lineEnd=PADL+avail+avail*0.08;
  const unitNumY=botBarBot+14;                        // 96
  const botLabY=botBarBot+34;                         // 116 — étiquette 35/100
  const H=botLabY+46;                                  // 162
  const W=lineEnd+PADR;

  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;

  // Barre dixièmes (DESSUS, bleu)
  const dW=avail/10;
  for(let p=0;p<10;p++){
    const x=PADL+p*dW, odd=p%2===1;
    let fill;
    if(!completed) fill=odd?'#a8c8f0':'#c0d8f6';
    else if(p<3)   fill=odd?'#2563c8':'#4a84e0';
    else           fill=odd?'#d8e8f8':'#e8f2fc';
    s+=`<rect x="${x}" y="${topBarY}" width="${dW}" height="${barH}" fill="${fill}"/>`;
  }
  s+=`<rect x="${PADL}" y="${topBarY}" width="${avail}" height="${barH}" fill="none" stroke="#1a73e8" stroke-width="1.5" rx="1"/>`;

  // Barre centièmes (DESSOUS, violet — N22 palette 4 tons)
  const cW=avail/100;
  const CF=['#e0d8ff','#cec2fa','#a898e8','#7c64d8'];
  const CE=['#f0ecfc','#e8e2f8','#d8d0f0','#c8bce8'];
  const CP=['#e8e2f8','#dcd4f2','#c0b0ea','#a898e0'];
  for(let p=0;p<100;p++){
    const x=PADL+p*cW, g=Math.floor(p/10)%2===1, odd=p%2===1;
    let fill;
    if(!completed)      fill=g?(odd?CP[3]:CP[2]):(odd?CP[1]:CP[0]);
    else if(p<30)       fill=g?(odd?CF[3]:CF[2]):(odd?CF[1]:CF[0]);
    else if(p<35)       fill=g?(odd?'#5a44b8':'#7b5ea7'):(odd?'#6b4fc8':'#9068d8');
    else                fill=g?(odd?CE[3]:CE[2]):(odd?CE[1]:CE[0]);
    s+=`<rect x="${x}" y="${botBarY}" width="${cW}" height="${barH}" fill="${fill}"/>`;
  }
  s+=`<rect x="${PADL}" y="${botBarY}" width="${avail}" height="${barH}" fill="none" stroke="#7c3aed" stroke-width="1.5" rx="1"/>`;

  // Ligne numérique
  s+=`<line x1="${PADL}" y1="${lineY}" x2="${lineEnd}" y2="${lineY}" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>`;
  // Graduations (traversent les deux barres)
  for(let u=0;u<=1;u++){
    const x=PADL+u*UW;
    s+=`<line x1="${x}" y1="${topBarY-2}" x2="${x}" y2="${botBarBot+2}" stroke="#1e293b" stroke-width="2"/>`;
    s+=`<text x="${x}" y="${unitNumY}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="#1e293b" stroke="white" stroke-width="3" paint-order="stroke">${u}</text>`;
  }

  if(completed){
    const x30=PADL+30/100*UW;  // 132 = 3/10 = 30/100
    const x35=PADL+35/100*UW;  // 150
    const arrowMidY=botBarBot+8;  // 90 — juste sous les centièmes

    // Marqueurs verticaux
    s+=`<line x1="${x30}" y1="${topBarY-2}" x2="${x30}" y2="${botBarBot+2}" stroke="#1a73e8" stroke-width="2"/>`;
    s+=`<line x1="${x35}" y1="${lineY}" x2="${x35}" y2="${botBarBot+2}" stroke="#7c3aed" stroke-width="2.5"/>`;
    s+=`<line x1="${x35}" y1="${botBarBot+2}" x2="${x35}" y2="${botLabY}" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="2,2"/>`;

    // Étiquette 35/100 EN BAS
    s+=fracLab(x35,botLabY,35,100,'#7c3aed',9,true);

    // Zone HAUT : "3 dixièmes" (bleu) et "5 centièmes" (violet) au même niveau
    s+=dblArrow(PADL,x30,26,'#1a73e8','3 dixièmes',14);
    s+=dblArrow(x30,x35,26,'#7c3aed','5 centièmes',14);

    // Juste sous la barre centièmes : "30 centièmes"
    s+=dblArrow(PADL,x30,arrowMidY,'#7c3aed','30 centièmes',arrowMidY+12);
  }

  s+=`</svg>`;
  return s;
}

// ── Page 5 : 156/100 − 2/10 = 136/100 ───────────────────────────────────────
function drawSubMixed(completed){
  const PADL=24,PADR=20,avail=360,maxUnit=2,UW=avail/maxUnit;
  const barH=18;
  const topBarY=36,topBarBot=topBarY+barH;          // centièmes, DESSUS : 36,54
  const lineY=topBarBot+5;                           // 59
  const botBarY=lineY+5,botBarBot=botBarY+barH;      // dixièmes, DESSOUS : 64,82
  const lineEnd=PADL+avail+UW*0.1;
  const unitNumY=botBarBot+14;                        // 96
  const arrowBotY=botBarBot+8;                        // 90 — juste sous les dixièmes
  const arrowBotLabY=arrowBotY+12;                    // 102
  const H=arrowBotLabY+18;                            // 120
  const W=lineEnd+PADR;

  const prvTop=completed?200:100, prvBot=completed?20:10;
  const uMax=completed?2:1;
  const topW=avail/(maxUnit*100), botW=avail/(maxUnit*10);

  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;width:100%;max-width:${W}px;height:auto;overflow:visible">`;

  // Barre centièmes (DESSUS, violet)
  const CF=['#e0d8ff','#cec2fa','#a898e8','#7c64d8'];
  const CE=['#f0ecfc','#e8e2f8','#d8d0f0','#c8bce8'];
  const CP=['#e8e2f8','#dcd4f2','#c0b0ea','#a898e0'];
  for(let p=0;p<prvTop;p++){
    const x=PADL+p*topW, g=Math.floor(p/10)%2===1, odd=p%2===1;
    let fill;
    if(!completed)      fill=g?(odd?CP[3]:CP[2]):(odd?CP[1]:CP[0]);
    else if(p<136)      fill=g?(odd?CF[3]:CF[2]):(odd?CF[1]:CF[0]);
    else if(p<156)      fill=g?(odd?'#9333ea':'#a855f7'):(odd?'#a855f7':'#c084fc');
    else                fill=g?(odd?CE[3]:CE[2]):(odd?CE[1]:CE[0]);
    s+=`<rect x="${x}" y="${topBarY}" width="${topW}" height="${barH}" fill="${fill}"/>`;
  }
  const topOutW=completed?avail:avail/2;
  s+=`<rect x="${PADL}" y="${topBarY}" width="${topOutW}" height="${barH}" fill="none" stroke="#7c3aed" stroke-width="1.5" rx="1"/>`;

  // Barre dixièmes (DESSOUS, bleu clair uniforme)
  for(let p=0;p<prvBot;p++){
    const x=PADL+p*botW, odd=p%2===1;
    const fill=odd?'#b8d4f4':'#cce0f8'; // teinte claire uniforme
    s+=`<rect x="${x}" y="${botBarY}" width="${botW}" height="${barH}" fill="${fill}"/>`;
  }
  // Overlay : découpe en centièmes entre 136/100 et 156/100 (teintes bleues légèrement plus foncées)
  if(completed){
    const centW=avail/(maxUnit*100); // = 1.8px/centième
    for(let c=136;c<156;c++){
      const x=PADL+c*centW, odd=c%2===1;
      s+=`<rect x="${x}" y="${botBarY}" width="${centW}" height="${barH}" fill="${odd?'#6a9ee8':'#8ab8f0'}"/>`;
    }
  }
  const botOutW=completed?avail:avail/2;
  s+=`<rect x="${PADL}" y="${botBarY}" width="${botOutW}" height="${barH}" fill="none" stroke="#1a73e8" stroke-width="1.5" rx="1"/>`;

  // Ligne numérique
  s+=`<line x1="${PADL}" y1="${lineY}" x2="${lineEnd}" y2="${lineY}" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>`;
  // Graduations (traversent les deux barres)
  for(let u=0;u<=uMax;u++){
    const x=PADL+u*UW;
    s+=`<line x1="${x}" y1="${topBarY-2}" x2="${x}" y2="${botBarBot+2}" stroke="#1e293b" stroke-width="2"/>`;
    s+=`<text x="${x}" y="${unitNumY}" text-anchor="middle" font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="#1e293b" stroke="white" stroke-width="3" paint-order="stroke">${u}</text>`;
  }

  if(completed){
    const x136=PADL+(136/100)*UW; // 268.8
    const x156=PADL+(156/100)*UW; // 304.8

    // Marqueurs verticaux dans la zone centièmes
    s+=`<line x1="${x136}" y1="${topBarY-2}" x2="${x136}" y2="${topBarBot+2}" stroke="#7c3aed" stroke-width="2.5"/>`;
    s+=`<line x1="${x156}" y1="${topBarY-2}" x2="${x156}" y2="${topBarBot+2}" stroke="#7c3aed" stroke-width="1.8"/>`;

    // Étiquettes dans la zone au-dessus de la barre centièmes (topBarY=36 → 36px)
    s+=fracLab(x136,2,136,100,'#7c3aed',10,true);
    s+=fracLab(x156,2,156,100,'#7c3aed',9,false);

    // Double flèche "2 dixièmes" sous la barre dixièmes
    s+=dblArrow(x136,x156,arrowBotY,'#1a73e8','2 dixièmes',arrowBotLabY);
  }

  s+=`</svg>`;
  return s;
}

// ── exoBlock / completer ──────────────────────────────────────────────────────
function exoBlock(uid,cfg){
  EXOS[uid]=cfg;
  const visHtml=cfg.vis?cfg.vis(false):'';
  return `
<div id="wrap-${uid}" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px">
  ${visHtml?`<div id="vis-${uid}" class="fade-in" style="width:100%">${visHtml}</div>`:''}
  <div id="calc-${uid}" class="calc-box fade-in">${cfg.calcBefore}</div>
  <button class="btn-complete" onclick="completer('${uid}')">✏️ Compléter</button>
  <div id="res-${uid}" style="display:none;flex-direction:column;align-items:center;gap:10px;width:100%" class="fade-in">
    ${cfg.resText?`<div style="font-family:'Nunito',sans-serif;font-size:.88rem;font-weight:600;color:var(--gris);text-align:center">${cfg.resText}</div>`:''}
    ${cfg.explication?`<div class="info ${cfg.infoCol||'bleu'}" style="font-size:.88rem">${cfg.explication}</div>`:''}
  </div>
</div>`;
}

function completer(uid){
  const c=EXOS[uid];
  if(c.vis) document.getElementById('vis-'+uid).innerHTML=c.vis(true);
  const calcEl=document.getElementById('calc-'+uid);
  calcEl.innerHTML=c.calcAfter;
  calcEl.className='calc-box '+(c.infoCol||'bleu')+' fade-in';
  document.getElementById('wrap-'+uid).querySelector('.btn-complete').style.display='none';
  document.getElementById('res-'+uid).style.display='flex';
}

let cur=0;const N=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=STEPS[cur]();card.className='card fade-in';
  document.getElementById('progressBar').style.width=(cur/(N-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator');ind.innerHTML='';
  for(let i=0;i<N;i++){const d=document.createElement('div');d.className='step-dot'+(i===cur?' active':i<cur?' done':'');d.textContent=i<cur?'✓':i+1;ind.appendChild(d);}
  document.getElementById('counter').textContent=`Page ${cur+1} / ${N}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===N-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===N-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
