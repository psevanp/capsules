<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>GM14 — Comparer des angles</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --primary:#e11d48;--primary2:#fb7185;--primary-clair:#ffe4e6;
  --bg:#fff1f2;--bleu:#1a73e8;--bleu-clair:#e8f0fe;
  --orange:#ea580c;--orange-clair:#ffedd5;
  --vert:#16a34a;--vert-clair:#f0fdf4;
  --violet:#7c3aed;--violet-clair:#f5f3ff;
  --teal:#0d9488;--teal-clair:#f0fdfa;
  --card:#fff;--texte:#1e293b;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;color:var(--texte);}
header{display:flex;justify-content:center;margin-bottom:22px;}
.header-row{display:flex;align-items:center;gap:14px;max-width:680px;width:100%;}
.badge-code{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;border-radius:12px;border:2.5px solid var(--primary);background:var(--primary-clair);font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800;color:var(--primary);flex-shrink:0;}
.tache-label{font-family:'Baloo 2',cursive;font-size:1.05rem;font-weight:800;color:var(--primary);line-height:1.3;}
.progress-bar-wrap{width:100%;max-width:680px;background:var(--primary-clair);border-radius:99px;height:10px;margin-bottom:18px;overflow:hidden;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px;transition:width .5s ease;}
.steps-indicator{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
.step-dot{width:34px;height:34px;border-radius:50%;background:var(--primary-clair);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:var(--primary2);transition:all .4s;border:2px solid transparent;}
.step-dot.active{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.15);box-shadow:0 0 0 4px var(--primary-clair);}
.step-dot.done{background:var(--vert);color:#fff;border-color:var(--vert);}
.card{background:var(--card);border-radius:20px;padding:26px 24px;max-width:680px;width:100%;min-height:360px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 4px 24px rgba(0,0,0,.07);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px 20px 0 0;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease both;}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease both;}
.step-title{font-family:'Baloo 2',cursive;font-size:1.15rem;font-weight:800;color:var(--primary);text-align:center;line-height:1.3;}
.step-text{font-size:.97rem;line-height:1.7;max-width:580px;color:#475569;}
.pourquoi{background:var(--teal-clair);border-left:4px solid var(--teal);border-radius:10px;padding:12px 15px;font-size:.92rem;font-weight:600;color:#134e4a;line-height:1.6;max-width:580px;width:100%;}
.pq-lead{font-family:'Baloo 2',cursive;font-weight:800;color:var(--teal);}
.bloc{border-radius:12px;padding:12px 16px;width:100%;max-width:580px;line-height:1.68;font-size:.92rem;font-weight:600;}
.bloc-header{font-family:'Baloo 2',cursive;font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;}
.def{background:#ede9fe;border-left:5px solid var(--violet);color:#2e1065;}
.def .bloc-header{color:var(--violet);}
.prop{background:var(--bleu-clair);border-left:5px solid var(--bleu);color:#1e3a5f;}
.prop .bloc-header{color:var(--bleu);}
.rem{background:#f1f5f9;border-left:5px solid #94a3b8;color:#475569;}
.rem .bloc-header{color:#64748b;}
.btn-anim{border:2px solid var(--bleu);background:var(--bleu-clair);color:var(--bleu);font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;border-radius:10px;padding:9px 20px;cursor:pointer;transition:all .2s;}
.btn-anim:hover{background:var(--bleu);color:#fff;}
.recap-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:580px;}
.recap-item{display:flex;gap:12px;align-items:flex-start;background:#f8faff;border-radius:12px;padding:11px 16px;}
.recap-num{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:800;font-size:.9rem;color:#fff;flex-shrink:0;}
.nav{display:flex;align-items:center;justify-content:space-between;max-width:680px;width:100%;margin-top:20px;gap:12px;}
.btn-nav{font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;border:none;border-radius:12px;padding:11px 22px;cursor:pointer;transition:all .25s;}
.btn-prev{background:var(--primary-clair);color:var(--primary);}
.btn-prev:hover{background:var(--primary);color:#fff;}
.btn-prev:disabled{opacity:.35;cursor:default;}
.btn-next{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;}
.btn-next:hover{opacity:.9;}
.step-counter{font-family:'Baloo 2',cursive;font-weight:700;color:var(--primary);font-size:.95rem;white-space:nowrap;}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="badge-code">GM14</div>
    <div class="tache-label">Comparer des angles sans utiliser leur mesure</div>
  </div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-nav btn-prev" id="btnPrev" onclick="prev()">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-nav btn-next" id="btnNext" onclick="next()">Suivant →</button>
</div>

<script>
// ── helpers SVG angles ───────────────────────────────────────────────────────
function degToRad(d){return d*Math.PI/180;}
// Dessine un angle : sommet (sx,sy), côté fixe vers la droite, côté à `deg`°
// r = rayon de l'arc, len1/len2 = longueurs des côtés
function svgAngle(sx,sy,deg,r,len1,len2,col,label,arcStroke){
  const rad=degToRad(deg);
  const ex=sx+len1, ey=sy; // côté fixe
  const mx=sx+len2*Math.cos(-rad), my=sy+len2*Math.sin(-rad); // côté mobile
  const ax=sx+r, ay=sy; // départ arc
  const bx=sx+r*Math.cos(-rad), by=sy+r*Math.sin(-rad); // fin arc
  const large=deg>180?1:0;
  const arc=`M ${ax.toFixed(1)} ${ay.toFixed(1)} A ${r} ${r} 0 ${large} 0 ${bx.toFixed(1)} ${by.toFixed(1)}`;
  const c=col||'#222';
  const ac=arcStroke||'#64748b';
  let s=`<line x1="${sx}" y1="${sy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>`;
  s+=`<line x1="${sx}" y1="${sy}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/>`;
  s+=`<path d="${arc}" fill="none" stroke="${ac}" stroke-width="2" stroke-linecap="round"/>`;
  if(label) s+=`<text x="${sx-4}" y="${sy+14}" font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="${c}">${label}</text>`;
  return s;
}

const STEPS=[

// ── PAGE 1 ──────────────────────────────────────────────────────────────────
()=>`
<div class="step-title pop">💡 Comparer des angles</div>
<div class="pourquoi fade-in"><span class="pq-lead">🤔 Pourquoi ?</span> On compare des angles pour s'entraîner à manipuler ces objets géométriques. Cela nous servira plus tard à mieux deviner leur mesure.</div>
<p class="step-text fade-in">On a déjà commencé à comparer des angles par rapport à un angle droit :</p>
<ul class="step-text fade-in" style="padding-left:1.2em;line-height:2">
  <li>les angles <strong>aigus</strong> sont plus petits qu'un angle droit,</li>
  <li>les angles <strong>obtus</strong> sont plus grands qu'un angle droit, et plus petits qu'un angle plat.</li>
</ul>
<div class="bloc prop fade-in"><div class="bloc-header">💡 À retenir</div>Si on tourne plus, l'angle formé sera plus grand.</div>
`,

// ── PAGE 2 ──────────────────────────────────────────────────────────────────
()=>{
  // A=30° (grands côtés r=22), B=50° (petits côtés r=32), C=80° (côtés moyens diff r=18)
  const W=560,H=160;
  // A : sx=60,sy=120, len1=100,len2=90, r=22
  // B : sx=240,sy=130, len1=60,len2=65, r=32
  // C : sx=400,sy=120, len1=80,len2=65, r=18
  let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">`;
  svg+=svgAngle(60,120,30,44,100,90,'#222','A','#64748b');
  svg+=svgAngle(240,130,50,32,60,65,'#222','B','#64748b');
  svg+=svgAngle(400,120,80,18,80,65,'#222','C','#64748b');
  svg+=`</svg>`;
  return `
<div class="step-title pop">✏️ Comparer des angles aigus</div>
<div style="overflow-x:auto;width:100%"><div style="display:flex;justify-content:center">${svg}</div></div>
<p class="step-text fade-in">Ces angles sont rangés du plus petit au plus grand :</p>
<p class="step-text fade-in" style="font-family:'Baloo 2',cursive;font-size:1.25rem;font-weight:800;text-align:center;letter-spacing:.08em">
  Â &lt; B̂ &lt; Ĉ
</p>
<div class="bloc rem fade-in"><div class="bloc-header">⚠️ Attention</div>
L'angle le plus grand est celui pour lequel on a le plus tourné.<br>
Ce n'est <strong>pas</strong> la longueur des côtés qui donne la taille de l'angle.<br>
Ce n'est <strong>pas</strong> le rayon de l'arc de cercle qui donne la taille de l'angle.
</div>`;
},

// ── PAGE 3 ──────────────────────────────────────────────────────────────────
()=>{
  // D=50° bleu foncé (r=28, len=80), E=55° orange foncé (r=22, len=80)
  const W=520,H=170;
  const colD='#1a3a8f', colE='#b45309';
  let svg=`<svg id="svg-p3" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">`;
  svg+=svgAngle(80,125,50,42,110,110,colD,'D',colD);
  svg+=svgAngle(340,125,55,33,110,110,colE,'E',colE);
  // Angle D fantôme (bleu foncé transparent) qui glisse vers E
  const rad50=degToRad(50);
  const gex=80+110, gey=125;
  const gmx=80+110*Math.cos(-rad50), gmy=125+110*Math.sin(-rad50);
  const gax=80+42, gay=125;
  const gbx=80+42*Math.cos(-rad50), gby=125+42*Math.sin(-rad50);
  svg+=`<g id="p3-ghost" opacity="0" style="transition:transform 1.2s ease,opacity .4s">`;
  svg+=`<line x1="80" y1="125" x2="${gex}" y2="${gey}" stroke="${colD}" stroke-width="2.5" stroke-linecap="round"/>`;
  svg+=`<line x1="80" y1="125" x2="${gmx.toFixed(1)}" y2="${gmy.toFixed(1)}" stroke="${colD}" stroke-width="2.5" stroke-linecap="round"/>`;
  svg+=`<path d="M ${gax} ${gay} A 42 42 0 0 0 ${gbx.toFixed(1)} ${gby.toFixed(1)}" fill="none" stroke="${colD}" stroke-width="2"/>`;
  svg+=`</g>`;
  svg+=`</svg>`;
  return `
<div class="step-title pop">✏️ Comparer par superposition</div>
<div style="overflow-x:auto;width:100%"><div style="display:flex;justify-content:center">${svg}</div></div>
<p class="step-text fade-in">Ces deux angles ont presque la même mesure. Pour les comparer, on peut les <strong>superposer</strong>.</p>
<div style="display:flex;justify-content:center">
  <button class="btn-anim fade-in" id="p3-btn" onclick="superposer()">▶ Superposer</button>
</div>
<p id="p3-res" style="opacity:0;transition:opacity .5s;font-family:'Baloo 2',cursive;font-weight:800;font-size:1rem;text-align:center;color:#1e293b">
  L'angle <span style="color:#b45309">Ê</span> est plus grand que l'angle <span style="color:#1a3a8f">D̂</span>
</p>`;
},

// ── PAGE 4 ──────────────────────────────────────────────────────────────────
()=>{
  const svgHTML=`<svg id="svg-p4" width="580" height="110" viewBox="-30 45 600 110" style="display:block;margin:0 auto;overflow:visible"><line x1="70" y1="105" x2="131.1" y2="82.8" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="70" y1="105" x2="13.6" y2="84.5" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><path d="M 85.0 99.5 A 16 16 0 0 0 55.0 99.5" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><text x="62" y="121" font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="#222">F</text><g id="eq-f" opacity="0">
    <polygon points="70.0,105.0 103.8,92.7 91.5,58.9 57.7,71.2" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" fill-opacity="0.7"/>
    <polygon points="70,105 78.5,101.9 75.4,93.5 66.9,96.5" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
    <path id="eq-f-arc" d="M 60.4 78.7 A 28 28 0 0 0 43.7 95.4" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90" stroke-dashoffset="90"/>
    </g><line x1="240" y1="105" x2="298.0" y2="89.5" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="240" y1="105" x2="185.2" y2="100.2" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><path d="M 253.5 101.4 A 14 14 0 0 0 226.1 103.8" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><text x="233" y="121" font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="#222">G</text><g id="eq-g" opacity="0">
    <polygon points="240.0,105.0 274.8,95.7 265.5,60.9 230.7,70.2" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" fill-opacity="0.7"/>
    <polygon points="240,105 248.7,102.7 246.4,94.0 237.7,96.3" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
    <path id="eq-g-arc" d="M 233.5 80.9 A 25 25 0 0 0 215.1 102.8" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90" stroke-dashoffset="90"/>
    </g><line x1="415" y1="105" x2="467.6" y2="80.5" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="415" y1="105" x2="370.0" y2="79.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><path d="M 433.1 96.5 A 20 20 0 0 0 397.7 95.0" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><text x="407" y="121" font-family="Baloo 2,cursive" font-size="13" font-weight="800" fill="#222">H</text><g id="eq-h" opacity="0">
    <polygon points="415.0,105.0 447.6,89.8 432.4,57.2 399.8,72.4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" fill-opacity="0.7"/>
    <polygon points="415,105 423.2,101.2 419.4,93.0 411.2,96.8" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5"/>
    <path id="eq-h-arc" d="M 401.5 76.0 A 32 32 0 0 0 387.3 89.0" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90" stroke-dashoffset="90"/>
    </g></svg>`;
  return `
<div class="step-title pop">✏️ Comparer des angles obtus</div>
<p class="step-text fade-in">Notre œil a souvent du mal à comparer des angles obtus. Pour y arriver, on fait apparaître un angle droit et on compare l'angle aigu qui s'ajoute à l'angle droit.</p>
<div style="overflow-x:auto;width:100%"><div style="display:flex;justify-content:center">${svgHTML}</div></div>
<div style="display:flex;justify-content:center">
  <button class="btn-anim fade-in" id="p4-btn" onclick="comparerObtus()">▶ Comparer</button>
</div>
<p id="p4-res" style="opacity:0;transition:opacity .5s;font-size:1.05rem;text-align:center;color:#475569;font-family:'Baloo 2',cursive;font-weight:700;margin-top:4px">
  L'angle aigu de Ĝ est le plus grand<br><span style="font-size:1.5rem">Ĥ &lt; F̂ &lt; Ĝ</span>
</p>`;
},

// ── PAGE 5 ──────────────────────────────────────────────────────────────────
()=>`
<div class="step-title pop">✏️ Comparer des angles de toutes mesures</div>
<p class="step-text fade-in">On commence par séparer en deux groupes : les angles <strong style="color:var(--bleu)">aigus</strong> (plus petits) et les angles <strong style="color:var(--primary)">obtus</strong> (plus grands). L'angle <strong style="color:var(--violet)">droit</strong> est entre les deux.</p>
<div id="p5-zone" style="width:100%;max-width:580px"></div>
<div style="display:flex;justify-content:center;margin-top:8px">
  <button class="btn-anim fade-in" id="p5-btn" onclick="animerP5()">▶ Comparer</button>
</div>
`,

// ── PAGE 6 ──────────────────────────────────────────────────────────────────
()=>`
<div class="step-title pop">🏆 Ce qu'il faut retenir</div>
<div class="recap-list">
  <div class="recap-item fade-in" style="border-left-color:var(--teal)">
    <div class="recap-num" style="background:var(--teal)">1</div>
    <span>Plus une ligne tourne, plus l'angle qui représente la rotation est <strong>grand</strong>.</span>
  </div>
  <div class="recap-item fade-in" style="animation-delay:.07s;border-left-color:var(--bleu)">
    <div class="recap-num" style="background:var(--bleu)">2</div>
    <span>On peut <strong>superposer</strong> des angles pour les comparer.</span>
  </div>
  <div class="recap-item fade-in" style="animation-delay:.14s;border-left-color:var(--orange)">
    <div class="recap-num" style="background:var(--orange)">3</div>
    <span>Pour comparer des angles obtus, on s'aide d'une <strong>équerre</strong> et on compare les angles aigus qui « dépassent » de l'angle droit.</span>
  </div>
  <div class="recap-item fade-in" style="animation-delay:.21s;border-left-color:var(--violet)">
    <div class="recap-num" style="background:var(--violet)">4</div>
    <span>Pour comparer des angles, on commence par les trier : <strong style="color:var(--bleu)">aigus</strong> | <strong style="color:var(--violet)">droits</strong> | <strong style="color:var(--primary)">obtus</strong>.</span>
  </div>
</div>
`,
];

// ── Animation P3 : superposition ─────────────────────────────────────────────
function superposer(){
  const btn=document.getElementById('p3-btn');
  if(btn) btn.style.display='none';
  const ghost=document.getElementById('p3-ghost');
  if(!ghost) return;
  // D est à sx=80, E est à sx=350 → décalage = 270px en x
  ghost.style.opacity='0.6';
  ghost.style.transition='transform 1.2s ease, opacity .4s';
  ghost.style.transform='translate(260px, 0px)';
  setTimeout(()=>{
    const res=document.getElementById('p3-res');
    if(res){res.style.opacity='1';}
  },1400);
}

// ── Animation P4 : équerre + arc angle aigu ───────────────────────────────────
function comparerObtus(){
  const btn=document.getElementById('p4-btn');
  if(btn) btn.style.display='none';
  ['eq-f','eq-g','eq-h'].forEach((id,i)=>{
    setTimeout(()=>{
      const el=document.getElementById(id);
      if(el){el.style.transition='opacity .5s';el.style.opacity='1';}
      // Après l'équerre, animer l'arc de l'angle aigu
      setTimeout(()=>{
        const arc=document.getElementById(id+'-arc');
        if(arc){
          arc.style.transition='stroke-dashoffset 1s ease';
          arc.style.strokeDashoffset='0';
        }
      },600);
    },i*900);
  });
  setTimeout(()=>{
    const res=document.getElementById('p4-res');
    if(res){res.style.opacity='1';}
  },3500);
}

// ── Animation P5 ────────────────────────────────────────────────────────────
function initP5(){
  const zone=document.getElementById('p5-zone');
  if(!zone) return;
  zone.style.position='relative';
  zone.style.height='300px';

function animerP5(){
  const btn=document.getElementById('p5-btn');
  if(btn) btn.style.display='none';

  const colAigu='#1e40af', colDroit='#5b21b6', colObtus='#be123c';
  const typeColors=[colObtus,colDroit,colObtus,colAigu,colObtus,colObtus,colAigu];
  const bgFill={'0': '#fee2e2', '1': '#ede9fe', '2': '#fee2e2', '3': '#dbeafe', '4': '#fee2e2', '5': '#fee2e2', '6': '#dbeafe'};
  const bgStroke={'0': '#fca5a5', '1': '#c4b5fd', '2': '#fca5a5', '3': '#93c5fd', '4': '#fca5a5', '5': '#fca5a5', '6': '#93c5fd'};

  function sh(id,delay){setTimeout(()=>{const el=document.getElementById(id);if(el){el.style.transition='opacity .4s';el.style.opacity='1';}},delay);}
  function hide(id,delay){setTimeout(()=>{const el=document.getElementById(id);if(el){el.style.transition='opacity .4s';el.style.opacity='0';}},delay);}

  // 1. Tableau apparaît
  sh('p5-table',200);

  // 2. Coloration progressive 0.5s entre chaque
  for(let i=0;i<7;i++){
    const idx=i;
    setTimeout(()=>{
      const g=document.getElementById(`p5-a${idx}`);
      if(g) g.querySelectorAll('line,path').forEach(el=>el.setAttribute('stroke',typeColors[idx]));
    }, 1200+idx*500);
  }
  const allColored=1200+6*500; // 4700ms

  // --- GROUPE AIGUS ---
  // Fond individuel aigu (idx 3 et 6)
  setTimeout(()=>{
    [3,6].forEach(idx=>{
      const bg=document.getElementById(`p5-bg${idx}`);
      if(bg){bg.setAttribute('fill',bgFill[idx]);bg.setAttribute('stroke',bgStroke[idx]);bg.style.transition='opacity .4s';bg.style.opacity='1';}
    });
  }, allColored+500);
  // Déplacements aigus : 50°(idx6) slot gauche, 70°(idx3) slot droite+bas
  const movesAigu=[{idx:6,dstX:30,dy:130},{idx:3,dstX:105,dy:148}];
  movesAigu.forEach((m,mi)=>{
    setTimeout(()=>{
      const g=document.getElementById(`p5-a${m.idx}`);if(!g)return;
      const srcX=[38,118,198,278,358,438,512][m.idx];
      g.style.transition='transform 0.8s ease';
      g.style.transform=`translate(${m.dstX-srcX}px,${m.dy}px)`;
    }, allColored+1500+mi*700);
  });
  // Fonds aigus disparaissent
  setTimeout(()=>[3,6].forEach(idx=>hide(`p5-bg${idx}`,0)), allColored+1500+2*700+800);

  // --- GROUPE DROIT ---
  const afterAigu=allColored+1500+2*700+1800;
  setTimeout(()=>{
    const bg=document.getElementById('p5-bg1');
    if(bg){bg.setAttribute('fill',bgFill[1]);bg.setAttribute('stroke',bgStroke[1]);bg.style.transition='opacity .4s';bg.style.opacity='1';}
  }, afterAigu);
  setTimeout(()=>{
    const g=document.getElementById('p5-a1');if(!g)return;
    const srcX=118;
    g.style.transition='transform 0.8s ease';
    g.style.transform=`translate(${215-srcX}px,148px)`;
  }, afterAigu+1000);
  setTimeout(()=>hide('p5-bg1',0), afterAigu+1000+800+800);

  // --- GROUPE OBTUS ---
  const afterDroit=afterAigu+1000+800+1800;
  const obtusIdx=[4,0,5,2]; // 100°,140°,155°,170°
  setTimeout(()=>{
    obtusIdx.forEach(idx=>{
      const bg=document.getElementById(`p5-bg${idx}`);
      if(bg){bg.setAttribute('fill',bgFill[idx]);bg.setAttribute('stroke',bgStroke[idx]);bg.style.transition='opacity .4s';bg.style.opacity='1';}
    });
  }, afterDroit);
  // obtus : 100°(idx4) dy=130, 140°(idx0) dy=148, 155°(idx5) dy=130, 170°(idx2) dy=148
  const obtusMoves=[{idx:4,dstX:300,dy:130},{idx:0,dstX:380,dy:148},{idx:5,dstX:440,dy:165},{idx:2,dstX:510,dy:175}];
  obtusMoves.forEach((m,mi)=>{
    setTimeout(()=>{
      const g=document.getElementById(`p5-a${m.idx}`);if(!g)return;
      const srcX=[38,118,198,278,358,438,512][m.idx];
      g.style.transition='transform 0.8s ease';
      g.style.transform=`translate(${m.dstX-srcX}px,${m.dy}px)`;
    }, afterDroit+1000+mi*700);
  });
  const afterObtus=afterDroit+1000+4*700+800;
  obtusMoves.forEach(m=>setTimeout(()=>hide(`p5-bg${m.idx}`,0), afterObtus));

  // Phrase finale
  sh('p5-final', afterObtus+800);
}

// ── Navigation ───────────────────────────────────────────────────────────────// ── Navigation ───────────────────────────────────────────────────────────────
let cur=0;
const NSTEPS=STEPS.length;
function render(){
  const card=document.getElementById('card');
  card.innerHTML=typeof STEPS[cur]==='function'?STEPS[cur]():'';
  card.className='card fade-in';
  // Init P5 : afficher les angles d'emblée
  if(cur===4) initP5();
  document.getElementById('progressBar').style.width=(cur/(NSTEPS-1)*100)+'%';
  const ind=document.getElementById('stepsIndicator');ind.innerHTML='';
  for(let i=0;i<NSTEPS;i++){
    const d=document.createElement('div');
    d.className='step-dot'+(i===cur?' active':i<cur?' done':'');
    d.textContent=i<cur?'✓':i+1;ind.appendChild(d);
  }
  document.getElementById('counter').textContent=`Page ${cur+1} / ${NSTEPS}`;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').textContent=cur===NSTEPS-1?'🔁 Recommencer':'Suivant →';
}
function next(){cur=cur===NSTEPS-1?0:cur+1;render();}
function prev(){if(cur>0){cur--;render();}}
render();
</script>
