<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="darkreader-lock">
<title>G4 — Rédiger un programme de construction</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  /* --- dominante du module Géométrie --- */
  --primary:#16a34a;--primary2:#4ade80;--primary-clair:#dcfce7;
  --bg:#f0fdf4;--cote:#166534;
  /* --- palette pédagogique constante (identique aux autres modules) --- */
  --bleu:#1a73e8;--bleu-clair:#e8f0fe;
  --orange:#ea580c;--orange-clair:#ffedd5;
  --vert:#16a34a;--vert-clair:#f0fdf4;
  --violet:#7c3aed;--violet-clair:#f5f3ff;
  --gris:#94a3b8;
  --teal:#0d9488;--teal-clair:#f0fdfa;
  --card:#fff;--texte:#1e293b;--border:#e2e8f0;
  /* --- conventions de figures (identiques aux exercices WIMS du module) --- */
  --fig-bleu:#1d4ed8;--fig-gris:#9ca3af;--fig-label:#4b5563;--fig-cod:#c4c9d1;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px;color:var(--texte);}
header{display:flex;justify-content:center;margin-bottom:22px;}
.header-row{display:flex;align-items:center;gap:14px;max-width:680px;width:100%;}
.badge-code{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:48px;border-radius:12px;border:2.5px solid var(--primary);background:var(--primary-clair);font-family:'Baloo 2',cursive;font-size:1.3rem;font-weight:800;color:var(--primary);flex-shrink:0;}
.tache-label{font-family:'Baloo 2',cursive;font-size:1.05rem;font-weight:800;color:var(--primary);line-height:1.3;}
.progress-bar-wrap{width:100%;max-width:680px;background:var(--primary-clair);border-radius:99px;height:10px;margin-bottom:18px;overflow:hidden;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:99px;transition:width .5s ease;}
.steps-indicator{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;}
.step-dot{width:34px;height:34px;border-radius:50%;background:var(--primary-clair);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:var(--primary2);transition:all .4s;border:2px solid transparent;cursor:pointer;user-select:none;}
.step-dot:hover{border-color:var(--primary2);}
.step-dot.active{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.15);box-shadow:0 0 0 4px var(--primary-clair);}
.step-dot.done{background:var(--vert);color:#fff;border-color:var(--vert);}
.card{background:var(--card);border-radius:20px;padding:26px 24px;max-width:680px;width:100%;min-height:360px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 4px 24px rgba(22,101,52,.10);position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px 20px 0 0;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease both;}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease both;}
.step-title{font-family:'Baloo 2',cursive;font-size:1.15rem;font-weight:800;color:var(--cote);text-align:center;line-height:1.3;}
.step-text{font-size:.97rem;line-height:1.7;text-align:left;max-width:580px;width:100%;}
.pourquoi{background:var(--teal-clair);border-left:4px solid var(--teal);border-radius:10px;padding:12px 15px;font-size:.92rem;font-weight:600;color:#134e4a;line-height:1.6;max-width:580px;width:100%;}
.pq-lead{font-family:'Baloo 2',cursive;font-weight:800;color:var(--teal);}
.info{border-radius:12px;padding:12px 16px;font-weight:600;font-size:.92rem;line-height:1.6;max-width:580px;width:100%;}
.info.primary{background:var(--primary-clair);border-left:4px solid var(--primary);color:var(--cote);}
.info.vert{background:var(--vert-clair);border-left:4px solid var(--vert);color:#14532d;}
.info.bleu{background:var(--bleu-clair);border-left:4px solid var(--bleu);color:#1e3a5f;}
.info.violet{background:var(--violet-clair);border-left:4px solid var(--violet);color:#4c1d95;}
.info.orange{background:var(--orange-clair);border-left:4px solid var(--orange);color:#7c2d12;}
.definition{background:#eef2ff;border-left:4px solid #4f46e5;border-radius:10px;padding:12px 16px;font-size:.92rem;font-weight:600;line-height:1.6;color:#312e81;max-width:580px;width:100%;}
.def-lead{font-family:'Baloo 2',cursive;font-weight:800;color:#4f46e5;display:block;margin-bottom:4px;}
.etapes{display:flex;flex-direction:column;gap:10px;max-width:580px;width:100%;text-align:left;}
.etape{display:flex;align-items:flex-start;gap:11px;}
.etape-num{min-width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;
  font-weight:800;font-size:.8rem;flex-shrink:0;margin-top:1px;}
.etape-txt{flex:1;line-height:1.55;}
.liste-simple{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:580px;width:100%;text-align:left;font-size:.97rem;line-height:1.55;}
.duo{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;max-width:580px;width:100%;}
.duo figure{margin:0;flex:1 1 150px;max-width:230px;}
.exemple-bloc{border:1.5px solid #e0e7ff;background:#f8faff;border-radius:16px;padding:14px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:580px;width:100%;}
.exemple-bloc figure{margin:0;}
.type-label{font-family:'Baloo 2',cursive;font-weight:800;color:var(--primary);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;align-self:flex-start;}
.compare-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;max-width:580px;width:100%;}
.compare-row .info{flex:1 1 240px;max-width:270px;}
figure{text-align:center;width:100%;}
svg{max-width:100%;height:auto;overflow:visible;}
figcaption{font-size:.85rem;color:var(--gris);margin-top:1px;line-height:1.3;}
.cap-lead{display:block;color:var(--texte);font-size:.85rem;}
.cle{color:var(--cote);font-weight:700;}
.mot-bleu{color:var(--fig-bleu);font-weight:700;}
.mot-orange{color:var(--orange);font-weight:700;}
.rep{opacity:0;transition:opacity .3s ease;max-width:580px;width:100%;text-align:center;font-size:.95rem;line-height:1.7;}
.rep.on{opacity:1;}
.btn-complete{border:2px solid var(--teal);background:var(--teal-clair);color:var(--teal);font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;border-radius:10px;padding:10px 22px;cursor:pointer;transition:all .2s;}
.btn-complete:hover{background:var(--teal);color:#fff;}
.btn-complete:disabled{opacity:.45;cursor:default;}
.btn-anim{border:2px solid var(--violet);background:var(--violet-clair);color:var(--violet);font-family:'Baloo 2',cursive;font-size:.95rem;font-weight:700;border-radius:10px;padding:9px 20px;cursor:pointer;transition:all .2s;}
.btn-anim:hover{background:var(--violet);color:#fff;}
.recap-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:580px;}
.recap-item{display:flex;gap:12px;align-items:flex-start;background:#f8faff;border-radius:12px;padding:11px 16px;border-left:4px solid transparent;text-align:left;font-size:.92rem;line-height:1.55;}
.recap-num{min-width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',cursive;font-weight:800;font-size:.9rem;color:#fff;flex-shrink:0;}
.nav{display:flex;align-items:center;justify-content:space-between;max-width:680px;width:100%;margin-top:20px;gap:12px;}
.btn-nav{font-family:'Baloo 2',cursive;font-weight:700;font-size:1rem;border:none;border-radius:12px;padding:11px 22px;cursor:pointer;transition:all .25s;}
.btn-prev{background:var(--primary-clair);color:var(--primary);}
.btn-prev:hover{background:var(--primary);color:#fff;}
.btn-prev:disabled{opacity:.35;cursor:default;}
.btn-next{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;}
.btn-next:hover{opacity:.9;}
.step-counter{font-family:'Baloo 2',cursive;font-weight:700;color:var(--primary);font-size:.95rem;white-space:nowrap;}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="badge-code">G4</div>
    <div class="tache-label">Rédiger un programme de construction</div>
  </div>
</header>
<div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div class="steps-indicator" id="stepsIndicator"></div>
<div class="card" id="card"></div>
<div class="nav">
  <button class="btn-nav btn-prev" id="btnPrev">← Retour</button>
  <span class="step-counter" id="counter"></span>
  <button class="btn-nav btn-next" id="btnNext">Suivant →</button>
</div>

<script>
/* =========================================================================
   Conventions de figure (identiques aux exercices WIMS du module) :
   objet mis en avant #1d4ed8 · contexte #9ca3af · étiquettes #4b5563
   Sur les pages "Ordonner les instructions", exception assumée : chaque
   étape du programme utilise sa PROPRE couleur (dégradé froid→chaud, la
   même convention que l'exercice WIMS G4), plutôt que le bleu unique
   habituel — la couleur sert ici à relier une consigne à son tracé.
   ========================================================================= */
const BLEU='#1d4ed8', GRIS='#9ca3af', LAB='#4b5563', OR='#ea580c', VIOLET='#7c3aed', ROUGE='#dc2626';

/* croix d'un point (un seul path, 2 diagonales) */
function croix(x,y,col,w,t){
  w=w||5.5; t=t||1.9;
  return '<path d="M'+(x-w)+','+(y-w)+' L'+(x+w)+','+(y+w)+
         ' M'+(x-w)+','+(y+w)+' L'+(x+w)+','+(y-w)+
         '" stroke="'+col+'" stroke-width="'+t+'" stroke-linecap="round" fill="none"/>';
}
/* étiquette : contour blanc fin, dessinée AVANT la croix */
function lab(x,y,txt,col){
  return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-family="Nunito,sans-serif"'+
         ' font-size="15" font-weight="700" fill="'+(col||LAB)+'"'+
         ' paint-order="stroke" stroke="#fff" stroke-width="1.4">'+txt+'</text>';
}
/* point sur le segment [p1p2] à la fraction t (0..1) */
function onLine(p1,p2,t){
  return [p1[0]+(p2[0]-p1[0])*t, p1[1]+(p2[1]-p1[1])*t];
}
/* point sur un cercle de centre (cx,cy) et de rayon r, à l'angle deg (°) */
function arcPoint(cx,cy,r,deg){
  const a=deg*Math.PI/180;
  return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
}

/* dégradé "étapes d'un programme de construction" (froid→chaud), repris
   tel quel de l'exercice WIMS G4 */
const GRAD=['#2563eb','#7c3aed','#c026d3','#e11d48'];

/* liste d'étapes déjà révélées (pages "Ordonner les instructions"), avec la
   dernière ajoutée qui pop (fade-in) */
function listeEtapes(consignes, stepIdx){
  if(stepIdx===0) return '<p class="step-text" style="margin:0;color:var(--gris)">Clique sur « Étape suivante » pour commencer.</p>';
  return consignes.slice(0,stepIdx).map((txt,idx)=>`
    <div class="etape${idx===stepIdx-1?' fade-in':''}">
      <div class="etape-num" style="background:${GRAD[idx]}">${idx+1}</div>
      <div class="etape-txt">${txt}</div>
    </div>`).join('');
}

/* ========================== LES PAGES ================================== */
const STEPS=[

/* ---------- 0. pourquoi ---------- */
{ titre:"💡 Rédiger un programme de construction",
  html:()=>`
  <div class="pourquoi fade-in">
    <span class="pq-lead">🤔 Pourquoi ?</span>
    En écrivant des instructions précises, une autre personne pourra comprendre comment construire notre
    dessin. On s'entraîne aussi à détailler les étapes pour mieux comprendre de quoi est constitué un
    dessin en géométrie.
  </div>
  <p class="step-text fade-in">Dans cette capsule, nous allons voir :</p>
  <div class="etapes fade-in">
    <div class="etape"><div class="etape-num">1</div><div class="etape-txt">donner des <span class="cle">noms</span> aux objets</div></div>
    <div class="etape"><div class="etape-num">2</div><div class="etape-txt">utiliser un vocabulaire <span class="cle">précis</span></div></div>
    <div class="etape"><div class="etape-num">3</div><div class="etape-txt">respecter l'<span class="cle">ordre</span> des instructions</div></div>
  </div>`
},

/* ---------- 1. donner des noms aux objets ---------- */
{ titre:"✏️ Donner des noms aux objets",
  html:()=>{
    const pointsFig=`
      <svg viewBox="0 0 140 80" width="130" role="img" aria-label="trois points nommés A, B et C">
        ${croix(30,50,BLEU,5,1.8)}${croix(80,25,BLEU,5,1.8)}${croix(115,55,BLEU,5,1.8)}
        ${lab(30,68,'A')}${lab(80,12,'B')}${lab(129,55,'C')}
      </svg>`;

    const segFig=`
      <svg viewBox="0 0 140 80" width="130" role="img" aria-label="un segment nommé D E">
        <line x1="28" y1="58" x2="112" y2="38" stroke="${BLEU}" stroke-width="2.4"/>
        ${croix(28,58,BLEU,5,1.8)}${croix(112,38,BLEU,5,1.8)}
        ${lab(28,42,'D')}${lab(120,24,'E')}
      </svg>`;

    const P1=[20,60], P2=[160,35];
    const [Fx,Fy]=onLine(P1,P2,0.15), [Gx,Gy]=onLine(P1,P2,0.5), [Jx,Jy]=onLine(P1,P2,0.85);
    const Hx=95, Hy=18;
    const droiteFig=`
      <svg viewBox="0 0 180 90" width="190" role="img" aria-label="une droite avec trois points dessus et un point en dehors">
        <line x1="${P1[0]}" y1="${P1[1]}" x2="${P2[0]}" y2="${P2[1]}" stroke="${BLEU}" stroke-width="2.4"/>
        ${croix(Fx,Fy,BLEU,5,1.8)}${croix(Gx,Gy,BLEU,5,1.8)}${croix(Jx,Jy,BLEU,5,1.8)}${croix(Hx,Hy,GRIS,5,1.8)}
        ${lab(Fx,Fy+18,'F')}${lab(Gx,Gy+18,'G')}${lab(Jx,Jy+18,'J')}${lab(Hx,Hy-14,'H',LAB)}
      </svg>`;

    const cx=75, cy=75, R=55;
    const pentaPts={
      N: arcPoint(cx,cy,R,-90),
      P: arcPoint(cx,cy,R,-18),
      S: arcPoint(cx,cy,R,54),
      R_: arcPoint(cx,cy,R,126),
      T: arcPoint(cx,cy,R,198),
    };
    const ordre=['N','P','S','R_','T'];
    const pts=ordre.map(k=>pentaPts[k]);
    const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L')+' Z';
    let peri=0;
    for(let k=0;k<pts.length;k++){ const a=pts[k], b=pts[(k+1)%pts.length]; peri+=Math.hypot(b[0]-a[0],b[1]-a[1]); }
    const labelOffsets={N:[0,-12], P:[16,-4], S:[10,16], R_:[-10,16], T:[-16,-4]};
    const labelNoms={N:'N',P:'P',S:'S',R_:'R',T:'T'};
    const pauseFrac=1/7, drawFrac=3/7, drawEnd=pauseFrac+drawFrac;
    const polyLabels=ordre.map((k,idx)=>{
      const [px,py]=pentaPts[k]; const [ox,oy]=labelOffsets[k];
      const vf=(pauseFrac+(idx/ordre.length)*drawFrac).toFixed(3);
      return `<text x="${px+ox}" y="${py+oy}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="15" font-weight="700" fill="#000" paint-order="stroke" stroke="#fff" stroke-width="1.4">${labelNoms[k]}
        <animate attributeName="fill" values="#000;#000;${ROUGE};${ROUGE}" keyTimes="0;${vf};${vf};1" dur="7s" repeatCount="indefinite"/>
      </text>`;
    }).join('');
    const polyFig=`
      <svg viewBox="0 0 150 150" width="150" role="img" aria-label="un pentagone nommé N P S R T, tracé en suivant son contour">
        <path d="${d}" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="${d}" fill="none" stroke="${ROUGE}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"
              stroke-dasharray="${peri.toFixed(1)}" stroke-dashoffset="${peri.toFixed(1)}">
          <animate attributeName="stroke-dashoffset" values="${peri.toFixed(1)};${peri.toFixed(1)};0;0" keyTimes="0;${pauseFrac.toFixed(3)};${drawEnd.toFixed(3)};1" dur="7s" repeatCount="indefinite"/>
        </path>
        ${polyLabels}
      </svg>`;

    const [Kx,Ky]=arcPoint(70,70,50,205), [Lx,Ly]=arcPoint(70,70,50,25);
    const cercleDiamFig=`
      <svg viewBox="0 0 140 140" width="130" role="img" aria-label="un cercle nommé par son diamètre K L">
        <circle cx="70" cy="70" r="50" fill="none" stroke="${GRIS}" stroke-width="1.6"/>
        <line x1="${Kx.toFixed(1)}" y1="${Ky.toFixed(1)}" x2="${Lx.toFixed(1)}" y2="${Ly.toFixed(1)}" stroke="${BLEU}" stroke-width="2.4"/>
        ${croix(Kx,Ky,BLEU,4.5,1.6)}${croix(Lx,Ly,BLEU,4.5,1.6)}
        ${lab(Kx-14,Ky+4,'K')}${lab(Lx+14,Ly-4,'L')}
      </svg>`;

    const [Nx,Ny]=arcPoint(70,70,50,-35);
    const cercleCentreFig=`
      <svg viewBox="0 0 140 140" width="130" role="img" aria-label="un cercle nommé par son centre M et un point N">
        <circle cx="70" cy="70" r="50" fill="none" stroke="${GRIS}" stroke-width="1.6"/>
        <line x1="70" y1="70" x2="${Nx.toFixed(1)}" y2="${Ny.toFixed(1)}" stroke="${BLEU}" stroke-width="2.4"/>
        ${croix(70,70,BLEU,4.5,1.6)}${croix(Nx,Ny,BLEU,4.5,1.6)}
        ${lab(82,84,'M')}${lab(Nx+12,Ny-6,'N')}
      </svg>`;

    return `
  <p class="step-text fade-in">Pour pouvoir se comprendre, il est utile de donner des noms aux objets
  mathématiques :</p>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Points</div>
    <p class="step-text" style="margin:0"><strong>Les points</strong> se nomment avec une lettre
    majuscule.</p>
    <figure>${pointsFig}<figcaption><span class="cap-lead">les points A, B et C</span></figcaption></figure>
  </div>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Segments</div>
    <p class="step-text" style="margin:0"><strong>Les segments</strong> se nomment avec leurs deux
    extrémités, écrites entre crochets.</p>
    <figure>${segFig}<figcaption><span class="cap-lead">un segment [DE]</span>on peut aussi l'appeler [ED]</figcaption></figure>
  </div>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Droites</div>
    <p class="step-text" style="margin:0"><strong>Les droites</strong> se nomment avec deux de leurs
    points, écrits entre parenthèses.</p>
    <figure>${droiteFig}<figcaption><span class="cap-lead">Une droite (FG)</span>on peut aussi l'appeler (FJ), (GJ), (GF), (JF) ou (JG).</figcaption></figure>
  </div>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Polygones</div>
    <p class="step-text" style="margin:0"><strong>Les polygones</strong> se nomment en suivant leurs
    sommets, dans l'ordre du contour.</p>
    <figure>${polyFig}<figcaption><span class="cap-lead">le polygone NPSRT</span></figcaption></figure>
  </div>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Cercles</div>
    <p class="step-text" style="margin:0"><strong>Les cercles</strong> peuvent se nommer de deux façons : par
    un diamètre, ou par leur centre et un point.</p>
    <div class="duo">
      <figure>${cercleDiamFig}<figcaption><span class="cap-lead">le cercle de diamètre [KL]</span></figcaption></figure>
      <figure>${cercleCentreFig}<figcaption><span class="cap-lead">le cercle de centre M qui passe par N</span>c'est aussi le cercle de centre M et de rayon [MN]</figcaption></figure>
    </div>
  </div>`;
  }
},

/* ---------- 2. utiliser un vocabulaire savant ---------- */
{ titre:"✏️ Utiliser un vocabulaire savant",
  html:()=>{
    const ptFig=`
      <svg viewBox="0 4 80 38" width="80" role="img" aria-label="un point nommé P">
        ${croix(40,34,BLEU,5,1.8)}${lab(40,18,'P')}
      </svg>`;

    const segFig=`
      <svg viewBox="0 0 130 70" width="120" role="img" aria-label="un segment nommé B R">
        <line x1="25" y1="52" x2="105" y2="20" stroke="${BLEU}" stroke-width="2.4"/>
        ${croix(25,52,BLEU,5,1.8)}${croix(105,20,BLEU,5,1.8)}
        ${lab(17,66,'B')}${lab(113,10,'R')}
      </svg>`;

    const P1=[10,55], P2=[120,15];
    const [Dx,Dy]=onLine(P1,P2,0.28), [Hx,Hy]=onLine(P1,P2,0.72);
    const droiteFig=`
      <svg viewBox="0 0 130 70" width="120" role="img" aria-label="une droite nommée D H">
        <line x1="${P1[0]}" y1="${P1[1]}" x2="${P2[0]}" y2="${P2[1]}" stroke="${BLEU}" stroke-width="2.4"/>
        ${croix(Dx,Dy,BLEU,5,1.8)}${croix(Hx,Hy,BLEU,5,1.8)}
        ${lab(Dx,Dy+18,'D')}${lab(Hx,Hy-14,'H')}
      </svg>`;

    const [Dax,Day]=arcPoint(45,45,32,200), [Dbx,Dby]=arcPoint(45,45,32,20);
    const diamFig=`
      <svg viewBox="8 8 74 74" width="90" role="img" aria-label="un cercle avec son diamètre">
        <circle cx="45" cy="45" r="32" fill="none" stroke="${GRIS}" stroke-width="1.6"/>
        <line x1="${Dax.toFixed(1)}" y1="${Day.toFixed(1)}" x2="${Dbx.toFixed(1)}" y2="${Dby.toFixed(1)}" stroke="${BLEU}" stroke-width="2.4"/>
      </svg>`;

    const [Rax,Ray]=arcPoint(45,45,32,-40);
    const rayonFig=`
      <svg viewBox="8 8 74 74" width="90" role="img" aria-label="un cercle avec son rayon">
        <circle cx="45" cy="45" r="32" fill="none" stroke="${GRIS}" stroke-width="1.6"/>
        <line x1="45" y1="45" x2="${Rax.toFixed(1)}" y2="${Ray.toFixed(1)}" stroke="${BLEU}" stroke-width="2.4"/>
      </svg>`;

    const Aq=[15,62], Bq=[72,50], Cq=[78,14], Dq=[18,20];
    const diagFig=`
      <svg viewBox="10 9 73 58" width="90" role="img" aria-label="un polygone avec une diagonale">
        <path d="M${Aq[0]},${Aq[1]} L${Bq[0]},${Bq[1]} L${Cq[0]},${Cq[1]} L${Dq[0]},${Dq[1]} Z" fill="none" stroke="${GRIS}" stroke-width="1.6"/>
        <line x1="${Aq[0]}" y1="${Aq[1]}" x2="${Cq[0]}" y2="${Cq[1]}" stroke="${BLEU}" stroke-width="2.4"/>
      </svg>`;

    const pcx=45, pcy=45, pThetaDeg=22, pTheta=pThetaDeg*Math.PI/180;
    const pux=Math.cos(pTheta), puy=Math.sin(pTheta);
    const pvx=Math.cos(pTheta+Math.PI/2), pvy=Math.sin(pTheta+Math.PI/2);
    const pL1a=16, pL1b=40, pL2a=34, pL2b=14;
    const pp1a=[pcx-pux*pL1a, pcy-puy*pL1a], pp1b=[pcx+pux*pL1b, pcy+puy*pL1b];
    const pp2a=[pcx-pvx*pL2a, pcy-pvy*pL2a], pp2b=[pcx+pvx*pL2b, pcy+pvy*pL2b];
    const perpFig=`
      <svg viewBox="20 5 70 65" width="90" role="img" aria-label="deux lignes perpendiculaires">
        <line x1="${pp1a[0].toFixed(1)}" y1="${pp1a[1].toFixed(1)}" x2="${pp1b[0].toFixed(1)}" y2="${pp1b[1].toFixed(1)}" stroke="${BLEU}" stroke-width="2.2"/>
        <line x1="${pp2a[0].toFixed(1)}" y1="${pp2a[1].toFixed(1)}" x2="${pp2b[0].toFixed(1)}" y2="${pp2b[1].toFixed(1)}" stroke="${BLEU}" stroke-width="2.2"/>
        <g transform="translate(${pcx},${pcy}) rotate(${pThetaDeg})"><rect x="0" y="-11" width="11" height="11" fill="none" stroke="${LAB}" stroke-width="1.4"/></g>
      </svg>`;

    return `
  <p class="step-text fade-in">Pour se comprendre, il faut utiliser des mots précis. Voici quelques rappels du
  travail fait dans l'exercice G3 :</p>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Point</div>
    <p class="step-text" style="margin:0">Quand on indique un emplacement précis, on parle de
    <span class="cle">point</span>.</p>
    <figure>${ptFig}<figcaption><span class="cap-lead">un point P</span></figcaption></figure>
  </div>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Segments et droites</div>
    <p class="step-text" style="margin:0">Quand on parle d'une ligne, il faut préciser si c'est une
    <span class="cle">droite</span> ou un <span class="cle">segment</span>.</p>
    <div class="duo">
      <figure>${segFig}<figcaption><span class="cap-lead">un segment [BR]</span></figcaption></figure>
      <figure>${droiteFig}<figcaption><span class="cap-lead">une droite (DH)</span></figcaption></figure>
    </div>
  </div>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Diamètre, rayon, diagonale</div>
    <p class="step-text" style="margin:0">Une ligne peut aussi être un <span class="cle">diamètre</span> d'un
    cercle, un <span class="cle">rayon</span>, ou une <span class="cle">diagonale</span> d'un polygone… C'est
    important de donner cette information.</p>
    <div class="duo">
      <figure>${diamFig}<figcaption><span class="cap-lead">un diamètre</span></figcaption></figure>
      <figure>${rayonFig}<figcaption><span class="cap-lead">un rayon</span></figcaption></figure>
      <figure>${diagFig}<figcaption><span class="cap-lead">une diagonale</span></figcaption></figure>
    </div>
  </div>

  <div class="exemple-bloc fade-in">
    <div class="type-label">Perpendiculaires</div>
    <p class="step-text" style="margin:0">Si on doit tracer une ligne qui forme un angle droit avec une autre
    ligne déjà tracée, on dit qu'elles sont <span class="cle">perpendiculaires</span>.</p>
    <figure>${perpFig}<figcaption><span class="cap-lead">deux lignes perpendiculaires</span></figcaption></figure>
  </div>`;
  }
},

/* ---------- 3. ordonner les instructions ---------- */
{ titre:"✏️ Ordonner les instructions",
  stepwise:4,
  html:(revealed,stepIdx)=>{
    stepIdx=stepIdx||0;
    const Ax=50, Ay=110, Bx=110, By=110, Cx=80, Cy=58.04;
    const consignes=[
      'Placer deux points A et B.',
      'Tracer le cercle de centre A passant par B, et le cercle de centre B passant par A.',
      "Nommer C l'un des points d'intersection de ces deux cercles.",
      'Tracer le triangle ABC.'
    ];
    const svg=`
    <svg viewBox="-15 35 190 145" width="220" role="img" aria-label="construction d'un triangle équilatéral, étape par étape">
      <g opacity="${stepIdx>=1?1:0}" class="${stepIdx===1?'fade-in':''}">
        ${croix(Ax,Ay,GRAD[0],5,1.8)}${croix(Bx,By,GRAD[0],5,1.8)}
        ${lab(Ax-14,Ay+14,'A',GRAD[0])}${lab(Bx+14,By+14,'B',GRAD[0])}
      </g>
      <g opacity="${stepIdx>=2?1:0}" class="${stepIdx===2?'fade-in':''}">
        <circle cx="${Ax}" cy="${Ay}" r="60" fill="none" stroke="${GRAD[1]}" stroke-width="2"/>
        <circle cx="${Bx}" cy="${By}" r="60" fill="none" stroke="${GRAD[1]}" stroke-width="2"/>
      </g>
      <g opacity="${stepIdx>=3?1:0}" class="${stepIdx===3?'fade-in':''}">
        ${croix(Cx,Cy,GRAD[2],5,1.8)}
        ${lab(Cx,Cy-14,'C',GRAD[2])}
      </g>
      <g opacity="${stepIdx>=4?1:0}" class="${stepIdx===4?'fade-in':''}">
        <path d="M${Ax},${Ay} L${Bx},${By} L${Cx},${Cy} Z" fill="none" stroke="${GRAD[3]}" stroke-width="2.6" stroke-linejoin="round"/>
      </g>
    </svg>`;
    return `
  <p class="step-text fade-in">Pour réussir à construire un dessin, il faut suivre l'ordre des étapes.</p>
  <div class="exemple-bloc fade-in">
    <div class="etapes">${listeEtapes(consignes,stepIdx)}</div>
    <figure>${svg}</figure>
  </div>`;
  }
},

/* ---------- 4. un autre exemple ---------- */

        ${lab(A[0]-10,A[1]-8,'A',GRAD[0])}${lab(B[0]+10,B[1]-8,'B',GRAD[0])}${lab(C[0]+10,C[1]+16,'C',GRAD[0])}${lab(D[0]-10,D[1]+16,'D',GRAD[0])}

/* ========================== MOTEUR ===================================== */
let i=0, revealed=false, stepIdx=0; const N=STEPS.length;
const card=document.getElementById('card'),
      progressBar=document.getElementById('progressBar'),
      stepsIndicator=document.getElementById('stepsIndicator'),
      btnPrev=document.getElementById('btnPrev'),
      btnNext=document.getElementById('btnNext'),
      counter=document.getElementById('counter');

function goTo(k){ i=k; revealed=false; stepIdx=0; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function render(){
  const s=STEPS[i];
  card.innerHTML =
    '<div class="step-title pop">'+s.titre+'</div>'+
    s.html(revealed,stepIdx)+
    (s.comp  ? '<button class="btn-complete fade-in" id="btnc"'+(revealed?' disabled':'')+'>✏️ Compléter</button>' : '')+
    (s.trace ? '<button class="btn-anim fade-in" id="btnt">▶ Tracer</button>' : '')+
    (s.stepwise ? '<button class="btn-anim fade-in" id="btns">'+(stepIdx>=s.stepwise?'🔁 Revoir depuis le début':'▶ Étape suivante')+'</button>' : '');
  const b=document.getElementById('btnc');
  if(b) b.addEventListener('click',()=>{revealed=true;render();});
  const t=document.getElementById('btnt');
  if(t) t.addEventListener('click',()=>{
    card.querySelectorAll('.master').forEach(a=>{ if(a.beginElement) a.beginElement(); });
  });
  const bs=document.getElementById('btns');
  if(bs) bs.addEventListener('click',()=>{
    stepIdx = stepIdx>=s.stepwise ? 0 : stepIdx+1;
    render();
  });

  progressBar.style.width=(i/(N-1)*100)+'%';
  stepsIndicator.innerHTML='';
  for(let k=0;k<N;k++){
    const d=document.createElement('div');
    d.className='step-dot'+(k===i?' active':k<i?' done':'');
    d.textContent=k<i?'✓':k+1;
    d.addEventListener('click',()=>goTo(k));
    stepsIndicator.appendChild(d);
  }
  counter.textContent=`Page ${i+1} / ${N}`;
  btnPrev.disabled = (i===0);
  btnNext.textContent = i===N-1 ? '🔁 Recommencer' : 'Suivant →';
}
btnPrev.addEventListener('click',()=>{ if(i>0) goTo(i-1); });
btnNext.addEventListener('click',()=>{ goTo(i===N-1?0:i+1); });
render();
</script>
